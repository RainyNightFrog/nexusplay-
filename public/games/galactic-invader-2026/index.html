  function loadSettings() {
    var base = { sfx: true, shake: true };
    try {
      if (typeof RNF !== "undefined" && RNF.getSettings) {
        var s = RNF.getSettings();
        base.sfx = (s.sfxVolume == null ? 0.75 : s.sfxVolume) > 0.02;
        base.shake = s.screenShake !== false;
      }
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) Object.assign(base, JSON.parse(raw));
    } catch (_e) {}
    return base;
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameSettings));
      if (typeof RNF !== "undefined" && RNF.setSettings) {
        RNF.setSettings({
          sfxVolume: gameSettings.sfx ? 0.75 : 0,
          screenShake: !!gameSettings.shake
        });
      }
    } catch (_e) {}
  }

  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function rnfGameVolMul() {
    try {
      if (typeof RNF !== "undefined" && RNF.getGameVolume) return RNF.getGameVolume();
      if (typeof window !== "undefined" && typeof window.__RNF_GAME_VOLUME__ === "number") return window.__RNF_GAME_VOLUME__;
    } catch (_e) {}
    return 1;
  }
  function tone(freq, dur, type, vol, slide) {
    if (!gameSettings.sfx || rnfGameVolMul() <= 0) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime((vol || 0.1) * rnfGameVolMul(), t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

    var n = Phaser.Math.Clamp(count || 20, 15, 40);

      speed: { min: 90, max: 420 },
      angle: { min: 0, max: 360 },
      lifespan: { min: 260, max: 720 },
      scale: { start: 1.35, end: 0 },
      alpha: { start: 1, end: 0 },
      gravityY: 30,
      blendMode: "ADD",
      tint: tint,
      emitting: false
    });
    emitter.explode(n);
    scene.time.delayedCall(900, function () { if (emitter.destroy) emitter.destroy(); });
  }

  }

      targets: ring, scale: (maxR || 100) / 12, alpha: 0, duration: 380, ease: "Cubic.easeOut",

  function pulseBtn(scene, targets) {
    scene.tweens.add({
      targets: targets, scale: 1.08, duration: 90, yoyo: true, ease: "Back.easeOut"
    });
  }

  function makeButton(scene, x, y, label, color, onClick, width) {
    var bw = width || 300;
    var bg = scene.add.rectangle(x, y, bw, 44, color, 0.2)
      .setStrokeStyle(2, color, 0.9)
      .setInteractive({ useHandCursor: true });
    var txt = scene.add.text(x, y, label, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "18px", fontStyle: "bold", color: "#e2e8f0"
    }).setOrigin(0.5);
    bg.on("pointerover", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1.05, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerout", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerdown", function () {
      pulseBtn(scene, [bg, txt]);
      SFX.click();
      onClick();
    });
    return { bg: bg, txt: txt };
  }

    bindInput() {
      this.cursors = this.input.keyboard.createCursorKeys();
      this.keys = this.input.keyboard.addKeys("W,A,S,D,SPACE,B");
      var self = this;

      this.input.on("pointerdown", function (p) {
        if (!self.alive) return;
        self.dragActive = true;
        self.player.x = Phaser.Math.Clamp(p.x, 30, W - 30);
      });
      this.input.on("pointermove", function (p) {
        if (!self.alive) return;
        if (self.dragActive || p.isDown) {
          self.player.x = Phaser.Math.Clamp(p.x, 30, W - 30);
        }
      });
      this.input.on("pointerup", function () { self.dragActive = false; });

      this.input.keyboard.on("keydown-B", function () { self.fireBomb(); });
      this.input.keyboard.on("keydown-SPACE", function () { /* auto fire while held in update */ });
    }

    spawnWallLasers() {
      var left = this.wallLasers.create(20, H / 2, "wall-laser");
      left.setDisplaySize(10, 80);
      left.body.allowGravity = false;
      left.setData("side", "left");
      left.setData("phase", 0);
      left.setBlendMode(Phaser.BlendModes.ADD);
      left.setDepth(8);

      var right = this.wallLasers.create(W - 20, H / 2, "wall-laser");
      right.setDisplaySize(10, 80);
      right.body.allowGravity = false;
      right.setData("side", "right");
      right.setData("phase", Math.PI);
      right.setBlendMode(Phaser.BlendModes.ADD);
      right.setDepth(8);
    }

    nextWave() {
      if (!this.alive) return;
      this.wave++;
      this.hudWave.setText("WAVE " + this.wave);

      if (this.wavesCleared > 0 && this.wavesCleared % 3 === 0) {
        this.spawnBoss();
        return;
      }

      this.spawnFormation();
    }

    spawnFormation() {
      this.enemies.getChildren().forEach(function (e) {
        var bar = e.getData("hpBar");
        if (bar && bar.destroy) bar.destroy();
      });
      this.enemies.clear(true, true);
      this.formation = [];
      var rows = Math.min(3 + Math.floor(this.wave / 2), 5);
      var cols = 10;
      var gapX = 100;
      var gapY = 60;
      var startX = (W - (cols - 1) * gapX) / 2;
      var startY = 100;
      var threat = this.dangerMultiplier;
      var pool = this.diff.enemyPool || ["scout", "soldier"];

      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var kind = pool[(r * cols + c + this.wave) % pool.length];
          // 後排偏坦克／精銳
          if (r === 0 && this.diffKey !== "casual" && Math.random() < 0.35) {
            kind = this.diffKey === "extreme" ? "elite" : "tank";
          }
          if (this.diffKey === "extreme" && r >= 2 && Math.random() < 0.3) kind = "interceptor";
          var st = ENEMY_STATS[kind] || ENEMY_STATS.scout;
          var e = this.enemies.create(startX + c * gapX, startY + r * gapY, st.key);
          e.body.allowGravity = false;
          e.setImmovable(true);
          e.setDepth(12);
          var hp = Math.ceil(st.hp * this.diff.hpMult * (1 + Math.floor(this.wave / 3) * 0.35) * (0.85 + threat * 0.2));
          var def = st.def + (this.diff.defFlat || 0) + Math.floor(this.wave / 4);
          e.setData("hp", hp);
          e.setData("maxHp", hp);
          e.setData("def", def);
          e.setData("kind", kind);
          e.setData("scoreBase", st.score);
          e.setData("baseX", e.x);
          e.setData("baseY", e.y);
          e.setData("col", c);
          e.setData("row", r);
          e.setData("burn", 0);
          e.setData("slow", 0);
          if (kind === "interceptor") e.setData("zig", Phaser.Math.FloatBetween(0, Math.PI * 2));
          // HP 條
          var bar = this.add.rectangle(e.x, e.y - 22, 28, 3, 0x22c55e, 1).setDepth(13);
          e.setData("hpBar", bar);
          this.formation.push(e);
        }
      }
      this.formDir = 1;
      this.formOffset = 0;
    }

    spawnBoss() {
      SFX.boss();
      doShake(this.cameras.main, 180, 0.02);
      screenPunch(this, 0xf472b6, 0.4);
      this.enemies.getChildren().forEach(function (e) {
        var bar = e.getData("hpBar");
        if (bar && bar.destroy) bar.destroy();
      });
      this.enemies.clear(true, true);
      this.formation = [];

      var hp = Math.floor(140 * this.diff.bossFireMult * (1 + this.wave * 0.22) * this.dangerMultiplier * this.diff.hpMult);
      this.boss = this.physics.add.image(W / 2, 110, "boss");
      this.boss.body.allowGravity = false;
      this.boss.setImmovable(true);
      this.boss.setDepth(15);
      this.boss.setData("hp", hp);
      this.boss.setData("maxHp", hp);
      this.boss.setData("def", 2 + (this.diff.defFlat || 0) + Math.floor(this.wave / 3));
      this.boss.setData("isBoss", true);
      this.boss.setData("kind", "boss");
      this.boss.setData("burn", 0);
      this.boss.setData("slow", 0);
      this.enemies.add(this.boss);

      this.bossPhase = 1;
      this.bossFireAcc = 0;
      this.bossBarBg.setVisible(true);
      this.bossBar.setVisible(true);
      this.bossLabel.setVisible(true);
      this.bossBar.width = 420;
      this.bossLabel.setText("VOID TITAN · PHASE 1");

      dualBurst(this, W / 2, 110, 0xf472b6, 0xfbbf24, 32);
      powerBanner(this, "BOSS INCOMING", "虛空泰坦降臨", "#f9a8d4");
    }

    firePlayer() {
      if (this.shootCd > 0 || !this.alive) return;
      var cd = Math.max(0.08, 0.2 - this.weaponLevel * 0.02);
      if (this.buffLightning > 0) cd *= 0.65;
      this.shootCd = cd;
      SFX.shoot();

      var level = this.weaponLevel;
      var angles = [0];
      if (level >= 2) angles = [-0.18, 0.18];
      if (level >= 3) angles = [-0.32, 0, 0.32];
      if (level >= 4) angles = [-0.48, -0.22, 0, 0.22, 0.48];
      if (level >= 5) angles = [-0.55, -0.28, 0, 0.28, 0.55];

      var elem = "normal";
      var key = "bullet-cyan";
      var baseDmg = 1 + Math.floor((this.weaponLevel - 1) / 2);
      if (this.buffFire > 0) { elem = "fire"; key = "bullet-fire"; baseDmg += 2; }
      else if (this.buffLightning > 0) { elem = "lightning"; key = "bullet-volt"; baseDmg += 1; }
      else if (this.buffFreeze > 0) { elem = "freeze"; key = "bullet-ice"; }
      else if (this.buffTrack > 0) { elem = "track"; key = "bullet-track"; baseDmg += 1; }

      var muzzleTint = elem === "fire" ? 0xf97316
        : (elem === "lightning" ? 0xfde047
        : (elem === "freeze" ? 0x38bdf8
        : (elem === "track" ? 0xfb923c : 0x67e8f9)));
      var muzzleAlt = elem === "fire" ? 0xfde68a
        : (elem === "lightning" ? 0xffffff
        : (elem === "freeze" ? 0xe0f2fe
        : (elem === "track" ? 0xfbbf24 : 0xa78bfa)));

      var mx = this.player.x;
      var my = this.player.y - 30;
      var powered = elem !== "normal";

      if (powered) {
        // 撿到元素道具後才用誇張槍口特效
        var muzzleOuter = this.add.circle(mx, my, 14, muzzleAlt, 0.55)
          .setDepth(21).setBlendMode(Phaser.BlendModes.ADD);
        var muzzle = this.add.circle(mx, my, 8, muzzleTint, 1)
          .setDepth(22).setBlendMode(Phaser.BlendModes.ADD);
        var muzzleCore = this.add.circle(mx, my, 3, 0xffffff, 1)
          .setDepth(23).setBlendMode(Phaser.BlendModes.ADD);
        this.tweens.add({
          targets: [muzzleOuter, muzzle, muzzleCore], scale: 2.8, alpha: 0, duration: 160, ease: "Cubic.easeOut",
          onComplete: function () {
            muzzleOuter.destroy(); muzzle.destroy(); muzzleCore.destroy();
          }
        });
        var ring = this.add.circle(mx, my, 6, muzzleTint, 0)
          .setStrokeStyle(2, muzzleTint, 0.95).setDepth(22).setBlendMode(Phaser.BlendModes.ADD);
        this.tweens.add({
          targets: ring, scale: 3.2, alpha: 0, duration: 200, ease: "Cubic.easeOut",
          onComplete: function () { ring.destroy(); }
        });
        dualBurst(this, mx, my + 4, muzzleTint, muzzleAlt, 16);
        neonBurst(this, mx, my, 0xffffff, 10);
        for (var s = -1; s <= 1; s += 2) {
          (function (side) {
            var spark = this.add.circle(mx + side * 18, my + 8, 4, side < 0 ? 0x22d3ee : 0xa78bfa, 1)
              .setDepth(21).setBlendMode(Phaser.BlendModes.ADD);
            this.tweens.add({
              targets: spark, x: spark.x + side * 34, y: spark.y - 48, alpha: 0, scale: 0.15, duration: 180,
              ease: "Cubic.easeOut", onComplete: function () { spark.destroy(); }
            });
          }).call(this, s);
        }
      } else {
        // 普通攻擊：低調槍口閃光
        var muzzleN = this.add.circle(mx, my, 4, 0x67e8f9, 0.85)
          .setDepth(22).setBlendMode(Phaser.BlendModes.ADD);
        this.tweens.add({
          targets: muzzleN, scale: 1.6, alpha: 0, duration: 90, ease: "Cubic.easeOut",
          onComplete: function () { muzzleN.destroy(); }
        });
      }

      var self = this;
      for (var i = 0; i < angles.length; i++) {
        (function (i) {
          var bKey = elem === "normal" ? "bullet-cyan" : key;
          var b = self.bullets.create(mx, my, bKey);
          b.body.allowGravity = false;
          b.setDepth(16);
          b.setBlendMode(Phaser.BlendModes.ADD);
          var spd = 640;
          var a = -Math.PI / 2 + angles[i];
          b.setVelocity(Math.cos(a) * spd, Math.sin(a) * spd);
          b.setData("dmg", baseDmg);
          b.setData("elem", elem);
          b.setData("pierce", elem === "lightning" ? 1 : 0);
          if (elem === "track") b.setData("homingAlly", true);
          b.setScale(powered ? 1.25 : 1);
          if (powered) {
            var glow = self.add.circle(mx, my, 7, i % 2 === 0 ? muzzleTint : muzzleAlt, 0.35)
              .setDepth(15).setBlendMode(Phaser.BlendModes.ADD);
            b.setData("glow", glow);
            var trail = self.add.particles(0, 0, "spark", {
              follow: b,
              speed: { min: 20, max: 90 },
              angle: { min: 50, max: 130 },
              lifespan: { min: 100, max: 220 },
              scale: { start: 1.1, end: 0 },
              alpha: { start: 0.95, end: 0 },
              blendMode: "ADD",
              frequency: 14,
              tint: [muzzleTint, muzzleAlt, 0xffffff],
              quantity: 2
            }).setDepth(15);
            b.setData("trail", trail);
            self.time.delayedCall(1000, function () {
              self.destroyBulletFx(b);
            });
          }
        })(i);
      }

      if (powered) {
        neonBurst(this, this.player.x, this.player.y + 22, 0xf97316, 12);
        neonBurst(this, this.player.x, this.player.y + 18, 0x22d3ee, 10);
      }
    }

    destroyBulletFx(b) {
      if (!b) return;
      var trail = b.getData("trail");
      var glow = b.getData("glow");
      if (trail && trail.destroy) { try { trail.destroy(); } catch (e) {} }
      if (glow && glow.destroy) { try { glow.destroy(); } catch (e) {} }
      b.setData("trail", null);
      b.setData("glow", null);
    }

    killBullet(b) {
      if (!b) return;
      this.destroyBulletFx(b);
      if (b.active) b.destroy();
    }

    trySpawnLoot(x, y, fromBoss) {
      var progress = 1 + Math.min(0.8, this.wave * 0.04 + this.dangerMultiplier * 0.08);
      var lifeChance = (this.diff.lifeRate || 0.02) * (fromBoss ? 1.6 : 1) * Math.min(1.3, progress);
      var powerChance = fromBoss
        ? Math.min(0.55, (this.diff.bossDropRate || 0.3) * progress)
        : Math.min(0.14, (this.diff.powerRate || 0.06) * progress);

      if (this.lives < 5 && Math.random() < lifeChance) {
        this.spawnPower(x, y, "life");
        return;
      }
      if (Math.random() < powerChance) {
        this.spawnPower(x, y, null);
      }
    }

    fireBomb() {
      if (!this.alive || this.bombs <= 0) return;
      this.bombs--;
      SFX.bomb();
      doShake(this.cameras.main, 280, 0.03);

      this.flash.setFillStyle(0xa78bfa, 1);
      this.flash.setAlpha(0.7);
      this.tweens.add({ targets: this.flash, alpha: 0, duration: 400, ease: "Cubic.easeOut" });

      neonBurst(this, W / 2, H / 2, 0xfbbf24, 36);
      neonBurst(this, W / 2, H / 2, 0xa78bfa, 28);

      var self = this;
      // clear enemy bullets
      this.ebullets.clear(true, true);

      // damage all enemies
      this.enemies.getChildren().slice().forEach(function (e) {
        if (!e.active) return;
        if (e.getData("isBoss")) {
          self.damageEnemy(e, 25);
        } else {
          self.damageEnemy(e, 99);
        }
      });

      this.score += Math.floor(100 * this.diff.scoreMult);
    }

    onBulletEnemy(bullet, enemy) {
      if (!bullet.active || !enemy.active) return;
      var dmg = bullet.getData("dmg") || 1;
      var elem = bullet.getData("elem") || "normal";
      var pierce = bullet.getData("pierce") || 0;
      if (pierce > 0) {
        bullet.setData("pierce", pierce - 1);
      } else {
        this.killBullet(bullet);
      }
      this.damageEnemy(enemy, dmg, elem);

      // 雷電連鎖
      if (elem === "lightning" && Math.random() < 0.55) {
        var self = this;
        var nearest = null;
        var best = 160;
        this.enemies.getChildren().forEach(function (e) {
          if (!e.active || e === enemy) return;
          var d = Phaser.Math.Distance.Between(enemy.x, enemy.y, e.x, e.y);
          if (d < best) { best = d; nearest = e; }
        });
        if (nearest) {
          var line = this.add.line(0, 0, enemy.x, enemy.y, nearest.x, nearest.y, 0xfde047, 0.9)
            .setLineWidth(2).setDepth(30).setBlendMode(Phaser.BlendModes.ADD);
          this.tweens.add({
            targets: line, alpha: 0, duration: 120, onComplete: function () { line.destroy(); }
          });
          SFX.lightning();
          this.damageEnemy(nearest, Math.max(1, Math.floor(dmg * 0.7)), "lightning");
        }
      }
    }

    damageEnemy(enemy, dmg, elem) {
      if (!enemy.active) return;
      elem = elem || "normal";
      var def = enemy.getData("def") || 0;
      var finalDmg = Math.max(1, dmg - def);
      if (elem === "fire") finalDmg += 1;
      if (enemy.getData("slow") > 0) finalDmg += 1;

      var hp = (enemy.getData("hp") || 1) - finalDmg;
      enemy.setData("hp", hp);
      doShake(this.cameras.main, 70, 0.01);
      SFX.hit();
      floatText(this, enemy.x + Phaser.Math.Between(-8, 8), enemy.y - 12, "-" + finalDmg, elem === "fire" ? "#fb923c" : (elem === "lightning" ? "#fde047" : "#67e8f9"), 13);

      var tint = enemy.getData("isBoss") ? 0xf472b6 : 0x22d3ee;
      if (elem === "fire") tint = 0xf97316;
      if (elem === "freeze") tint = 0x38bdf8;
      if (elem === "lightning") tint = 0xfde047;
      neonBurst(this, enemy.x, enemy.y, tint, 16);

      if (elem === "fire") enemy.setData("burn", Math.max(enemy.getData("burn") || 0, 2.5));
      if (elem === "freeze" || this.buffFreeze > 0) enemy.setData("slow", Math.max(enemy.getData("slow") || 0, 2.2));

      var bar = enemy.getData("hpBar");
      if (bar && bar.active) {
        var ratio = Math.max(0, hp / (enemy.getData("maxHp") || hp || 1));
        bar.width = 28 * ratio;
        bar.setFillStyle(ratio > 0.5 ? 0x22c55e : (ratio > 0.25 ? 0xfbbf24 : 0xef4444));
      }

      if (hp > 0) {
        this.tweens.add({
          targets: enemy, scaleX: 1.18, scaleY: 0.85, duration: 55, yoyo: true, ease: "Cubic.easeOut"
        });
        if (enemy.getData("isBoss")) {
          this.updateBossBar();
          // Boss 戰鬥中依進度／難度極低機率掉落
          var midChance = (this.diff.bossDropRate || 0.3) * 0.012 * (1 + this.wave * 0.03);
          if (Math.random() < Math.min(0.04, midChance)) {
            this.trySpawnLoot(enemy.x + Phaser.Math.Between(-40, 40), enemy.y + 30, true);
          }
        }
        return;
      }

      SFX.explode();
      var base = enemy.getData("scoreBase") || 50;
      var pts = enemy.getData("isBoss")
        ? Math.floor(1800 * this.diff.scoreMult * this.dangerMultiplier)
        : Math.floor(base * this.diff.scoreMult * this.dangerMultiplier);
      this.score += pts;
      dualBurst(this, enemy.x, enemy.y, tint, 0xfbbf24, 26);
      shockwave(this, enemy.x, enemy.y, tint, 60);

      if (enemy.getData("isBoss")) {
        this.onBossDefeated(enemy);
      } else {
        if (bar && bar.destroy) bar.destroy();
        this.trySpawnLoot(enemy.x, enemy.y, false);
        enemy.destroy();
        this.checkWaveClear();
      }
    }

    updateBossBar() {
      if (!this.boss || !this.boss.active) return;
      var ratio = Math.max(0, this.boss.getData("hp") / this.boss.getData("maxHp"));
      this.bossBar.width = 420 * ratio;
      var phase = ratio > 0.66 ? 1 : (ratio > 0.33 ? 2 : 3);
      if (phase !== this.bossPhase) {
        this.bossPhase = phase;
        this.bossLabel.setText("VOID TITAN · PHASE " + phase);
        doShake(this.cameras.main, 100, 0.012);
        SFX.boss();
        powerBanner(this, "PHASE " + phase, "泰坦狂暴升級", "#f9a8d4");
        // Boss 換階段：依進度／難度低機率掉落
        if (Math.random() < Math.min(0.4, (this.diff.bossDropRate || 0.3) * 0.55 * (1 + this.wave * 0.03))) {
          this.trySpawnLoot(this.boss.x, this.boss.y + 40, true);
        }
      }
    }

    onBossDefeated(boss) {
      var x = boss.x, y = boss.y;
      boss.destroy();
      this.boss = null;
      this.bossBarBg.setVisible(false);
      this.bossBar.setVisible(false);
      this.bossLabel.setVisible(false);

      var self = this;
      for (var i = 0; i < 5; i++) {
        (function (i) {
          self.time.delayedCall(i * 100, function () {
            doShake(self.cameras.main, 80, 0.012);
            neonBurst(self, x + Phaser.Math.Between(-40, 40), y + Phaser.Math.Between(-20, 20), 0xfbbf24, 18);
            neonBurst(self, x, y, 0xf472b6, 14);
            SFX.explode();
          });
        })(i);
      }

      this.bombs = Math.min(3, this.bombs + 1);
      // Boss 擊破：依難度與波數掉落 1～2 個（機率制）
      this.trySpawnLoot(x, y, true);
      if (Math.random() < Math.min(0.45, (this.diff.bossDropRate || 0.3) * (0.7 + this.wave * 0.04))) {
        this.time.delayedCall(180, function () {
          self.trySpawnLoot(x + Phaser.Math.Between(-50, 50), y + 20, true);
        });
      }
      this.time.delayedCall(700, function () {
        self.wavesCleared++;
        self.nextWave();
      });
    }

    checkWaveClear() {
      if (this.boss) return;
      if (this.enemies.countActive(true) > 0) return;
      this.wavesCleared++;
      var self = this;
      this.time.delayedCall(600, function () { self.nextWave(); });
    }

    spawnPower(x, y, forceType) {
      var types = ["spread", "shield", "bomb", "lightning", "fire", "freeze", "track"];
      // 基礎道具略多，元素不過量
      var weights = [1.3, 1.1, 1.0, 0.9, 0.9, 0.9, 0.85];
      var type = forceType;
      if (!type) {
        var total = 0;
        for (var i = 0; i < weights.length; i++) total += weights[i];
        var roll = Math.random() * total;
        type = types[0];
        for (var j = 0; j < types.length; j++) {
          roll -= weights[j];
          if (roll <= 0) { type = types[j]; break; }
        }
      }
      var p = this.powerups.create(x, y, "pow-" + type);
      p.body.allowGravity = false;
      p.setVelocity(0, 95);
      p.setData("type", type);
      p.setDepth(14);
      p.setBlendMode(Phaser.BlendModes.ADD);
      var auraCol = {
        lightning: 0xfacc15, fire: 0xef4444, freeze: 0x38bdf8, track: 0xf97316,
        shield: 0x60a5fa, bomb: 0xfbbf24, spread: 0x34d399, life: 0xf43f5e
      }[type] || 0xffffff;
      var aura = this.add.circle(x, y, 18, auraCol, 0.16)
        .setStrokeStyle(1, auraCol, 0.7).setDepth(13).setBlendMode(Phaser.BlendModes.ADD);
      p.setData("aura", aura);
      this.tweens.add({
        targets: [p, aura], scale: 1.15, duration: 360, yoyo: true, repeat: -1, ease: "Sine.easeInOut"
      });
    }

    onPower(_player, p) {
      if (!p.active) return;
      var type = p.getData("type");
      var aura = p.getData("aura");
      if (aura && aura.destroy) aura.destroy();
      p.destroy();
      SFX.power();
      // 輕量回饋：小提示＋局部粒子，無全屏閃光
      neonBurst(this, this.player.x, this.player.y, 0xfbbf24, 12);

      if (type === "spread") {
        this.weaponLevel = Math.min(5, this.weaponLevel + 1);
        powerBanner(this, "散彈升級", "Lv." + this.weaponLevel, "#6ee7b7");
      } else if (type === "shield") {
        this.shield = Math.min(3, this.shield + 1);
        this.shieldRing.setVisible(true);
        SFX.shield();
        powerBanner(this, "護盾", "x" + this.shield, "#93c5fd");
      } else if (type === "bomb") {
        this.bombs = Math.min(3, this.bombs + 1);
        powerBanner(this, "核爆", "x" + this.bombs, "#fde68a");
      } else if (type === "lightning") {
        this.buffLightning = 9;
        SFX.lightning();
        powerBanner(this, "雷電武裝", "9 秒", "#fde047");
      } else if (type === "fire") {
        this.buffFire = 9;
        SFX.fire();
        powerBanner(this, "火焰核心", "9 秒", "#fb923c");
      } else if (type === "freeze") {
        this.buffFreeze = 8;
        SFX.freeze();
        this.enemies.getChildren().forEach(function (e) {
          if (e.active) e.setData("slow", Math.max(e.getData("slow") || 0, 3));
        });
        powerBanner(this, "絕對零度", "8 秒", "#7dd3fc");
      } else if (type === "track") {
        this.buffTrack = 9;
        SFX.track();
        powerBanner(this, "追蹤飛彈", "9 秒", "#fdba74");
      } else if (type === "life") {
        if (this.lives < 5) {
          this.lives++;
          powerBanner(this, "生命回復", "❤ " + this.lives, "#fda4af");
          neonBurst(this, this.player.x, this.player.y, 0xf43f5e, 16);
        } else {
          this.score += Math.floor(200 * this.diff.scoreMult);
          powerBanner(this, "生命已滿", "+分數", "#fda4af");
        }
      }
    }

    hurtPlayer() {
      if (!this.alive || this.invuln > 0) return;

      if (this.shield > 0) {
        this.shield--;
        this.invuln = 0.8;
        SFX.shieldBreak();
        doShake(this.cameras.main, 120, 0.014);
        neonBurst(this, this.player.x, this.player.y, 0x60a5fa, 24);
        // shockwave ring
        var ring = this.add.circle(this.player.x, this.player.y, 20, 0x60a5fa, 0.3)
          .setStrokeStyle(3, 0x93c5fd, 0.9).setDepth(25);
        this.tweens.add({
          targets: ring, scale: 3.5, alpha: 0, duration: 280, ease: "Cubic.easeOut",
          onComplete: function () { ring.destroy(); }
        });
        if (this.shield <= 0) this.shieldRing.setVisible(false);
        return;
      }

      this.lives--;
      this.invuln = 1.5;
      this.weaponLevel = Math.max(1, this.weaponLevel - 1);
      SFX.explode();
      doShake(this.cameras.main, 160, 0.018);
      neonBurst(this, this.player.x, this.player.y, 0x22d3ee, 22);

      if (this.lives <= 0) this.die();
    }

    onEnemyBulletPlayer(_player, bullet) {
      if (!bullet.active) return;
      bullet.destroy();
      this.hurtPlayer();
    }

    onEnemyPlayer(_player, enemy) {
      if (!enemy.active) return;
      if (!enemy.getData("isBoss")) {
        this.damageEnemy(enemy, 99);
      }
      this.hurtPlayer();
    }

    onWallLaser(_player, laser) {
      if (!laser.active) return;
      this.hurtPlayer();
    }

    enemyShoot() {
      var list = this.enemies.getChildren().filter(function (e) { return e.active && !e.getData("isBoss"); });
      if (!list.length) return;
      var shooter = Phaser.Utils.Array.GetRandom(list);
      var b = this.ebullets.create(shooter.x, shooter.y + 12, this.diff.homing ? "homing" : "ebullet");
      b.body.allowGravity = false;
      b.setDepth(14);
      b.setData("homing", this.diff.homing && Math.random() < 0.45);
      var spd = 180 * this.diff.enemySpd * (0.85 + this.dangerMultiplier * 0.25);
      if (b.getData("homing")) {
        var ang = Phaser.Math.Angle.Between(shooter.x, shooter.y, this.player.x, this.player.y);
        b.setVelocity(Math.cos(ang) * spd, Math.sin(ang) * spd);
      } else {
        b.setVelocity(0, spd);
      }
    }

    bossShoot() {
      if (!this.boss || !this.boss.active) return;
      var phase = this.bossPhase;
      var cx = this.boss.x, cy = this.boss.y + 30;
      var spd = 200 * this.diff.bossFireMult * (0.9 + this.dangerMultiplier * 0.2);
      var count = phase === 1 ? 5 : (phase === 2 ? 8 : 12);
      var spread = phase === 1 ? 0.8 : (phase === 2 ? 1.2 : 1.6);

      if (phase === 3 && this.diff.homing) {
        // homing volley
        for (var h = 0; h < 3; h++) {
          var hb = this.ebullets.create(cx + (h - 1) * 24, cy, "homing");
          hb.body.allowGravity = false;
          hb.setData("homing", true);
          hb.setDepth(14);
          var ang = Phaser.Math.Angle.Between(cx, cy, this.player.x, this.player.y) + (h - 1) * 0.15;
          hb.setVelocity(Math.cos(ang) * spd * 1.1, Math.sin(ang) * spd * 1.1);
        }
      }

      for (var i = 0; i < count; i++) {
        var t = count === 1 ? 0 : (i / (count - 1) - 0.5) * spread;
        var a = Math.PI / 2 + t;
        var b = this.ebullets.create(cx, cy, "ebullet");
        b.body.allowGravity = false;
        b.setDepth(14);
        b.setVelocity(Math.cos(a) * spd, Math.sin(a) * spd);
      }
    }

    die() {
      if (!this.alive) return;
      this.alive = false;
      SFX.die();
      if (this.engineTrail) this.engineTrail.stop();

      this.flash.setFillStyle(0xffffff, 1);
      this.flash.setAlpha(0.9);
      this.tweens.add({ targets: this.flash, alpha: 0, duration: 500, ease: "Cubic.easeOut" });
      doShake(this.cameras.main, 300, 0.035);

      neonBurst(this, this.player.x, this.player.y, 0x22d3ee, 30);
      neonBurst(this, this.player.x, this.player.y, 0xa78bfa, 22);
      this.tweens.add({
        targets: this.player,
        scaleX: 1.8, scaleY: 0.3, alpha: 0, angle: 40,
        duration: 400, ease: "Cubic.easeIn"
      });

      var finalScore = Math.floor(this.score);
      var meta = {
        slug: "galactic-invader-2026",
        difficulty: this.diff.id,
        wave: this.wave,
        weapon: this.weaponLevel,
        dangerPeak: Number(this.dangerMultiplier.toFixed(2))
      };
      try {
        if (typeof RNF !== "undefined" && RNF.submitScore) RNF.submitScore(finalScore, meta);
      } catch (_e) {}

      var self = this;
      this.time.delayedCall(550, function () {
        self.scene.launch("GameOverModal", {
          score: finalScore,
          wave: self.wave,
          danger: self.dangerMultiplier,
          weapon: self.weaponLevel,
          diff: self.diff
        });
      });
    }

    update(_t, delta) {
      if (!this.alive) return;
      var dt = Math.min(0.05, delta / 1000);
      this.elapsed += dt;
      this.dangerMultiplier = 1 + Math.log(1 + this.elapsed / 30) * 0.8;
      var threat = this.dangerMultiplier;

      // stars
      for (var i = 0; i < this.starField.length; i++) {
        var s = this.starField[i];
        s.y += s.sp * dt * (0.8 + threat * 0.3);
        if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
        s.g.setPosition(s.x, s.y);
      }

      // keyboard move
      var spd = 460;
      var vx = 0;
      if (this.cursors.left.isDown || this.keys.A.isDown) vx = -spd;
      if (this.cursors.right.isDown || this.keys.D.isDown) vx = spd;
      this.player.setVelocityX(vx);

      // fire when holding space or dragging (touch)
      this.shootCd = Math.max(0, this.shootCd - dt);
      if (this.keys.SPACE.isDown || this.dragActive) this.firePlayer();

      this.invuln = Math.max(0, this.invuln - dt);
      this.buffLightning = Math.max(0, this.buffLightning - dt);
      this.buffFire = Math.max(0, this.buffFire - dt);
      this.buffFreeze = Math.max(0, this.buffFreeze - dt);
      this.buffTrack = Math.max(0, this.buffTrack - dt);
      this.player.setAlpha(this.invuln > 0 ? (Math.sin(this.invuln * 25) > 0 ? 1 : 0.35) : 1);
      this.shieldRing.setPosition(this.player.x, this.player.y);
      this.shieldRing.rotation += dt * 2.5;
      this.shieldRing.setVisible(this.shield > 0);
      this.auraRing.setPosition(this.player.x, this.player.y);
      var auraCol = 0;
      var auraAlpha = 0;
      if (this.buffLightning > 0) { auraCol = 0xfacc15; auraAlpha = 0.7; }
      else if (this.buffFire > 0) { auraCol = 0xef4444; auraAlpha = 0.7; }
      else if (this.buffFreeze > 0) { auraCol = 0x38bdf8; auraAlpha = 0.7; }
      else if (this.buffTrack > 0) { auraCol = 0xf97316; auraAlpha = 0.7; }
      this.auraRing.setStrokeStyle(2, auraCol, auraAlpha);
      this.auraRing.setScale(1 + Math.sin((_t || 0) / 90) * 0.08);

      var freezeField = this.buffFreeze > 0 ? 0.45 : 1;
      var self = this;

      // formation movement
      if (!this.boss && this.formation.length) {
        this.formOffset += this.formDir * 70 * this.diff.enemySpd * threat * freezeField * dt;
        if (Math.abs(this.formOffset) > 140) {
          this.formDir *= -1;
          this.formDrop += 12 * freezeField;
        }
        for (var f = 0; f < this.formation.length; f++) {
          var e = this.formation[f];
          if (!e.active) continue;
          var slow = e.getData("slow") || 0;
          if (slow > 0) {
            e.setData("slow", slow - dt);
            e.setTint(0x7dd3fc);
          } else if (e.getData("burn") > 0) {
            e.setTint(0xfb923c);
          } else {
            e.clearTint();
          }
          var zig = 0;
          if (e.getData("kind") === "interceptor") {
            var z = (e.getData("zig") || 0) + dt * 4;
            e.setData("zig", z);
            zig = Math.sin(z) * 18;
          }
          e.x = e.getData("baseX") + this.formOffset * (slow > 0 ? 0.5 : 1) + zig;
          e.y = e.getData("baseY") + this.formDrop;
          var bar = e.getData("hpBar");
          if (bar && bar.active) bar.setPosition(e.x, e.y - 24);
          // 燃燒 DoT
          var burn = e.getData("burn") || 0;
          if (burn > 0) {
            e.setData("burn", burn - dt);
            if (Math.random() < dt * 2.2) {
              self.damageEnemy(e, 1, "burntick");
              neonBurst(self, e.x, e.y, 0xf97316, 6);
            }
          }
          if (e.y > H - 100) this.hurtPlayer();
        }

        this.enemyFireAcc += dt * this.diff.enemyFire * threat * (this.buffFreeze > 0 ? 0.55 : 1);
        if (this.enemyFireAcc >= 1.1) {
          this.enemyFireAcc = 0;
          this.enemyShoot();
        }
      }

      // boss
      if (this.boss && this.boss.active) {
        var bslow = this.boss.getData("slow") || 0;
        if (bslow > 0) {
          this.boss.setData("slow", bslow - dt);
          this.boss.setTint(0x7dd3fc);
        } else {
          this.boss.clearTint();
        }
        this.boss.x = W / 2 + Math.sin(this.elapsed * 1.2 * (bslow > 0 ? 0.5 : 1)) * 320;
        var bburn = this.boss.getData("burn") || 0;
        if (bburn > 0) {
          this.boss.setData("burn", bburn - dt);
          if (Math.random() < dt * 1.8) this.damageEnemy(this.boss, 2, "burntick");
        }
        this.bossFireAcc += dt * this.diff.bossFireMult * threat * (this.buffFreeze > 0 ? 0.6 : 1);
        var interval = this.bossPhase === 1 ? 1.2 : (this.bossPhase === 2 ? 0.85 : 0.55);
        if (this.bossFireAcc >= interval) {
          this.bossFireAcc = 0;
          this.bossShoot();
        }
        this.updateBossBar();
      }

      // enemy bullets
      this.ebullets.getChildren().forEach(function (b) {
        if (!b.active) return;
        if (b.getData("homing") && self.player.active) {
          var ang = Phaser.Math.Angle.Between(b.x, b.y, self.player.x, self.player.y);
          var cur = Math.atan2(b.body.velocity.y, b.body.velocity.x);
          var next = Phaser.Math.Angle.RotateTo(cur, ang, 1.8 * dt);
          var sp = Math.sqrt(b.body.velocity.x * b.body.velocity.x + b.body.velocity.y * b.body.velocity.y) || 200;
          b.setVelocity(Math.cos(next) * sp, Math.sin(next) * sp);
        }
        if (b.y > H + 40 || b.y < -40 || b.x < -40 || b.x > W + 40) b.destroy();
      });

      // player bullets + ally tracking
      this.bullets.getChildren().forEach(function (b) {
        if (!b.active) return;
        var glow = b.getData("glow");
        if (glow && glow.active) { glow.x = b.x; glow.y = b.y; }
        if (b.getData("homingAlly")) {
          var target = null;
          var best = 280;
          self.enemies.getChildren().forEach(function (en) {
            if (!en.active) return;
            var d = Phaser.Math.Distance.Between(b.x, b.y, en.x, en.y);
            if (d < best) { best = d; target = en; }
          });
          if (target) {
            var a2 = Phaser.Math.Angle.Between(b.x, b.y, target.x, target.y);
            var c2 = Math.atan2(b.body.velocity.y, b.body.velocity.x);
            var n2 = Phaser.Math.Angle.RotateTo(c2, a2, 4 * dt);
            var sp2 = 520;
            b.setVelocity(Math.cos(n2) * sp2, Math.sin(n2) * sp2);
            b.rotation = n2;
          }
        }
        if (b.y < -20 || b.x < -20 || b.x > W + 20) self.killBullet(b);
      });

      this.powerups.getChildren().forEach(function (p) {
        if (!p.active) return;
        var aura = p.getData("aura");
        if (aura && aura.active) { aura.x = p.x; aura.y = p.y; }
        if (p.y > H + 30) {
          if (aura && aura.destroy) aura.destroy();
          p.destroy();
        }
      });

      // wall lasers move
      this.wallLasers.getChildren().forEach(function (l) {
        if (!l.active) return;
        var phase = l.getData("phase") + dt * 1.5;
        l.setData("phase", phase);
        l.y = H / 2 + Math.sin(phase) * (H * 0.35);
      });

      var buffTxt = [];
      if (this.buffLightning > 0) buffTxt.push("雷" + this.buffLightning.toFixed(0) + "s");
      if (this.buffFire > 0) buffTxt.push("火" + this.buffFire.toFixed(0) + "s");
      if (this.buffFreeze > 0) buffTxt.push("冰" + this.buffFreeze.toFixed(0) + "s");
      if (this.buffTrack > 0) buffTxt.push("追" + this.buffTrack.toFixed(0) + "s");

      this.hudScore.setText("SCORE " + this.score.toLocaleString());
      this.hudDanger.setText("DANGER: x" + this.dangerMultiplier.toFixed(2));
      this.hudLives.setText("❤ " + this.lives);
      this.hudPower.setText(
        "WPN Lv" + this.weaponLevel +
        (this.shield > 0 ? " · 盾×" + this.shield : "") +
        " · 核×" + this.bombs +
        (buffTxt.length ? " · " + buffTxt.join(" ") : "")
      );
    }
  }


  /* ═══════════════ LeaderboardScene（本遊戲獨立排行榜） ═══════════════ */
  var LeaderboardScene = (window.RNFPhaserLeaderboard && RNFPhaserLeaderboard.createLeaderboardScene)
    ? RNFPhaserLeaderboard.createLeaderboardScene({
        Phaser: Phaser,
        makeButton: makeButton,
        W: W,
        H: H,
        accent: 0x22d3ee,
        returnScene: "MainMenuScene",
        getDefaultDiff: function () {
          return (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard";
        }
      })
    : class LeaderboardSceneMissing extends Phaser.Scene {
        constructor() { super("LeaderboardScene"); }
        create() {
          this.add.text(W / 2, H / 2, "排行榜模組未載入", {
            fontFamily: "Microsoft JhengHei, Segoe UI", fontSize: "18px", color: "#f472b6"
          }).setOrigin(0.5);
        }
      };

  class GameOverModal extends Phaser.Scene {
    constructor() { super("GameOverModal"); }
    init(data) { this.payload = data || {}; }

    create() {
      var score = this.payload.score || 0;
      var diff = this.payload.diff || DIFF.standard;

      this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.72).setInteractive().setDepth(70);
      var panel = this.add.rectangle(W / 2, H / 2, 480, 500, 0x0b1220, 0.97)
        .setStrokeStyle(2, 0x22d3ee, 0.95).setScale(0.7).setAlpha(0).setDepth(71);

      var badge = this.add.text(W / 2, H / 2 - 168, "GAME OVER", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", fontStyle: "bold",
        color: "#f472b6", letterSpacing: 3
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      var title = this.add.text(W / 2, H / 2 - 128, "霓虹結算", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "30px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      var scoreTxt = this.add.text(W / 2, H / 2 - 48, score.toLocaleString(), {
        fontFamily: "Segoe UI, sans-serif", fontSize: "54px", fontStyle: "bold", color: "#67e8f9"
      }).setOrigin(0.5).setScale(0.4).setAlpha(0).setDepth(72);

      var meta = this.add.text(W / 2, H / 2 + 30,
        diff.label +
        "\nWAVE " + (this.payload.wave || 1) +
        " · 武器 Lv" + (this.payload.weapon || 1) +
        " · DANGER x" + Number(this.payload.danger || 1).toFixed(2) +
        "\n已執行 RNF.submitScore → 排行榜", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "13px", color: "#94a3b8", align: "center", lineSpacing: 6
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 380, ease: "Back.easeOut" });
      this.tweens.add({ targets: [badge, title, meta], alpha: 1, duration: 300, ease: "Cubic.easeOut", delay: 80 });
      this.tweens.add({ targets: scoreTxt, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 100 });

      neonBurst(this, W / 2, H / 2 - 40, 0x22d3ee, 22);

      var self = this;
      var retry = makeButton(this, W / 2 - 110, H / 2 + 95, "再試一次", 0x22d3ee, function () {
        SFX.confirm();
        self.scene.stop("GameOverModal");
        self.scene.stop("GameScene");
        self.scene.start("GameScene", { difficulty: selectedDiff });
      }, 180);
      retry.bg.setDepth(73); retry.txt.setDepth(74);

      var settings = makeButton(this, W / 2 + 110, H / 2 + 95, "排行榜", 0x34d399, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        try { self.scene.stop("SettingsScene"); } catch (_e) {}
        self.scene.stop("GameScene");
        self.scene.start("LeaderboardScene", { difficulty: (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard" });
      }, 180);
      settings.bg.setDepth(73); settings.txt.setDepth(74);
      var menu = makeButton(this, W / 2, H / 2 + 155, "主選單", 0x64748b, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        self.scene.stop("SettingsScene");
        self.scene.stop("GameScene");
        self.scene.start("MainMenuScene");
      }, 200);
    }
  }

  var config = {
    type: Phaser.AUTO,
    parent: "game-host",
    width: W,
    height: H,
    backgroundColor: "#04060c",
    banner: false,
    physics: {
      default: "arcade",
      arcade: { gravity: { y: 0 }, debug: false }
    },

    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    fps: { target: 144, forceSet: false, smoothStep: true },
    scene: [BootScene, MainMenuScene, DifficultyScene, GameScene, GameOverModal, LeaderboardScene, SettingsScene]
  };

  try {
    window.__GALACTIC_INVADER__ = new Phaser.Game(config);
  } catch (_e) {
    config.type = Phaser.AUTO;
    window.__GALACTIC_INVADER__ = new Phaser.Game(config);
  }
  window.__RNF_ARCADE_GAME__ = window.__GALACTIC_INVADER__;
  if (typeof RNF !== "undefined" && RNF.setShowMenuHandler) {
    RNF.setShowMenuHandler(function () {
      try {
        var g = window.__RNF_ARCADE_GAME__ || window.__GALACTIC_INVADER__;
        if (!g || !g.scene) return;
        ["GameOverModal", "SettingsScene", "LeaderboardScene", "DifficultyScene", "GameScene"].forEach(function (key) {
          try { if (g.scene.getScene(key)) g.scene.stop(key); } catch (_s) {}
        });
        g.scene.start("MainMenuScene");
      } catch (_err) {}
    });
  }
})();
</script>
</body>
</html>
