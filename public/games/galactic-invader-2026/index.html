<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Galactic Invader 2026 · 星際侵略者 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #04060c; overflow: hidden;
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      touch-action: none; user-select: none;
    }
    #game-host { width: 100%; height: 100%; }
  </style>
  <script src="/sdk/phaser.min.js"></script>
  <script src="/sdk/rnf-i18n.js?v=20260730g"></script>
  <script src="/sdk/rnf-game-packs.js?v=20260730g"></script>
  <script src="/sdk/rnf-game-sdk.js?v=20260730g"></script>
</head>
<body>
  <div id="game-host"></div>
<script>
/**
 * Galactic Invader 2026 — Phaser 3 商業級電競重構
 * Boot → MainMenu → Difficulty → Game → GameOverModal (+ Settings)
 * Juice：激光星塵／散彈升級／護盾／核爆／Boss 多階段
 * Casual 預設護盾高掉落 · Standard · Extreme 追蹤彈＋邊界雷射
 */
(function () {
  "use strict";

  if (typeof RNF !== "undefined" && RNF.init) RNF.init();

  var W = 960;
  var H = 540;
  var SETTINGS_KEY = "rnf:galactic-invader-2026:settings";

  var DIFF = {
    casual: {
      id: "casual",
      label: "Casual 輕鬆",
      desc: "彈幕稀疏 · 預設護盾 · 高升級掉落",
      color: "#67e8f9",
      scoreMult: 1.0,
      enemyFire: 0.55,
      enemySpd: 0.75,
      powerRate: 0.28,
      startShield: 2,
      homing: false,
      wallLaser: false,
      bossFireMult: 0.8
    },
    standard: {
      id: "standard",
      label: "Standard 電競",
      desc: "標準編隊速度與彈幕密度",
      color: "#a78bfa",
      scoreMult: 1.35,
      enemyFire: 1,
      enemySpd: 1,
      powerRate: 0.14,
      startShield: 0,
      homing: false,
      wallLaser: false,
      bossFireMult: 1
    },
    extreme: {
      id: "extreme",
      label: "Extreme 狂暴",
      desc: "追蹤子彈 · Boss 雙頻 · 邊界移動雷射",
      color: "#f472b6",
      scoreMult: 2.5,
      enemyFire: 1.35,
      enemySpd: 1.25,
      powerRate: 0.1,
      startShield: 0,
      homing: true,
      wallLaser: true,
      bossFireMult: 2
    }
  };

  var selectedDiff = "standard";
  var gameSettings = loadSettings();

  function loadSettings() {
    var base = { sfx: true, shake: true };
    try {
      if (typeof RNF !== "undefined" && RNF.getSettings) {
        var s = RNF.getSettings();
        base.sfx = (s.sfxVolume == null ? 0.75 : s.sfxVolume) > 0.02;
        base.shake = s.screenShake !== false;
      }
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) Object.assign(base, JSON.parse(raw));
    } catch (_e) {}
    return base;
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameSettings));
      if (typeof RNF !== "undefined" && RNF.setSettings) {
        RNF.setSettings({
          sfxVolume: gameSettings.sfx ? 0.75 : 0,
          screenShake: !!gameSettings.shake
        });
      }
    } catch (_e) {}
  }

  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, dur, type, vol, slide) {
    if (!gameSettings.sfx) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  var SFX = {
    click: function () { tone(520, 0.05, "triangle", 0.07); },
    confirm: function () { tone(660, 0.07, "square", 0.09); tone(990, 0.08, "triangle", 0.07); },
    shoot: function () { tone(720, 0.04, "sawtooth", 0.06, 1100); },
    hit: function () { tone(380, 0.05, "square", 0.07); },
    explode: function () { tone(140, 0.14, "sawtooth", 0.12, 50); },
    power: function () { tone(600, 0.08, "square", 0.1); tone(900, 0.1, "triangle", 0.08); },
    shield: function () { tone(480, 0.1, "sine", 0.1); },
    shieldBreak: function () { tone(200, 0.18, "sawtooth", 0.12, 70); },
    bomb: function () { tone(80, 0.3, "sawtooth", 0.16, 40); tone(160, 0.2, "triangle", 0.1); },
    boss: function () { tone(100, 0.25, "sawtooth", 0.14, 60); },
    die: function () { tone(150, 0.28, "sawtooth", 0.15, 40); },
    toggle: function () { tone(440, 0.05, "triangle", 0.07); }
  };

  function doShake(cam, dur, intens) {
    if (!gameSettings.shake || !cam) return;
    cam.shake(dur, intens);
  }

  function neonBurst(scene, x, y, tint, count) {
    var n = Phaser.Math.Clamp(count || 20, 15, 40);
    var emitter = scene.add.particles(x, y, "spark", {
      speed: { min: 70, max: 340 },
      angle: { min: 0, max: 360 },
      lifespan: { min: 260, max: 700 },
      scale: { start: 1.15, end: 0 },
      alpha: { start: 1, end: 0 },
      gravityY: 40,
      blendMode: "ADD",
      tint: tint,
      emitting: false
    });
    emitter.explode(n);
    scene.time.delayedCall(850, function () { if (emitter.destroy) emitter.destroy(); });
  }

  function makeTextures(scene) {
    var g = scene.make.graphics({ x: 0, y: 0, add: false });

    g.clear();
    g.fillStyle(0x22d3ee, 1);
    g.fillTriangle(20, 0, 40, 40, 0, 40);
    g.fillStyle(0xa78bfa, 1);
    g.fillTriangle(20, 10, 28, 32, 12, 32);
    g.generateTexture("player", 40, 40);

    g.clear();
    g.fillStyle(0xf472b6, 1);
    g.fillTriangle(16, 32, 0, 0, 32, 0);
    g.fillStyle(0xffffff, 0.35);
    g.fillCircle(16, 12, 4);
    g.generateTexture("enemy", 32, 32);

    g.clear();
    g.fillStyle(0xa78bfa, 1);
    g.fillRoundedRect(0, 0, 96, 64, 8);
    g.fillStyle(0xf472b6, 1);
    g.fillTriangle(48, 64, 20, 40, 76, 40);
    g.fillStyle(0x22d3ee, 1);
    g.fillCircle(30, 28, 8);
    g.fillCircle(66, 28, 8);
    g.generateTexture("boss", 96, 64);

    g.clear();
    g.fillStyle(0x22d3ee, 1);
    g.fillRect(0, 0, 4, 14);
    g.generateTexture("bullet-cyan", 4, 14);

    g.clear();
    g.fillStyle(0xa78bfa, 1);
    g.fillRect(0, 0, 4, 14);
    g.generateTexture("bullet-violet", 4, 14);

    g.clear();
    g.fillStyle(0xf472b6, 1);
    g.fillCircle(4, 4, 4);
    g.generateTexture("ebullet", 8, 8);

    g.clear();
    g.fillStyle(0xfbbf24, 1);
    g.fillCircle(4, 4, 4);
    g.generateTexture("homing", 8, 8);

    g.clear();
    g.fillStyle(0xffffff, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark", 6, 6);

    g.clear();
    g.fillStyle(0x34d399, 1);
    g.fillRoundedRect(0, 0, 24, 24, 6);
    g.generateTexture("pow-spread", 24, 24);

    g.clear();
    g.fillStyle(0x60a5fa, 1);
    g.fillCircle(12, 12, 11);
    g.lineStyle(2, 0xe0f2fe, 1);
    g.strokeCircle(12, 12, 11);
    g.generateTexture("pow-shield", 24, 24);

    g.clear();
    g.fillStyle(0xfbbf24, 1);
    g.fillCircle(12, 12, 11);
    g.fillStyle(0xf97316, 1);
    g.fillCircle(12, 12, 5);
    g.generateTexture("pow-bomb", 24, 24);

    g.clear();
    g.fillStyle(0xf43f5e, 1);
    g.fillRect(0, 0, 8, 40);
    g.generateTexture("wall-laser", 8, 40);

    g.destroy();
  }

  function pulseBtn(scene, targets) {
    scene.tweens.add({
      targets: targets, scale: 1.08, duration: 90, yoyo: true, ease: "Back.easeOut"
    });
  }

  function makeButton(scene, x, y, label, color, onClick, width) {
    var bw = width || 300;
    var bg = scene.add.rectangle(x, y, bw, 50, color, 0.2)
      .setStrokeStyle(2, color, 0.9)
      .setInteractive({ useHandCursor: true });
    var txt = scene.add.text(x, y, label, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "18px", fontStyle: "bold", color: "#e2e8f0"
    }).setOrigin(0.5);
    bg.on("pointerover", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1.05, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerout", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerdown", function () {
      pulseBtn(scene, [bg, txt]);
      SFX.click();
      onClick();
    });
    return { bg: bg, txt: txt };
  }

  class BootScene extends Phaser.Scene {
    constructor() { super("BootScene"); }
    create() {
      makeTextures(this);
      this.cameras.main.setBackgroundColor("#04060c");
      this.cameras.main.fadeIn(320, 4, 6, 12);
      var t = this.add.text(W / 2, H / 2 - 8, "GALACTIC INVADER 2026", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "24px", fontStyle: "bold", color: "#22d3ee"
      }).setOrigin(0.5).setAlpha(0);
      this.add.text(W / 2, H / 2 + 28, "Phaser 3 · RainyNightFrog", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", color: "#64748b"
      }).setOrigin(0.5);
      this.tweens.add({ targets: t, alpha: 1, scale: 1.04, duration: 400, ease: "Back.easeOut" });
      this.time.delayedCall(520, function () { this.scene.start("MainMenuScene"); }, [], this);
    }
  }

  class MainMenuScene extends Phaser.Scene {
    constructor() { super("MainMenuScene"); }
    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(200, 4, 6, 12);

      for (var i = 0; i < 50; i++) {
        var star = this.add.circle(
          Phaser.Math.Between(0, W), Phaser.Math.Between(0, H),
          Phaser.Math.Between(1, 2), 0x22d3ee, Phaser.Math.FloatBetween(0.1, 0.5)
        );
        this.tweens.add({
          targets: star, alpha: 0.08, duration: Phaser.Math.Between(700, 1600),
          yoyo: true, repeat: -1, ease: "Sine.easeInOut"
        });
      }

      var badge = this.add.text(W / 2, 78, "RAINYNIGHTFROG · CYBER ARCADE", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "11px", fontStyle: "bold",
        color: "#22d3ee", letterSpacing: 3
      }).setOrigin(0.5).setAlpha(0);

      var title = this.add.text(W / 2, 140, "GALACTIC INVADER 2026", {
        fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
        fontSize: "32px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setScale(0.65).setAlpha(0);

      var sub = this.add.text(W / 2, 195, "星際侵略者 · 散彈升級 · 護盾／核爆 · 巨型 Boss", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "15px", color: "#94a3b8"
      }).setOrigin(0.5).setAlpha(0);

      this.tweens.add({ targets: badge, alpha: 1, y: 88, duration: 400, ease: "Cubic.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 50 });
      this.tweens.add({ targets: sub, alpha: 1, duration: 380, ease: "Cubic.easeOut", delay: 120 });

      var self = this;
      makeButton(this, W / 2, 300, "開始遊戲 START", 0x22d3ee, function () {
        SFX.confirm();
        self.cameras.main.fadeOut(160, 4, 6, 12);
        self.time.delayedCall(170, function () { self.scene.start("DifficultyScene"); });
      });
      makeButton(this, W / 2, 370, "設定 SETTINGS", 0xa78bfa, function () {
        self.scene.launch("SettingsScene");
      });
      makeButton(this, W / 2, 440, "操作說明", 0x64748b, function () {
        if (self.helpTxt) return;
        self.helpTxt = self.add.text(W / 2, 500,
          "拖曳／WASD／方向鍵移動 · 空白射擊 · B 核爆清屏 · 每 3 波 Boss", {
          fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
          fontSize: "13px", color: "#c4b5fd"
        }).setOrigin(0.5).setAlpha(0);
        self.tweens.add({ targets: self.helpTxt, alpha: 1, y: 492, duration: 280, ease: "Cubic.easeOut" });
      }, 220);
    }
  }

  class DifficultyScene extends Phaser.Scene {
    constructor() { super("DifficultyScene"); }
    create() {
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(160, 4, 6, 12);

      var head = this.add.text(W / 2, 70, "選擇難度", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "34px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setScale(0.7).setAlpha(0);
      this.tweens.add({ targets: head, alpha: 1, scale: 1, duration: 360, ease: "Back.easeOut" });

      this.add.text(W / 2, 118, "生存越久 → 敵機與子彈越快 · HUD 顯示 DANGER", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "14px", color: "#64748b"
      }).setOrigin(0.5);

      var self = this;
      ["casual", "standard", "extreme"].forEach(function (key, i) {
        var d = DIFF[key];
        var col = Phaser.Display.Color.HexStringToColor(d.color).color;
        var y = 190 + i * 88;
        makeButton(self, W / 2, y, d.label, col, function () {
          selectedDiff = key;
          SFX.confirm();
          self.cameras.main.fadeOut(160, 4, 6, 12);
          self.time.delayedCall(170, function () {
            self.scene.start("GameScene", { difficulty: key });
          });
        });
        self.add.text(W / 2, y + 32, d.desc + " · 分數 x" + d.scoreMult.toFixed(2), {
          fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
          fontSize: "12px", color: "#94a3b8"
        }).setOrigin(0.5);
      });

      makeButton(this, W / 2, 490, "返回", 0x475569, function () {
        self.scene.start("MainMenuScene");
      }, 160);
    }
  }

  class SettingsScene extends Phaser.Scene {
    constructor() { super("SettingsScene"); }
    create() {
      var dim = this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.75).setInteractive().setDepth(100);
      var panel = this.add.rectangle(W / 2, H / 2, 420, 300, 0x0b1220, 0.98)
        .setStrokeStyle(2, 0x22d3ee, 0.85).setScale(0.75).setAlpha(0).setDepth(101);
      var title = this.add.text(W / 2, H / 2 - 110, "設定選單", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "26px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setAlpha(0).setDepth(102);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 300, ease: "Back.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, duration: 260, ease: "Cubic.easeOut", delay: 50 });

      var self = this;
      var sfxBtn = makeButton(this, W / 2, H / 2 - 20, gameSettings.sfx ? "音效：開" : "音效：關", 0x22d3ee, function () {
        gameSettings.sfx = !gameSettings.sfx; saveSettings(); SFX.toggle();
        sfxBtn.txt.setText(gameSettings.sfx ? "音效：開" : "音效：關");
      }, 260);
      sfxBtn.bg.setDepth(102); sfxBtn.txt.setDepth(103);

      var shakeBtn = makeButton(this, W / 2, H / 2 + 50, gameSettings.shake ? "震屏：開" : "震屏：關", 0xa78bfa, function () {
        gameSettings.shake = !gameSettings.shake; saveSettings(); SFX.toggle();
        shakeBtn.txt.setText(gameSettings.shake ? "震屏：開" : "震屏：關");
      }, 260);
      shakeBtn.bg.setDepth(102); shakeBtn.txt.setDepth(103);

      var closeBtn = makeButton(this, W / 2, H / 2 + 120, "關閉", 0x64748b, function () {
        self.scene.stop("SettingsScene");
      }, 180);
      closeBtn.bg.setDepth(102); closeBtn.txt.setDepth(103);

      dim.on("pointerdown", function () { self.scene.stop("SettingsScene"); });
    }
  }

  class GameScene extends Phaser.Scene {
    constructor() { super("GameScene"); }

    init(data) {
      this.diffKey = (data && data.difficulty) || selectedDiff || "standard";
      this.diff = DIFF[this.diffKey] || DIFF.standard;
      selectedDiff = this.diffKey;
    }

    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#050814");
      this.cameras.main.fadeIn(180, 4, 6, 12);

      this.score = 0;
      this.lives = 3;
      this.wave = 0;
      this.wavesCleared = 0;
      this.weaponLevel = 1;
      this.shield = this.diff.startShield;
      this.bombs = 1;
      this.elapsed = 0;
      this.dangerMultiplier = 1;
      this.alive = true;
      this.invuln = 0;
      this.shootCd = 0;
      this.enemyFireAcc = 0;
      this.boss = null;
      this.bossPhase = 0;
      this.bossFireAcc = 0;
      this.formation = [];
      this.formDir = 1;
      this.formDrop = 0;
      this.dragActive = false;

      this.drawStars();

      this.player = this.physics.add.image(W / 2, H - 70, "player");
      this.player.setCollideWorldBounds(true);
      this.player.body.allowGravity = false;
      this.player.setDepth(20);
      this.player.setDrag(1200);
      this.player.setMaxVelocity(420, 0);

      this.shieldRing = this.add.circle(this.player.x, this.player.y, 30, 0x60a5fa, 0.15)
        .setStrokeStyle(2, 0x93c5fd, 0.9).setDepth(19).setVisible(this.shield > 0);

      this.bullets = this.physics.add.group();
      this.enemies = this.physics.add.group();
      this.ebullets = this.physics.add.group();
      this.powerups = this.physics.add.group();
      this.wallLasers = this.physics.add.group();

      this.physics.add.overlap(this.bullets, this.enemies, this.onBulletEnemy, null, this);
      this.physics.add.overlap(this.ebullets, this.player, this.onEnemyBulletPlayer, null, this);
      this.physics.add.overlap(this.enemies, this.player, this.onEnemyPlayer, null, this);
      this.physics.add.overlap(this.player, this.powerups, this.onPower, null, this);
      this.physics.add.overlap(this.player, this.wallLasers, this.onWallLaser, null, this);

      this.bossBarBg = this.add.rectangle(W / 2, 28, 420, 14, 0x1e293b, 1).setDepth(40).setVisible(false);
      this.bossBar = this.add.rectangle(W / 2 - 210, 28, 420, 10, 0xf472b6, 1).setOrigin(0, 0.5).setDepth(41).setVisible(false);
      this.bossLabel = this.add.text(W / 2, 12, "BOSS", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "12px", fontStyle: "bold", color: "#f9a8d4"
      }).setOrigin(0.5, 0).setDepth(41).setVisible(false);

      this.flash = this.add.rectangle(W / 2, H / 2, W, H, 0xffffff, 0).setDepth(70);
      this.createHud();
      this.bindInput();

      if (this.diff.wallLaser) this.spawnWallLasers();
      this.nextWave();
    }

    drawStars() {
      var g = this.add.graphics().setDepth(0);
      g.fillStyle(0x050814, 1);
      g.fillRect(0, 0, W, H);
      this.starField = [];
      for (var i = 0; i < 70; i++) {
        this.starField.push({
          x: Math.random() * W,
          y: Math.random() * H,
          s: 0.5 + Math.random() * 1.5,
          sp: 20 + Math.random() * 80,
          g: this.add.circle(0, 0, 1, 0x22d3ee, 0.2 + Math.random() * 0.4).setDepth(1)
        });
      }
    }

    createHud() {
      this.hudScore = this.add.text(14, 10, "SCORE 0", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "16px", fontStyle: "bold", color: "#67e8f9"
      }).setDepth(50);
      this.hudDanger = this.add.text(14, 32, "DANGER: x1.00", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "14px", fontStyle: "bold", color: "#f472b6"
      }).setDepth(50);
      this.hudLives = this.add.text(W / 2, 10, "❤ 3", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "15px", fontStyle: "bold", color: "#f472b6"
      }).setOrigin(0.5, 0).setDepth(50);
      this.hudWave = this.add.text(W / 2, 32, "WAVE 1", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", color: "#94a3b8"
      }).setOrigin(0.5, 0).setDepth(50);
      this.hudDiff = this.add.text(W - 14, 10, this.diff.label, {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif", fontSize: "13px", color: this.diff.color
      }).setOrigin(1, 0).setDepth(50);
      this.hudPower = this.add.text(W - 14, 32, "", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif", fontSize: "12px", color: "#94a3b8"
      }).setOrigin(1, 0).setDepth(50);
      this.hudHint = this.add.text(W / 2, H - 16, "B / 點擊核爆圖示 釋放電磁脈衝", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif", fontSize: "11px", color: "#64748b"
      }).setOrigin(0.5).setDepth(50);
    }

    bindInput() {
      this.cursors = this.input.keyboard.createCursorKeys();
      this.keys = this.input.keyboard.addKeys("W,A,S,D,SPACE,B");
      var self = this;

      this.input.on("pointerdown", function (p) {
        if (!self.alive) return;
        self.dragActive = true;
        self.player.x = Phaser.Math.Clamp(p.x, 30, W - 30);
      });
      this.input.on("pointermove", function (p) {
        if (!self.alive) return;
        if (self.dragActive || p.isDown) {
          self.player.x = Phaser.Math.Clamp(p.x, 30, W - 30);
        }
      });
      this.input.on("pointerup", function () { self.dragActive = false; });

      this.input.keyboard.on("keydown-B", function () { self.fireBomb(); });
      this.input.keyboard.on("keydown-SPACE", function () { /* auto fire while held in update */ });
    }

    spawnWallLasers() {
      var left = this.wallLasers.create(20, H / 2, "wall-laser");
      left.setDisplaySize(10, 80);
      left.body.allowGravity = false;
      left.setData("side", "left");
      left.setData("phase", 0);
      left.setBlendMode(Phaser.BlendModes.ADD);
      left.setDepth(8);

      var right = this.wallLasers.create(W - 20, H / 2, "wall-laser");
      right.setDisplaySize(10, 80);
      right.body.allowGravity = false;
      right.setData("side", "right");
      right.setData("phase", Math.PI);
      right.setBlendMode(Phaser.BlendModes.ADD);
      right.setDepth(8);
    }

    nextWave() {
      if (!this.alive) return;
      this.wave++;
      this.hudWave.setText("WAVE " + this.wave);

      if (this.wavesCleared > 0 && this.wavesCleared % 3 === 0) {
        this.spawnBoss();
        return;
      }

      this.spawnFormation();
    }

    spawnFormation() {
      this.enemies.clear(true, true);
      this.formation = [];
      var rows = Math.min(3 + Math.floor(this.wave / 2), 5);
      var cols = 8;
      var startX = 140;
      var startY = 80;
      var threat = this.dangerMultiplier;

      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var e = this.enemies.create(startX + c * 80, startY + r * 48, "enemy");
          e.body.allowGravity = false;
          e.setImmovable(true);
          e.setDepth(12);
          e.setData("hp", Math.ceil((1 + Math.floor(this.wave / 3)) * (0.8 + threat * 0.2)));
          e.setData("baseX", e.x);
          e.setData("baseY", e.y);
          e.setData("col", c);
          e.setData("row", r);
          this.formation.push(e);
        }
      }
      this.formDir = 1;
      this.formOffset = 0;
    }

    spawnBoss() {
      SFX.boss();
      doShake(this.cameras.main, 150, 0.015);
      this.enemies.clear(true, true);
      this.formation = [];

      var hp = Math.floor(80 * this.diff.bossFireMult * (1 + this.wave * 0.15) * this.dangerMultiplier);
      this.boss = this.physics.add.image(W / 2, 100, "boss");
      this.boss.body.allowGravity = false;
      this.boss.setImmovable(true);
      this.boss.setDepth(15);
      this.boss.setData("hp", hp);
      this.boss.setData("maxHp", hp);
      this.boss.setData("isBoss", true);
      this.enemies.add(this.boss);

      this.bossPhase = 1;
      this.bossFireAcc = 0;
      this.bossBarBg.setVisible(true);
      this.bossBar.setVisible(true);
      this.bossLabel.setVisible(true);
      this.bossBar.width = 420;
      this.bossLabel.setText("CYBER TITAN · PHASE 1");

      neonBurst(this, W / 2, 100, 0xf472b6, 28);
    }

    firePlayer() {
      if (this.shootCd > 0 || !this.alive) return;
      this.shootCd = Math.max(0.12, 0.22 - this.weaponLevel * 0.02);
      SFX.shoot();

      var level = this.weaponLevel;
      var angles = [0];
      if (level >= 2) angles = [-0.2, 0.2];
      if (level >= 3) angles = [-0.35, 0, 0.35];
      if (level >= 4) angles = [-0.5, -0.25, 0, 0.25, 0.5];
      if (level >= 5) angles = [-0.55, -0.28, 0, 0.28, 0.55];

      for (var i = 0; i < angles.length; i++) {
        var key = i % 2 === 0 ? "bullet-cyan" : "bullet-violet";
        var b = this.bullets.create(this.player.x, this.player.y - 22, key);
        b.body.allowGravity = false;
        b.setDepth(16);
        b.setBlendMode(Phaser.BlendModes.ADD);
        var spd = 520;
        var a = -Math.PI / 2 + angles[i];
        b.setVelocity(Math.cos(a) * spd, Math.sin(a) * spd);
        b.setData("dmg", 1);
      }
    }

    fireBomb() {
      if (!this.alive || this.bombs <= 0) return;
      this.bombs--;
      SFX.bomb();
      doShake(this.cameras.main, 280, 0.03);

      this.flash.setFillStyle(0xa78bfa, 1);
      this.flash.setAlpha(0.7);
      this.tweens.add({ targets: this.flash, alpha: 0, duration: 400, ease: "Cubic.easeOut" });

      neonBurst(this, W / 2, H / 2, 0xfbbf24, 36);
      neonBurst(this, W / 2, H / 2, 0xa78bfa, 28);

      var self = this;
      // clear enemy bullets
      this.ebullets.clear(true, true);

      // damage all enemies
      this.enemies.getChildren().slice().forEach(function (e) {
        if (!e.active) return;
        if (e.getData("isBoss")) {
          self.damageEnemy(e, 25);
        } else {
          self.damageEnemy(e, 99);
        }
      });

      this.score += Math.floor(100 * this.diff.scoreMult);
    }

    onBulletEnemy(bullet, enemy) {
      if (!bullet.active || !enemy.active) return;
      bullet.destroy();
      this.damageEnemy(enemy, bullet.getData("dmg") || 1);
    }

    damageEnemy(enemy, dmg) {
      var hp = (enemy.getData("hp") || 1) - dmg;
      enemy.setData("hp", hp);
      doShake(this.cameras.main, 80, 0.008);
      SFX.hit();
      neonBurst(this, enemy.x, enemy.y, enemy.getData("isBoss") ? 0xf472b6 : 0x22d3ee, 15);

      if (hp > 0) {
        this.tweens.add({
          targets: enemy, scaleX: 1.15, scaleY: 0.9, duration: 60, yoyo: true, ease: "Cubic.easeOut"
        });
        if (enemy.getData("isBoss")) this.updateBossBar();
        return;
      }

      // kill
      SFX.explode();
      var pts = enemy.getData("isBoss")
        ? Math.floor(1500 * this.diff.scoreMult * this.dangerMultiplier)
        : Math.floor(50 * this.diff.scoreMult * this.dangerMultiplier);
      this.score += pts;

      if (enemy.getData("isBoss")) {
        this.onBossDefeated(enemy);
      } else {
        if (Math.random() < this.diff.powerRate) this.spawnPower(enemy.x, enemy.y);
        neonBurst(this, enemy.x, enemy.y, 0xf472b6, 20);
        enemy.destroy();
        this.checkWaveClear();
      }
    }

    updateBossBar() {
      if (!this.boss || !this.boss.active) return;
      var ratio = Math.max(0, this.boss.getData("hp") / this.boss.getData("maxHp"));
      this.bossBar.width = 420 * ratio;
      var phase = ratio > 0.66 ? 1 : (ratio > 0.33 ? 2 : 3);
      if (phase !== this.bossPhase) {
        this.bossPhase = phase;
        this.bossLabel.setText("CYBER TITAN · PHASE " + phase);
        doShake(this.cameras.main, 120, 0.015);
        SFX.boss();
      }
    }

    onBossDefeated(boss) {
      var x = boss.x, y = boss.y;
      boss.destroy();
      this.boss = null;
      this.bossBarBg.setVisible(false);
      this.bossBar.setVisible(false);
      this.bossLabel.setVisible(false);

      // cascading explosions
      var self = this;
      for (var i = 0; i < 5; i++) {
        (function (i) {
          self.time.delayedCall(i * 100, function () {
            doShake(self.cameras.main, 100, 0.02);
            neonBurst(self, x + Phaser.Math.Between(-40, 40), y + Phaser.Math.Between(-20, 20), 0xfbbf24, 22);
            neonBurst(self, x, y, 0xf472b6, 18);
            SFX.explode();
          });
        })(i);
      }

      this.bombs = Math.min(3, this.bombs + 1);
      this.spawnPower(x, y);
      this.time.delayedCall(700, function () {
        self.wavesCleared++;
        self.nextWave();
      });
    }

    checkWaveClear() {
      if (this.boss) return;
      if (this.enemies.countActive(true) > 0) return;
      this.wavesCleared++;
      var self = this;
      this.time.delayedCall(600, function () { self.nextWave(); });
    }

    spawnPower(x, y) {
      var types = ["spread", "shield", "bomb"];
      var type = types[Phaser.Math.Between(0, types.length - 1)];
      var p = this.powerups.create(x, y, "pow-" + type);
      p.body.allowGravity = false;
      p.setVelocity(0, 90);
      p.setData("type", type);
      p.setDepth(14);
      this.tweens.add({
        targets: p, scale: 1.2, duration: 350, yoyo: true, repeat: -1, ease: "Sine.easeInOut"
      });
    }

    onPower(_player, p) {
      if (!p.active) return;
      var type = p.getData("type");
      p.destroy();
      SFX.power();
      neonBurst(this, this.player.x, this.player.y, 0xfbbf24, 16);

      if (type === "spread") {
        this.weaponLevel = Math.min(5, this.weaponLevel + 1);
      } else if (type === "shield") {
        this.shield = Math.min(2, this.shield + 2);
        this.shieldRing.setVisible(true);
        SFX.shield();
      } else if (type === "bomb") {
        this.bombs = Math.min(3, this.bombs + 1);
      }
    }

    hurtPlayer() {
      if (!this.alive || this.invuln > 0) return;

      if (this.shield > 0) {
        this.shield--;
        this.invuln = 0.8;
        SFX.shieldBreak();
        doShake(this.cameras.main, 120, 0.014);
        neonBurst(this, this.player.x, this.player.y, 0x60a5fa, 24);
        // shockwave ring
        var ring = this.add.circle(this.player.x, this.player.y, 20, 0x60a5fa, 0.3)
          .setStrokeStyle(3, 0x93c5fd, 0.9).setDepth(25);
        this.tweens.add({
          targets: ring, scale: 3.5, alpha: 0, duration: 280, ease: "Cubic.easeOut",
          onComplete: function () { ring.destroy(); }
        });
        if (this.shield <= 0) this.shieldRing.setVisible(false);
        return;
      }

      this.lives--;
      this.invuln = 1.5;
      this.weaponLevel = Math.max(1, this.weaponLevel - 1);
      SFX.explode();
      doShake(this.cameras.main, 160, 0.018);
      neonBurst(this, this.player.x, this.player.y, 0x22d3ee, 22);

      if (this.lives <= 0) this.die();
    }

    onEnemyBulletPlayer(_player, bullet) {
      if (!bullet.active) return;
      bullet.destroy();
      this.hurtPlayer();
    }

    onEnemyPlayer(_player, enemy) {
      if (!enemy.active) return;
      if (!enemy.getData("isBoss")) {
        this.damageEnemy(enemy, 99);
      }
      this.hurtPlayer();
    }

    onWallLaser(_player, laser) {
      if (!laser.active) return;
      this.hurtPlayer();
    }

    enemyShoot() {
      var list = this.enemies.getChildren().filter(function (e) { return e.active && !e.getData("isBoss"); });
      if (!list.length) return;
      var shooter = Phaser.Utils.Array.GetRandom(list);
      var b = this.ebullets.create(shooter.x, shooter.y + 12, this.diff.homing ? "homing" : "ebullet");
      b.body.allowGravity = false;
      b.setDepth(14);
      b.setData("homing", this.diff.homing && Math.random() < 0.45);
      var spd = 180 * this.diff.enemySpd * (0.85 + this.dangerMultiplier * 0.25);
      if (b.getData("homing")) {
        var ang = Phaser.Math.Angle.Between(shooter.x, shooter.y, this.player.x, this.player.y);
        b.setVelocity(Math.cos(ang) * spd, Math.sin(ang) * spd);
      } else {
        b.setVelocity(0, spd);
      }
    }

    bossShoot() {
      if (!this.boss || !this.boss.active) return;
      var phase = this.bossPhase;
      var cx = this.boss.x, cy = this.boss.y + 30;
      var spd = 200 * this.diff.bossFireMult * (0.9 + this.dangerMultiplier * 0.2);
      var count = phase === 1 ? 5 : (phase === 2 ? 8 : 12);
      var spread = phase === 1 ? 0.8 : (phase === 2 ? 1.2 : 1.6);

      if (phase === 3 && this.diff.homing) {
        // homing volley
        for (var h = 0; h < 3; h++) {
          var hb = this.ebullets.create(cx + (h - 1) * 24, cy, "homing");
          hb.body.allowGravity = false;
          hb.setData("homing", true);
          hb.setDepth(14);
          var ang = Phaser.Math.Angle.Between(cx, cy, this.player.x, this.player.y) + (h - 1) * 0.15;
          hb.setVelocity(Math.cos(ang) * spd * 1.1, Math.sin(ang) * spd * 1.1);
        }
      }

      for (var i = 0; i < count; i++) {
        var t = count === 1 ? 0 : (i / (count - 1) - 0.5) * spread;
        var a = Math.PI / 2 + t;
        var b = this.ebullets.create(cx, cy, "ebullet");
        b.body.allowGravity = false;
        b.setDepth(14);
        b.setVelocity(Math.cos(a) * spd, Math.sin(a) * spd);
      }
    }

    die() {
      if (!this.alive) return;
      this.alive = false;
      SFX.die();

      this.flash.setFillStyle(0xffffff, 1);
      this.flash.setAlpha(0.9);
      this.tweens.add({ targets: this.flash, alpha: 0, duration: 500, ease: "Cubic.easeOut" });
      doShake(this.cameras.main, 300, 0.035);

      neonBurst(this, this.player.x, this.player.y, 0x22d3ee, 30);
      neonBurst(this, this.player.x, this.player.y, 0xa78bfa, 22);
      this.tweens.add({
        targets: this.player,
        scaleX: 1.8, scaleY: 0.3, alpha: 0, angle: 40,
        duration: 400, ease: "Cubic.easeIn"
      });

      var finalScore = Math.floor(this.score);
      var meta = {
        slug: "galactic-invader-2026",
        difficulty: this.diff.id,
        wave: this.wave,
        weapon: this.weaponLevel,
        dangerPeak: Number(this.dangerMultiplier.toFixed(2))
      };
      try {
        if (typeof RNF !== "undefined" && RNF.submitScore) RNF.submitScore(finalScore, meta);
      } catch (_e) {}

      var self = this;
      this.time.delayedCall(550, function () {
        self.scene.launch("GameOverModal", {
          score: finalScore,
          wave: self.wave,
          danger: self.dangerMultiplier,
          weapon: self.weaponLevel,
          diff: self.diff
        });
      });
    }

    update(_t, delta) {
      if (!this.alive) return;
      var dt = Math.min(0.05, delta / 1000);
      this.elapsed += dt;
      this.dangerMultiplier = 1 + Math.log(1 + this.elapsed / 30) * 0.8;
      var threat = this.dangerMultiplier;

      // stars
      for (var i = 0; i < this.starField.length; i++) {
        var s = this.starField[i];
        s.y += s.sp * dt * (0.8 + threat * 0.3);
        if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
        s.g.setPosition(s.x, s.y);
      }

      // keyboard move
      var spd = 380;
      var vx = 0;
      if (this.cursors.left.isDown || this.keys.A.isDown) vx = -spd;
      if (this.cursors.right.isDown || this.keys.D.isDown) vx = spd;
      this.player.setVelocityX(vx);

      // fire when holding space or dragging (touch)
      this.shootCd = Math.max(0, this.shootCd - dt);
      if (this.keys.SPACE.isDown || this.dragActive) this.firePlayer();

      this.invuln = Math.max(0, this.invuln - dt);
      this.player.setAlpha(this.invuln > 0 ? (Math.sin(this.invuln * 25) > 0 ? 1 : 0.35) : 1);
      this.shieldRing.setPosition(this.player.x, this.player.y);
      this.shieldRing.rotation += dt * 2.5;
      this.shieldRing.setVisible(this.shield > 0);

      // formation movement
      if (!this.boss && this.formation.length) {
        this.formOffset += this.formDir * 60 * this.diff.enemySpd * threat * dt;
        if (Math.abs(this.formOffset) > 70) {
          this.formDir *= -1;
          this.formDrop += 12;
        }
        for (var f = 0; f < this.formation.length; f++) {
          var e = this.formation[f];
          if (!e.active) continue;
          e.x = e.getData("baseX") + this.formOffset;
          e.y = e.getData("baseY") + this.formDrop;
          if (e.y > H - 100) this.hurtPlayer();
        }

        this.enemyFireAcc += dt * this.diff.enemyFire * threat;
        if (this.enemyFireAcc >= 1.1) {
          this.enemyFireAcc = 0;
          this.enemyShoot();
        }
      }

      // boss
      if (this.boss && this.boss.active) {
        this.boss.x = W / 2 + Math.sin(this.elapsed * 1.2) * 180;
        this.bossFireAcc += dt * this.diff.bossFireMult * threat;
        var interval = this.bossPhase === 1 ? 1.2 : (this.bossPhase === 2 ? 0.85 : 0.55);
        if (this.bossFireAcc >= interval) {
          this.bossFireAcc = 0;
          this.bossShoot();
        }
        this.updateBossBar();
      }

      // homing bullets steer
      var self = this;
      this.ebullets.getChildren().forEach(function (b) {
        if (!b.active) return;
        if (b.getData("homing") && self.player.active) {
          var ang = Phaser.Math.Angle.Between(b.x, b.y, self.player.x, self.player.y);
          var cur = Math.atan2(b.body.velocity.y, b.body.velocity.x);
          var next = Phaser.Math.Angle.RotateTo(cur, ang, 1.8 * dt);
          var sp = Math.sqrt(b.body.velocity.x * b.body.velocity.x + b.body.velocity.y * b.body.velocity.y) || 200;
          b.setVelocity(Math.cos(next) * sp, Math.sin(next) * sp);
        }
        if (b.y > H + 40 || b.y < -40 || b.x < -40 || b.x > W + 40) b.destroy();
      });

      this.bullets.getChildren().forEach(function (b) {
        if (b.active && (b.y < -20 || b.x < -20 || b.x > W + 20)) b.destroy();
      });

      this.powerups.getChildren().forEach(function (p) {
        if (p.active && p.y > H + 30) p.destroy();
      });

      // wall lasers move
      this.wallLasers.getChildren().forEach(function (l) {
        if (!l.active) return;
        var phase = l.getData("phase") + dt * 1.5;
        l.setData("phase", phase);
        l.y = H / 2 + Math.sin(phase) * (H * 0.35);
      });

      this.hudScore.setText("SCORE " + this.score.toLocaleString());
      this.hudDanger.setText("DANGER: x" + this.dangerMultiplier.toFixed(2));
      this.hudLives.setText("❤ " + this.lives);
      this.hudPower.setText(
        "WPN Lv" + this.weaponLevel +
        (this.shield > 0 ? " · 盾×" + this.shield : "") +
        " · 核爆×" + this.bombs
      );
    }
  }

  class GameOverModal extends Phaser.Scene {

      this.tweens.add({ targets: scoreTxt, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 100 });

      neonBurst(this, W / 2, H / 2 - 40, 0x22d3ee, 22);

      var self = this;
      var retry = makeButton(this, W / 2 - 110, H / 2 + 130, "再試一次", 0x22d3ee, function () {

        self.scene.launch("SettingsScene");
      }, 180);
      settings.bg.setDepth(73); settings.txt.setDepth(74);

      var menu = makeButton(this, W / 2, H / 2 + 190, "主選單", 0x64748b, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        self.scene.stop("SettingsScene");
        self.scene.stop("GameScene");
        self.scene.start("MainMenuScene");
      }, 200);
      menu.bg.setDepth(73); menu.txt.setDepth(74);
    }
  }

  var config = {
    type: Phaser.WEBGL,
    parent: "game-host",
    width: W,
    height: H,
    backgroundColor: "#04060c",
    banner: false,
    physics: {
      default: "arcade",
      arcade: { gravity: { y: 0 }, debug: false }
    },
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    fps: { target: 144, forceSet: false, smoothStep: true },
    scene: [BootScene, MainMenuScene, DifficultyScene, GameScene, GameOverModal, SettingsScene]
  };

  try {
    window.__GALACTIC_INVADER__ = new Phaser.Game(config);
  } catch (_e) {
    config.type = Phaser.AUTO;
    window.__GALACTIC_INVADER__ = new Phaser.Game(config);
  }
})();
</script>
</body>
</html>
