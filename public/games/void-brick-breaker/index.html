<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Void Brick Breaker · 虛空打磚塊</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #04060c; overflow: hidden;
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      touch-action: none;
    }
    #game-host { width: 100%; height: 100%; }
  </style>
  <script src="/sdk/phaser.min.js"></script>
  <script src="/sdk/rnf-i18n.js?v=20260730d"></script>
  <script src="/sdk/rnf-game-packs.js?v=20260731p"></script>
  <script src="/sdk/rnf-game-sdk.js?v=20260805lb11"></script>
  <script src="/games/_shared/rnf-phaser-leaderboard.js?v=20260805lb11"></script>
  <script src="/games/_shared/rnf-phaser-help.js?v=20260731d"></script>
</head>
<body>
  <div id="game-host"></div>
<script>
/**
 * Void Brick Breaker — Phaser 3 商業級電競重構
 * Boot → MainMenu → Difficulty → Game → GameOverModal (+ Settings)
 * Juice：磚塊碎裂／底板擠壓／多球·雷射·磁力
 * Casual 長板慢球 · Standard · Extreme 短板＋移動黑洞磚
 */
(function () {
  "use strict";

  if (typeof RNF !== "undefined" && RNF.init) RNF.init();

  var W = 960;
  var H = 540;
  var SETTINGS_KEY = "rnf:void-brick-breaker:settings";
  var BRICK_COLORS = [0x22d3ee, 0xa78bfa, 0xf472b6, 0x34d399, 0xfbbf24];
  var BRICK_CSS = ["#22d3ee", "#a78bfa", "#f472b6", "#34d399", "#fbbf24"];

  var DIFF = {
    casual: {
      id: "casual",
      label: "Casual 輕鬆",
      desc: "底板較長 · 球速平緩 · 道具機率高",
      color: "#67e8f9",
      scoreMult: 1.0,
      paddleW: 150,
      ballSpeed: 260,
      powerRate: 0.24,
      rows: 5,
      cols: 11,
      voidRate: 0.04,
      steelRate: 0.05,
      explodeRate: 0.08
    },
    standard: {
      id: "standard",
      label: "Standard 電競",
      desc: "標準底板 · 虛空／鋼鐵／爆破混編",
      color: "#a78bfa",
      scoreMult: 1.35,
      paddleW: 118,
      ballSpeed: 320,
      powerRate: 0.14,
      rows: 6,
      cols: 13,
      voidRate: 0.08,
      steelRate: 0.1,
      explodeRate: 0.09
    },
    extreme: {
      id: "extreme",
      label: "Extreme 狂暴",
      desc: "縮短底板 · 極速球 · 大量移動虛空磚",
      color: "#f472b6",
      scoreMult: 2.5,
      paddleW: 88,
      ballSpeed: 390,
      powerRate: 0.1,
      rows: 7,
      cols: 14,
      voidRate: 0.14,
      steelRate: 0.12,
      explodeRate: 0.1
    }
  };

  var selectedDiff = "standard";
  var gameSettings = loadSettings();

  function loadSettings() {
    var base = { sfx: true, shake: true };
    try {
      if (typeof RNF !== "undefined" && RNF.getSettings) {
        var s = RNF.getSettings();
        base.sfx = (s.sfxVolume == null ? 0.75 : s.sfxVolume) > 0.02;
        base.shake = s.screenShake !== false;
      }
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) Object.assign(base, JSON.parse(raw));
    } catch (_e) {}
    return base;
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameSettings));
      if (typeof RNF !== "undefined" && RNF.setSettings) {
        RNF.setSettings({
          sfxVolume: gameSettings.sfx ? 0.75 : 0,
          screenShake: !!gameSettings.shake
        });
      }
    } catch (_e) {}
  }

  /* ── Audio ── */
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
    function rnfGameVolMul() {
    try {
      if (typeof RNF !== "undefined" && RNF.getGameVolume) return RNF.getGameVolume();
      if (typeof window !== "undefined" && typeof window.__RNF_GAME_VOLUME__ === "number") return window.__RNF_GAME_VOLUME__;
    } catch (_e) {}
    return 1;
  }
  function tone(freq, dur, type, vol, slide) {
    if (!gameSettings.sfx || rnfGameVolMul() <= 0) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime((vol || 0.1) * rnfGameVolMul(), t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  var SFX = {
    click: function () { tone(520, 0.05, "triangle", 0.07); },
    confirm: function () { tone(660, 0.07, "square", 0.09); tone(990, 0.08, "triangle", 0.07); },
    hit: function () { tone(280, 0.05, "triangle", 0.07); },
    break: function (n) { tone(480 + Math.min(n || 0, 10) * 40, 0.07, "square", 0.1); },
    paddle: function () { tone(360, 0.05, "sawtooth", 0.07, 520); },
    power: function () { tone(700, 0.08, "square", 0.1); tone(980, 0.1, "triangle", 0.08); },
    laser: function () { tone(880, 0.05, "sawtooth", 0.08, 1400); },
    die: function () { tone(160, 0.22, "sawtooth", 0.14, 45); tone(70, 0.35, "triangle", 0.1); },
    launch: function () { tone(440, 0.06, "square", 0.08); },
    toggle: function () { tone(440, 0.05, "triangle", 0.07); }
  };

  function doShake(cam, dur, intens) {
    if (!gameSettings.shake || !cam) return;
    cam.shake(dur, intens);
  }

  function neonBurst(scene, x, y, tint, count) {
    var n = Phaser.Math.Clamp(count || 20, 15, 36);
    var emitter = scene.add.particles(x, y, "spark", {
      speed: { min: 70, max: 320 },
      angle: { min: 0, max: 360 },
      lifespan: { min: 260, max: 700 },
      scale: { start: 1.2, end: 0 },
      alpha: { start: 1, end: 0 },
      gravityY: 120,
      blendMode: "ADD",
      tint: tint,
      emitting: false
    });
    emitter.explode(n);
    scene.time.delayedCall(850, function () { if (emitter.destroy) emitter.destroy(); });
  }

  function makeTextures(scene) {
    var g = scene.make.graphics({ x: 0, y: 0, add: false });
    var i;

    g.clear();
    g.fillStyle(0xffffff, 1);
    g.fillCircle(8, 8, 7);
    g.fillStyle(0xffffff, 0.45);
    g.fillCircle(5, 5, 3);
    g.generateTexture("ball", 16, 16);

    g.clear();
    g.fillStyle(0x22d3ee, 1);
    g.fillRoundedRect(0, 0, 120, 16, 6);
    g.fillStyle(0xffffff, 0.35);
    g.fillRoundedRect(8, 3, 104, 5, 3);
    g.generateTexture("paddle", 120, 16);

    for (i = 0; i < BRICK_COLORS.length; i++) {
      g.clear();
      g.fillStyle(BRICK_COLORS[i], 1);
      g.fillRoundedRect(0, 0, 56, 22, 4);
      g.fillStyle(0xffffff, 0.28);
      g.fillRoundedRect(4, 3, 48, 6, 2);
      g.generateTexture("brick-" + i, 56, 22);
    }

    g.clear();
    g.fillStyle(0x0a0614, 1);
    g.fillRoundedRect(0, 0, 56, 22, 4);
    g.lineStyle(2, 0xa78bfa, 1);
    g.strokeRoundedRect(1, 1, 54, 20, 4);
    g.fillStyle(0xa78bfa, 0.5);
    g.fillCircle(28, 11, 6);
    g.generateTexture("brick-void", 56, 22);

    g.clear();
    g.fillStyle(0x64748b, 1);
    g.fillRoundedRect(0, 0, 56, 22, 4);
    g.fillStyle(0xe2e8f0, 0.45);
    g.fillRoundedRect(6, 4, 44, 6, 2);
    g.lineStyle(2, 0xcbd5e1, 1);
    g.strokeRoundedRect(1, 1, 54, 20, 4);
    g.generateTexture("brick-steel", 56, 22);

    g.clear();
    g.fillStyle(0xf97316, 1);
    g.fillRoundedRect(0, 0, 56, 22, 4);
    g.fillStyle(0xfef08a, 0.7);
    g.fillCircle(28, 11, 7);
    g.fillStyle(0xfb7185, 0.9);
    g.fillCircle(28, 11, 3);
    g.generateTexture("brick-explode", 56, 22);

    g.clear();
    g.fillStyle(0x22d3ee, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark", 6, 6);

    g.clear();
    g.fillStyle(0xfbbf24, 1);
    g.fillCircle(4, 4, 4);
    g.generateTexture("spark-gold", 8, 8);

    g.clear();
    g.fillStyle(0xf472b6, 1);
    g.fillCircle(4, 4, 4);
    g.generateTexture("spark-pink", 8, 8);

    // powerup icons
    var powers = [
      { key: "pow-multi", color: 0x34d399 },
      { key: "pow-laser", color: 0xfbbf24 },
      { key: "pow-magnet", color: 0xa78bfa },
      { key: "pow-wide", color: 0x22d3ee }
    ];
    for (i = 0; i < powers.length; i++) {
      g.clear();
      g.fillStyle(powers[i].color, 1);
      g.fillRoundedRect(0, 0, 28, 18, 5);
      g.generateTexture(powers[i].key, 28, 18);
    }

    g.clear();
    g.fillStyle(0xfbbf24, 1);
    g.fillRect(0, 0, 4, 18);
    g.generateTexture("laser-beam", 4, 18);

    g.destroy();
  }

  function pulseBtn(scene, targets) {
    scene.tweens.add({
      targets: targets, scale: 1.08, duration: 90, yoyo: true, ease: "Back.easeOut"
    });
  }

  function makeButton(scene, x, y, label, color, onClick, width) {
    var bw = width || 300;
    var bg = scene.add.rectangle(x, y, bw, 44, color, 0.2)
      .setStrokeStyle(2, color, 0.9)
      .setInteractive({ useHandCursor: true });
    var txt = scene.add.text(x, y, label, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "18px", fontStyle: "bold", color: "#e2e8f0"
    }).setOrigin(0.5);
    bg.on("pointerover", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1.05, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerout", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerdown", function () {
      pulseBtn(scene, [bg, txt]);
      SFX.click();
      onClick();
    });
    return { bg: bg, txt: txt };
  }

  /* ═══════════════ Boot ═══════════════ */
  class BootScene extends Phaser.Scene {
    constructor() { super("BootScene"); }
    create() {
      makeTextures(this);
      this.cameras.main.setBackgroundColor("#04060c");
      this.cameras.main.fadeIn(320, 4, 6, 12);
      var t = this.add.text(W / 2, H / 2 - 8, "VOID BRICK BREAKER", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "26px", fontStyle: "bold", color: "#22d3ee"
      }).setOrigin(0.5).setAlpha(0);
      this.add.text(W / 2, H / 2 + 28, "Phaser 3 · RainyNightFrog", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", color: "#64748b"
      }).setOrigin(0.5);
      this.tweens.add({ targets: t, alpha: 1, scale: 1.04, duration: 400, ease: "Back.easeOut" });
      this.time.delayedCall(520, function () { this.scene.start("MainMenuScene"); }, [], this);
    }
  }

  /* ═══════════════ Main Menu ═══════════════ */
  class MainMenuScene extends Phaser.Scene {
    constructor() { super("MainMenuScene"); }
    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(200, 4, 6, 12);

      for (var i = 0; i < 28; i++) {
        var brick = this.add.image(
          Phaser.Math.Between(40, W - 40), Phaser.Math.Between(40, H - 40),
          "brick-" + (i % BRICK_COLORS.length)
        ).setAlpha(0.08).setScale(Phaser.Math.FloatBetween(0.5, 1));
        this.tweens.add({
          targets: brick, alpha: 0.14, y: brick.y - 20,
          duration: Phaser.Math.Between(1400, 2800), yoyo: true, repeat: -1, ease: "Sine.easeInOut"
        });
      }

      var badge = this.add.text(W / 2, 78, "RAINYNIGHTFROG · CYBER ARCADE", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "11px", fontStyle: "bold",
        color: "#22d3ee", letterSpacing: 3
      }).setOrigin(0.5).setAlpha(0);

      var title = this.add.text(W / 2, 140, "VOID BRICK BREAKER", {
        fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
        fontSize: "36px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setScale(0.65).setAlpha(0);

      var sub = this.add.text(W / 2, 188, "虛空打磚塊 · 鋼鐵／爆破／虛空磚 · 多球雷射磁力", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "14px", color: "#94a3b8"
      }).setOrigin(0.5).setAlpha(0);

      this.tweens.add({ targets: badge, alpha: 1, y: 88, duration: 400, ease: "Cubic.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 50 });
      this.tweens.add({ targets: sub, alpha: 1, duration: 380, ease: "Cubic.easeOut", delay: 120 });

      var self = this;
      makeButton(this, W / 2, 280, "開始遊戲 START", 0x22d3ee, function () {
        SFX.confirm();
        self.cameras.main.fadeOut(160, 4, 6, 12);
        self.time.delayedCall(170, function () { self.scene.start("DifficultyScene"); });
      });
      makeButton(this, W / 2, 345, "設定 SETTINGS", 0xa78bfa, function () {
        self.scene.launch("SettingsScene");
      });
      makeButton(this, W / 2, 410, "排行榜", 0x34d399, function () {
        self.scene.start("LeaderboardScene", { difficulty: (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard" });
      });
      makeButton(this, W / 2, 475, "操作說明", 0x64748b, function () {
        if (window.RNFPhaserHelp && RNFPhaserHelp.showHelpOverlay) {
          RNFPhaserHelp.showHelpOverlay(self, "拖曳／A D／←→ 移動底板。空白鍵發射或開火（雷射）。鋼鐵磚需多擊；橙色爆破磚會炸鄰格；紫色虛空磚會左右游移。接住道具可獲多球／雷射／磁力／加寬。", { W: W, H: H });
        }
      }, 240);
    }
  }

  /* ═══════════════ Difficulty ═══════════════ */
  class DifficultyScene extends Phaser.Scene {
    constructor() { super("DifficultyScene"); }
    create() {
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(160, 4, 6, 12);

      var head = this.add.text(W / 2, 70, "選擇難度", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "34px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setScale(0.7).setAlpha(0);
      this.tweens.add({ targets: head, alpha: 1, scale: 1, duration: 360, ease: "Back.easeOut" });

      this.add.text(W / 2, 118, "連續反彈越多 → 球速與 DANGER 倍率越高", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "14px", color: "#64748b"
      }).setOrigin(0.5);

      var self = this;
      ["casual", "standard", "extreme"].forEach(function (key, i) {
        var d = DIFF[key];
        var col = Phaser.Display.Color.HexStringToColor(d.color).color;
        var y = 190 + i * 88;
        makeButton(self, W / 2, y, d.label, col, function () {
          selectedDiff = key;
          SFX.confirm();
          self.cameras.main.fadeOut(160, 4, 6, 12);
          self.time.delayedCall(170, function () {
            self.scene.start("GameScene", { difficulty: key });
          });
        });
        self.add.text(W / 2, y + 32, d.desc + " · 分數 x" + d.scoreMult.toFixed(2), {
          fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
          fontSize: "12px", color: "#94a3b8"
        }).setOrigin(0.5);
      });

      makeButton(this, W / 2, 490, "返回", 0x475569, function () {
        self.scene.start("MainMenuScene");
      }, 160);
    }
  }

  /* ═══════════════ Settings ═══════════════ */
  class SettingsScene extends Phaser.Scene {
    constructor() { super("SettingsScene"); }
    create() {
      var dim = this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.75).setInteractive().setDepth(100);
      var panel = this.add.rectangle(W / 2, H / 2, 420, 300, 0x0b1220, 0.98)
        .setStrokeStyle(2, 0x22d3ee, 0.85).setScale(0.75).setAlpha(0).setDepth(101);
      var title = this.add.text(W / 2, H / 2 - 110, "設定選單", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "26px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setAlpha(0).setDepth(102);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 300, ease: "Back.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, duration: 260, ease: "Cubic.easeOut", delay: 50 });

      var self = this;
      var sfxBtn = makeButton(this, W / 2, H / 2 - 20, gameSettings.sfx ? "音效：開" : "音效：關", 0x22d3ee, function () {
        gameSettings.sfx = !gameSettings.sfx; saveSettings(); SFX.toggle();
        sfxBtn.txt.setText(gameSettings.sfx ? "音效：開" : "音效：關");
      }, 260);
      sfxBtn.bg.setDepth(102); sfxBtn.txt.setDepth(103);

      var shakeBtn = makeButton(this, W / 2, H / 2 + 50, gameSettings.shake ? "震屏：開" : "震屏：關", 0xa78bfa, function () {
        gameSettings.shake = !gameSettings.shake; saveSettings(); SFX.toggle();
        shakeBtn.txt.setText(gameSettings.shake ? "震屏：開" : "震屏：關");
      }, 260);
      shakeBtn.bg.setDepth(102); shakeBtn.txt.setDepth(103);

      var closeBtn = makeButton(this, W / 2, H / 2 + 120, "關閉", 0x64748b, function () {
        self.scene.stop("SettingsScene");
      }, 180);
      closeBtn.bg.setDepth(102); closeBtn.txt.setDepth(103);

      dim.on("pointerdown", function () { self.scene.stop("SettingsScene"); });
    }
  }

  /* ═══════════════ Game ═══════════════ */
  class GameScene extends Phaser.Scene {
    constructor() { super("GameScene"); }

    init(data) {
      this.diffKey = (data && data.difficulty) || selectedDiff || "standard";
      this.diff = DIFF[this.diffKey] || DIFF.standard;
      selectedDiff = this.diffKey;
    }

    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#050814");
      this.cameras.main.fadeIn(180, 4, 6, 12);

      this.score = 0;
      this.lives = 3;
      this.level = 1;
      this.combo = 0;
      this.comboTimer = 0;
      this.bounces = 0;
      this.elapsedTime = 0;
      this.dangerMultiplier = 1;
      this.alive = true;
      this.serving = true;
      this.magnetOn = false;
      this.magnetTimer = 0;
      this.laserOn = false;
      this.laserTimer = 0;
      this.laserCd = 0;
      this.wideTimer = 0;
      this.dragActive = false;

      // background stars
      var bg = this.add.graphics().setDepth(0);
      bg.fillStyle(0x050814, 1);
      bg.fillRect(0, 0, W, H);
      for (var i = 0; i < 60; i++) {
        bg.fillStyle(0x22d3ee, Phaser.Math.FloatBetween(0.05, 0.25));
        bg.fillCircle(Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), Phaser.Math.Between(1, 2));
      }

      this.physics.world.setBounds(0, 0, W, H, true, true, true, false);

      this.paddleY = H - 48;
      this.paddle = this.physics.add.image(W / 2, this.paddleY, "paddle");
      this.paddle.setImmovable(true);
      this.paddle.body.allowGravity = false;
      // 禁止物理位移：避免球撞擊時把底板「撞飛」
      this.paddle.body.moves = false;
      this.paddle.setDisplaySize(this.diff.paddleW, 16);
      // 碰撞體略厚，減少高速球穿板
      this.paddle.body.setSize(this.diff.paddleW, 22);
      this.paddle.body.setOffset(
        (this.paddle.width - this.diff.paddleW) / 2,
        (this.paddle.height - 22) / 2
      );
      this.paddle.setCollideWorldBounds(false);
      this.paddle.setDepth(15);
      this.paddle.setVelocity(0, 0);
      this.basePaddleW = this.diff.paddleW;
      this.pinPaddle();

      this.balls = this.physics.add.group();
      this.bricks = this.physics.add.staticGroup();
      this.voidMovers = [];
      this.powerups = this.physics.add.group();
      this.lasers = this.physics.add.group();

      this.physics.add.collider(this.balls, this.paddle, this.onBallPaddle, null, this);
      this.physics.add.collider(this.balls, this.bricks, this.onBallBrick, null, this);
      this.physics.add.overlap(this.lasers, this.bricks, this.onLaserBrick, null, this);
      this.physics.add.overlap(this.paddle, this.powerups, this.onPowerCollect, null, this);

      this.buildLevel();
      this.spawnBall(true);

      this.flash = this.add.rectangle(W / 2, H / 2, W, H, 0xffffff, 0).setDepth(60);
      this.createHud();
      this.bindInput();
    }

    createHud() {
      this.hudScore = this.add.text(14, 10, "SCORE 0", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "16px", fontStyle: "bold", color: "#67e8f9"
      }).setDepth(40);
      this.hudDanger = this.add.text(14, 32, "DANGER: x1.00", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "14px", fontStyle: "bold", color: "#f472b6"
      }).setDepth(40);
      this.hudLives = this.add.text(W / 2, 10, "❤ 3", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "15px", fontStyle: "bold", color: "#f472b6"
      }).setOrigin(0.5, 0).setDepth(40);
      this.hudCombo = this.add.text(W / 2, 32, "COMBO —", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", color: "#fbbf24"
      }).setOrigin(0.5, 0).setDepth(40);
      this.hudDiff = this.add.text(W - 14, 10, this.diff.label, {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif", fontSize: "13px", color: this.diff.color
      }).setOrigin(1, 0).setDepth(40);
      this.hudPower = this.add.text(W - 14, 32, "", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif", fontSize: "12px", color: "#94a3b8"
      }).setOrigin(1, 0).setDepth(40);
      this.hudHint = this.add.text(W / 2, 52, "點擊／空白 發射", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif", fontSize: "12px", color: "#64748b"
      }).setOrigin(0.5, 0).setDepth(40);
    }

    bindInput() {
      this.cursors = this.input.keyboard.createCursorKeys();
      this.keys = this.input.keyboard.addKeys("A,D,SPACE");
      var self = this;

      this.input.on("pointerdown", function (p) {
        if (!self.alive) return;
        self.dragActive = true;
        self.movePaddleTo(p.x);
        if (self.serving) self.launchBalls();
        else if (self.hasStuckBall()) self.launchBalls();
      });
      this.input.on("pointermove", function (p) {
        if (!self.alive) return;
        if (self.dragActive || p.isDown) self.movePaddleTo(p.x);
      });
      this.input.on("pointerup", function () { self.dragActive = false; });

      this.input.keyboard.on("keydown-SPACE", function () {
        if (!self.alive) return;
        if (self.serving || self.hasStuckBall()) self.launchBalls();
        else self.fireLasers();
      });
    }

    movePaddleTo(x) {
      var half = this.paddle.displayWidth / 2;
      this.paddle.x = Phaser.Math.Clamp(x, half + 4, W - half - 4);
      this.pinPaddle();
      this.syncStuckBalls();
    }

    pinPaddle() {
      if (!this.paddle || !this.paddle.body) return;
      this.paddle.y = this.paddleY;
      this.paddle.setVelocity(0, 0);
      this.paddle.body.moves = false;
      this.paddle.body.enable = true;
      // 勿每幀 body.reset：會打亂當幀球／板碰撞分離，造成「接住卻往下掉」
      this.paddle.body.x = this.paddle.x - this.paddle.body.halfWidth;
      this.paddle.body.y = this.paddle.y - this.paddle.body.halfHeight;
    }

    buildLevel() {
      this.bricks.clear(true, true);
      this.voidMovers = [];
      var rows = this.diff.rows + Math.min(2, Math.floor((this.level - 1) / 2));
      var cols = this.diff.cols;
      var marginX = 28;
      var bw = (W - marginX * 2) / cols - 4;
      var bh = 22;
      var startY = 58;
      var pattern = (this.level - 1) % 4;

      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          // 關卡編排：避免大面積空洞，保留可讀形狀
          if (pattern === 1 && (r + c) % 2 === 0 && r > 0 && r < rows - 1) continue;
          if (pattern === 2 && c > 1 && c < cols - 2 && r === Math.floor(rows / 2)) continue;
          if (pattern === 3 && Math.abs(c - (cols - 1) / 2) < 1.2 && r < 2) continue;

          var kind = "normal";
          var roll = Math.random();
          if (roll < this.diff.voidRate) kind = "void";
          else if (roll < this.diff.voidRate + this.diff.steelRate) kind = "steel";
          else if (roll < this.diff.voidRate + this.diff.steelRate + this.diff.explodeRate) kind = "explode";

          var colorIdx = r % BRICK_COLORS.length;
          var key = "brick-" + colorIdx;
          var hp = 1;
          var tintColor = BRICK_COLORS[colorIdx];
          if (kind === "void") {
            key = "brick-void";
            hp = 2;
            tintColor = 0xa78bfa;
          } else if (kind === "steel") {
            key = "brick-steel";
            hp = 3;
            tintColor = 0xcbd5e1;
          } else if (kind === "explode") {
            key = "brick-explode";
            hp = 1;
            tintColor = 0xf97316;
          }

          var x = marginX + c * (bw + 4) + bw / 2 + 2;
          var y = startY + r * (bh + 6) + bh / 2;
          var brick = this.bricks.create(x, y, key);
          brick.setDisplaySize(bw, bh);
          brick.refreshBody();
          brick.setData("colorIdx", colorIdx);
          brick.setData("kind", kind);
          brick.setData("isVoid", kind === "void");
          brick.setData("isSteel", kind === "steel");
          brick.setData("isExplode", kind === "explode");
          brick.setData("hp", hp);
          brick.setData("maxHp", hp);
          brick.setData("tintColor", tintColor);
          brick.setData("gridR", r);
          brick.setData("gridC", c);
          brick.setDepth(8);
          if (kind === "void") {
            brick.setData("baseX", x);
            brick.setData("phase", Math.random() * Math.PI * 2);
            brick.setData("amp", Phaser.Math.Between(24, 48));
            brick.setData("spd", Phaser.Math.FloatBetween(1.1, 2.0));
            this.voidMovers.push(brick);
          }
        }
      }
    }

    spawnBall(stuck) {
      var ball = this.balls.create(this.paddle.x, this.paddleY - 18, "ball");
      ball.setCircle(7);
      ball.setBounce(1);
      ball.setCollideWorldBounds(true);
      ball.body.onWorldBounds = true;
      ball.setDepth(20);
      ball.setTint(0xffffff);
      ball.setBlendMode(Phaser.BlendModes.ADD);
      ball.setData("stuck", !!stuck);
      ball.setData("speed", this.diff.ballSpeed);
      ball.body.allowGravity = false;
      if (stuck) {
        // 關掉物理，避免卡在底板上被碰撞分離「彈飛／掉出」後球消失
        ball.body.setVelocity(0, 0);
        ball.body.enable = false;
        ball.x = this.paddle.x;
        ball.y = this.paddleY - 18;
      } else {
        ball.body.enable = true;
      }
      return ball;
    }

    ensureServeBall() {
      var count = 0;
      this.balls.getChildren().forEach(function (b) {
        if (b.active) count++;
      });
      if (count === 0) {
        this.serving = true;
        this.spawnBall(true);
        if (this.hudHint) this.hudHint.setText("點擊／空白 發射");
      }
    }

    hasStuckBall() {
      var stuck = false;
      this.balls.getChildren().forEach(function (b) {
        if (b.active && b.getData("stuck")) stuck = true;
      });
      return stuck;
    }

    syncStuckBalls() {
      var self = this;
      this.balls.getChildren().forEach(function (b) {
        if (!b.active || !b.getData("stuck")) return;
        b.body.enable = false;
        b.body.setVelocity(0, 0);
        b.x = self.paddle.x;
        b.y = self.paddleY - 18;
        if (b.body) b.body.reset(b.x, b.y);
        b.body.enable = false;
      });
    }

    launchBalls() {
      var launched = false;
      var self = this;
      var baseSpeed = Math.max(180, this.diff.ballSpeed * Math.max(1, this.dangerMultiplier * 0.85));
      this.balls.getChildren().forEach(function (b) {
        if (!b.active || !b.getData("stuck")) return;
        b.setData("stuck", false);
        b.body.enable = true;
        b.x = self.paddle.x;
        b.y = self.paddleY - 18;
        b.body.reset(b.x, b.y);
        var angle = Phaser.Math.FloatBetween(-0.5, 0.5);
        var spd = baseSpeed;
        b.setData("speed", spd);
        b.body.setVelocity(Math.sin(angle) * spd, -Math.cos(angle) * spd);
        launched = true;
      });
      if (launched) {
        this.serving = false;
        this.hudHint.setText("");
        SFX.launch();
      } else if (this.serving) {
        // 發球狀態卻沒有黏球 → 補一顆再發
        this.spawnBall(true);
        this.launchBalls();
      }
    }

    applyBallSpeed(ball) {
      var body = ball.body;
      if (!body || !ball.active || ball.getData("stuck")) return;
      var base = ball.getData("speed") || this.diff.ballSpeed;
      var spd = Math.min(base * (0.85 + this.dangerMultiplier * 0.15), this.diff.ballSpeed * 2.4);
      if (body.velocity.x === 0 && body.velocity.y === 0) return;
      var ang = Math.atan2(body.velocity.y, body.velocity.x);
      var vx = Math.cos(ang) * spd;
      var vy = Math.sin(ang) * spd;
      // 避免近水平角：保留原本上下方向，絕不無故改成往下
      if (Math.abs(vy) < spd * 0.28) {
        var dirY = vy > 0.01 ? 1 : (vy < -0.01 ? -1 : (ball.y > this.paddleY - 40 ? -1 : (vy >= 0 ? 1 : -1)));
        // 靠近底板時強制向上，防止「擦到板卻往下掉」
        if (ball.y >= this.paddleY - 40) dirY = -1;
        vy = dirY * spd * 0.4;
        vx = (vx >= 0 ? 1 : -1) * Math.sqrt(Math.max(0, spd * spd - vy * vy));
      }
      body.setVelocity(vx, vy);
    }

    bounceOffPaddle(ball, paddle) {
      if (!ball || !ball.active || !ball.body || ball.getData("stuck")) return;
      var offset = (ball.x - paddle.x) / Math.max(8, paddle.displayWidth / 2);
      offset = Phaser.Math.Clamp(offset, -1, 1);
      var angle = offset * 1.15;
      var spd = (ball.getData("speed") || this.diff.ballSpeed) * (0.9 + this.dangerMultiplier * 0.12);
      spd = Math.min(spd * 1.02, this.diff.ballSpeed * 2.2);
      ball.setData("speed", spd);
      // 強制放在板上方再給向上速度，避免卡在板內被擠下去
      var liftY = this.paddleY - 14;
      ball.y = Math.min(ball.y, liftY);
      ball.body.reset(ball.x, liftY);
      ball.body.setVelocity(Math.sin(angle) * spd, -Math.abs(Math.cos(angle) * spd));
    }

    onBallPaddle(ball, paddle) {
      if (ball.getData("stuck")) return;

      if (this.magnetOn) {
        ball.setData("stuck", true);
        ball.body.setVelocity(0, 0);
        ball.body.enable = false;
        ball.x = paddle.x;
        ball.y = this.paddleY - 18;
        ball.body.reset(ball.x, ball.y);
        ball.body.enable = false;
        this.hudHint.setText("磁力吸附 · 點擊／空白 重新發射");
        SFX.power();
        return;
      }

      this.bounceOffPaddle(ball, paddle);

      this.bounces++;
      this.dangerMultiplier = 1 + Math.log(1 + this.elapsedTime / 30) * 0.8 + Math.log(1 + this.bounces / 24) * 0.2;
      ball.setData("paddleGrace", 0.12);

      this.tweens.killTweensOf(paddle);
      paddle.setAlpha(0.55);
      this.tweens.add({
        targets: paddle,
        alpha: 1,
        duration: 140,
        ease: "Cubic.easeOut"
      });

      SFX.paddle();
      neonBurst(this, ball.x, ball.y, 0x22d3ee, 12);
    }

    onBallBrick(ball, brick) {
      this.hitBrick(brick, false);
      this.bounces++;
      this.dangerMultiplier = 1 + Math.log(1 + this.elapsedTime / 30) * 0.8 + Math.log(1 + this.bounces / 24) * 0.2;
      this.applyBallSpeed(ball);
    }

    onLaserBrick(laser, brick) {
      if (!laser.active) return;
      laser.destroy();
      this.hitBrick(brick, true);
    }

    hitBrick(brick, fromLaser) {
      if (!brick.active || brick.getData("breaking")) return;
      var hp = brick.getData("hp") || 1;
      hp -= 1;
      brick.setData("hp", hp);

      if (hp > 0) {
        SFX.hit();
        doShake(this.cameras.main, 60, 0.006);
        var maxHp = brick.getData("maxHp") || 1;
        brick.setAlpha(0.45 + 0.55 * (hp / maxHp));
        this.tweens.add({
          targets: brick, scaleX: 1.1, scaleY: 0.9, duration: 70, yoyo: true, ease: "Cubic.easeOut",
          onComplete: function () {
            brick.setScale(1);
          }
        });
        return;
      }

      brick.setData("breaking", true);
      this.combo++;
      this.comboTimer = 2.8;
      var tint = brick.getData("tintColor") || 0x22d3ee;
      var kindBonus = brick.getData("isSteel") ? 1.6 : (brick.getData("isExplode") ? 1.35 : (brick.getData("isVoid") ? 1.25 : 1));
      var pts = Math.floor(25 * (1 + this.combo * 0.2) * kindBonus * this.diff.scoreMult * (0.85 + this.dangerMultiplier * 0.2));
      this.score += pts;

      doShake(this.cameras.main, 100, 0.012);
      SFX.break(this.combo);
      neonBurst(this, brick.x, brick.y, tint, brick.getData("isExplode") ? 26 : 20);

      var floater = this.add.text(brick.x, brick.y, "+" + pts, {
        fontFamily: "Segoe UI, sans-serif", fontSize: "16px", fontStyle: "bold",
        color: brick.getData("isExplode") ? "#fb923c" : BRICK_CSS[brick.getData("colorIdx") || 0]
      }).setOrigin(0.5).setDepth(35);
      this.tweens.add({
        targets: floater, y: brick.y - 40, alpha: 0, scale: 1.2, duration: 420, ease: "Cubic.easeOut",
        onComplete: function () { floater.destroy(); }
      });

      var self = this;
      var dropPower = Math.random() < this.diff.powerRate;
      var px = brick.x, py = brick.y;
      var shouldExplode = !!brick.getData("isExplode");
      var gridR = brick.getData("gridR");
      var gridC = brick.getData("gridC");

      this.tweens.add({
        targets: brick,
        scaleX: 1.25,
        scaleY: 1.25,
        duration: 70,
        ease: "Back.easeOut",
        onComplete: function () {
          self.tweens.add({
            targets: brick,
            scaleX: 0.1,
            scaleY: 0.1,
            alpha: 0,
            duration: 100,
            ease: "Cubic.easeIn",
            onComplete: function () {
              if (brick.getData("isVoid")) {
                var idx = self.voidMovers.indexOf(brick);
                if (idx >= 0) self.voidMovers.splice(idx, 1);
              }
              brick.destroy();
              if (shouldExplode) self.triggerExplosion(px, py, gridR, gridC);
              if (dropPower) self.spawnPowerup(px, py);
              self.checkLevelClear();
            }
          });
        }
      });
    }

    triggerExplosion(x, y, _r, _c) {
      var self = this;
      neonBurst(this, x, y, 0xf97316, 28);
      neonBurst(this, x, y, 0xfbbf24, 18);
      doShake(this.cameras.main, 140, 0.02);
      SFX.break(8);
      this.bricks.getChildren().forEach(function (other) {
        if (!other.active || other.getData("breaking")) return;
        var dx = other.x - x;
        var dy = other.y - y;
        if (dx * dx + dy * dy <= 78 * 78) {
          self.hitBrick(other, true);
        }
      });
    }

    spawnPowerup(x, y) {
      var types = ["multi", "laser", "magnet", "wide"];
      var type = types[Phaser.Math.Between(0, types.length - 1)];
      var key = "pow-" + type;
      var p = this.powerups.create(x, y, key);
      p.setData("type", type);
      p.setVelocity(0, 120);
      p.setDepth(12);
      p.body.allowGravity = false;
      this.tweens.add({
        targets: p, scale: 1.15, duration: 350, yoyo: true, repeat: -1, ease: "Sine.easeInOut"
      });
    }

    onPowerCollect(paddle, power) {
      if (!power.active) return;
      var type = power.getData("type");
      power.destroy();
      SFX.power();
      doShake(this.cameras.main, 80, 0.008);
      neonBurst(this, paddle.x, paddle.y, 0xfbbf24, 16);

      if (type === "multi") this.activateMultiBall();
      else if (type === "laser") {
        this.laserOn = true;
        this.laserTimer = 10;
      } else if (type === "magnet") {
        this.magnetOn = true;
        this.magnetTimer = 8;
      } else if (type === "wide") {
        this.wideTimer = 12;
        this.applyPaddleWidth(this.basePaddleW * 1.5);
      }
    }

    applyPaddleWidth(w) {
      this.paddle.setDisplaySize(w, 16);
      this.paddle.body.setSize(w, 22);
      this.paddle.body.setOffset(
        (this.paddle.width - w) / 2,
        (this.paddle.height - 22) / 2
      );
      this.movePaddleTo(this.paddle.x);
    }

    activateMultiBall() {
      var src = null;
      this.balls.getChildren().forEach(function (b) {
        if (b.active && !b.getData("stuck")) src = b;
      });
      if (!src) {
        this.balls.getChildren().forEach(function (b) {
          if (b.active) src = b;
        });
      }
      if (!src) return;

      var base = src.getData("speed") || this.diff.ballSpeed;
      var sx = src.x;
      var sy = src.y;
      // 共 3 顆：原球保留，再分裂 2 顆
      for (var i = 0; i < 2; i++) {
        var nb = this.balls.create(sx, sy, "ball");
        nb.setCircle(7);
        nb.setBounce(1);
        nb.setCollideWorldBounds(true);
        nb.setDepth(20);
        nb.setBlendMode(Phaser.BlendModes.ADD);
        nb.setData("stuck", false);
        nb.setData("speed", base);
        var ang = -Math.PI / 2 + (i === 0 ? -0.5 : 0.5);
        nb.body.setVelocity(Math.cos(ang) * base, Math.sin(ang) * base);
      }
      if (src.getData("stuck")) {
        src.setData("stuck", false);
        src.body.setVelocity(0, -base);
      }
    }

    fireLasers() {
      if (!this.laserOn || this.laserCd > 0 || this.serving) return;
      this.laserCd = 0.22;
      SFX.laser();
      var offsets = [-this.paddle.displayWidth * 0.38, this.paddle.displayWidth * 0.38];
      for (var i = 0; i < offsets.length; i++) {
        var lx = this.paddle.x + offsets[i];
        var beam = this.lasers.create(lx, this.paddle.y - 20, "laser-beam");
        beam.setVelocity(0, -520);
        beam.setDepth(18);
        beam.body.allowGravity = false;
        beam.setBlendMode(Phaser.BlendModes.ADD);
      }
    }

    checkLevelClear() {
      if (this.bricks.countActive(true) > 0) return;
      this.score += Math.floor(500 * this.diff.scoreMult * this.dangerMultiplier);
      SFX.power();
      doShake(this.cameras.main, 150, 0.018);
      neonBurst(this, W / 2, H / 3, 0xfbbf24, 28);
      this.level++;
      this.bounces = Math.floor(this.bounces * 0.4);
      this.buildLevel();
      // reset to serve
      this.balls.clear(true, true);
      this.serving = true;
      this.spawnBall(true);
      this.hudHint.setText("關卡 " + this.level + " · 點擊發射");
    }

    loseLife() {
      if (!this.alive || this._lifeLock) return;
      this._lifeLock = true;
      this.lives--;
      this.combo = 0;
      this.balls.clear(true, true);
      this.lasers.clear(true, true);

      if (this.lives <= 0) {
        this._lifeLock = false;
        this.die();
        return;
      }

      SFX.hit();
      doShake(this.cameras.main, 120, 0.015);
      this.serving = true;
      this.wideTimer = 0;
      this.applyPaddleWidth(this.basePaddleW);
      this.spawnBall(true);
      this.syncStuckBalls();
      this.hudHint.setText("生命 -1 · 點擊發射");
      var self = this;
      this.time.delayedCall(80, function () { self._lifeLock = false; });
    }

    die() {
      if (!this.alive) return;
      this.alive = false;
      SFX.die();

      // white flash
      this.flash.setAlpha(0.9);
      this.tweens.add({ targets: this.flash, alpha: 0, duration: 450, ease: "Cubic.easeOut" });
      doShake(this.cameras.main, 280, 0.03);

      // paddle shatter
      neonBurst(this, this.paddle.x, this.paddle.y, 0x22d3ee, 24);
      neonBurst(this, this.paddle.x, this.paddle.y, 0xa78bfa, 18);
      this.tweens.add({
        targets: this.paddle,
        scaleX: 1.6,
        scaleY: 0.2,
        alpha: 0,
        angle: Phaser.Math.Between(-20, 20),
        duration: 380,
        ease: "Cubic.easeIn"
      });

      var finalScore = Math.floor(this.score);
      var meta = {
        slug: "void-brick-breaker",
        difficulty: this.diff.id,
        level: this.level,
        bounces: this.bounces,
        dangerPeak: Number(this.dangerMultiplier.toFixed(2))
      };
      try {
        if (window.RNFPhaserLeaderboard && RNFPhaserLeaderboard.submitRun) {
          RNFPhaserLeaderboard.submitRun(finalScore, meta);
        } else if (typeof RNF !== "undefined" && RNF.submitScore) {
          RNF.submitScore(finalScore, meta);
        }
      } catch (_e) {}

      var self = this;
      this.time.delayedCall(500, function () {
        self.scene.launch("GameOverModal", {
          score: finalScore,
          level: self.level,
          bounces: self.bounces,
          danger: self.dangerMultiplier,
          combo: self.combo,
          diff: self.diff
        });
      });
    }

    update(_t, delta) {
      if (!this.alive) return;
      var dt = Math.min(0.05, delta / 1000);
      this.elapsedTime += dt;
      this.dangerMultiplier = 1 + Math.log(1 + this.elapsedTime / 30) * 0.8 + Math.log(1 + this.bounces / 24) * 0.2;

      // 每幀釘住底板高度，防止被球／道具物理推飛
      this.pinPaddle();

      // keyboard paddle
      var speed = 520;
      if (this.cursors.left.isDown || this.keys.A.isDown) {
        this.movePaddleTo(this.paddle.x - speed * dt);
      } else if (this.cursors.right.isDown || this.keys.D.isDown) {
        this.movePaddleTo(this.paddle.x + speed * dt);
      }

      if (this.serving || this.hasStuckBall()) this.syncStuckBalls();

      this.comboTimer = Math.max(0, this.comboTimer - dt);
      if (this.comboTimer <= 0) this.combo = 0;

      this.laserCd = Math.max(0, this.laserCd - dt);
      if (this.laserOn) {
        this.laserTimer -= dt;
        if (this.laserTimer <= 0) this.laserOn = false;
      }
      if (this.magnetOn) {
        this.magnetTimer -= dt;
        if (this.magnetTimer <= 0) this.magnetOn = false;
      }
      if (this.wideTimer > 0) {
        this.wideTimer -= dt;
        if (this.wideTimer <= 0) {
          this.wideTimer = 0;
          this.applyPaddleWidth(this.basePaddleW);
        }
      }

      // moving void bricks
      for (var i = 0; i < this.voidMovers.length; i++) {
        var vb = this.voidMovers[i];
        if (!vb.active) continue;
        var phase = vb.getData("phase") + dt * vb.getData("spd");
        vb.setData("phase", phase);
        var nx = vb.getData("baseX") + Math.sin(phase) * vb.getData("amp");
        vb.x = nx;
        vb.refreshBody();
      }

      // balls fell below + 接球保險
      var living = 0;
      var self = this;
      var halfPad = this.paddle.displayWidth / 2 + 6;
      this.balls.getChildren().forEach(function (b) {
        if (!b.active) return;
        if (b.getData("stuck")) {
          b.x = self.paddle.x;
          b.y = self.paddleY - 18;
          living++;
          return;
        }

        var grace = b.getData("paddleGrace") || 0;
        if (grace > 0) b.setData("paddleGrace", Math.max(0, grace - dt));

        // 手動接球判定：球在板上方附近且往下走／擦到板 → 強制彈起
        // （補物理穿模／分離方向錯誤）
        if (grace <= 0 && b.body && b.body.enable) {
          var nearX = Math.abs(b.x - self.paddle.x) <= halfPad;
          var nearY = b.y >= self.paddleY - 28 && b.y <= self.paddleY + 10;
          var goingDown = b.body.velocity.y >= -20;
          if (nearX && nearY && goingDown) {
            self.bounceOffPaddle(b, self.paddle);
            b.setData("paddleGrace", 0.12);
            self.bounces++;
            SFX.paddle();
            neonBurst(self, b.x, b.y, 0x22d3ee, 10);
          }
        }

        // 剛彈起後若仍卡在板下方，拉回上方
        if ((b.getData("paddleGrace") || 0) > 0 && b.y > self.paddleY - 8) {
          b.y = self.paddleY - 14;
          if (b.body) {
            b.body.reset(b.x, b.y);
            if (b.body.velocity.y > 0) b.body.velocity.y = -Math.abs(b.body.velocity.y);
          }
        }

        if (b.y > H + 20) {
          b.destroy();
          return;
        }
        living++;
        // 只做速度正規化，不要每幀亂改方向（舊邏輯會把擦板球逼往下）
        if ((b.getData("paddleGrace") || 0) <= 0) {
          var body = b.body;
          if (body && (body.velocity.x !== 0 || body.velocity.y !== 0)) {
            var base = b.getData("speed") || self.diff.ballSpeed;
            var spd = Math.min(base * (0.85 + self.dangerMultiplier * 0.15), self.diff.ballSpeed * 2.4);
            var cur = Math.sqrt(body.velocity.x * body.velocity.x + body.velocity.y * body.velocity.y) || 1;
            body.setVelocity(body.velocity.x / cur * spd, body.velocity.y / cur * spd);
          }
        }
      });

      if (living === 0) {
        if (this.serving) {
          this.ensureServeBall();
        } else {
          this.loseLife();
        }
      }

      // cleanup lasers / powerups offscreen
      this.lasers.getChildren().forEach(function (l) {
        if (l.active && l.y < -30) l.destroy();
      });
      this.powerups.getChildren().forEach(function (p) {
        if (p.active && p.y > H + 30) p.destroy();
      });

      // HUD
      this.hudScore.setText("SCORE " + this.score.toLocaleString());
      this.hudDanger.setText("DANGER: x" + this.dangerMultiplier.toFixed(2));
      this.hudLives.setText("❤ " + this.lives);
      this.hudCombo.setText(this.combo > 0 ? "COMBO x" + this.combo : "COMBO —");
      var powers = [];
      if (this.laserOn) powers.push("雷射 " + Math.ceil(this.laserTimer) + "s");
      if (this.magnetOn) powers.push("磁力 " + Math.ceil(this.magnetTimer) + "s");
      if (this.wideTimer > 0) powers.push("加寬 " + Math.ceil(this.wideTimer) + "s");
      this.hudPower.setText(powers.join(" · "));
      this.paddle.setTint(this.laserOn ? 0xfbbf24 : (this.magnetOn ? 0xa78bfa : (this.wideTimer > 0 ? 0x67e8f9 : 0xffffff)));
    }
  }

  /* ═══════════════ Game Over ═══════════════ */

  /* ═══════════════ LeaderboardScene（本遊戲獨立排行榜） ═══════════════ */
  var LeaderboardScene = (window.RNFPhaserLeaderboard && RNFPhaserLeaderboard.createLeaderboardScene)
    ? RNFPhaserLeaderboard.createLeaderboardScene({
        Phaser: Phaser,
        makeButton: makeButton,
        W: W,
        H: H,
        accent: 0x22d3ee,
        returnScene: "MainMenuScene",
        getDefaultDiff: function () {
          return (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard";
        }
      })
    : class LeaderboardSceneMissing extends Phaser.Scene {
        constructor() { super("LeaderboardScene"); }
        create() {
          this.add.text(W / 2, H / 2, "排行榜模組未載入", {
            fontFamily: "Microsoft JhengHei, Segoe UI", fontSize: "18px", color: "#f472b6"
          }).setOrigin(0.5);
        }
      };

  class GameOverModal extends Phaser.Scene {
    constructor() { super("GameOverModal"); }
    init(data) { this.payload = data || {}; }

    create() {
      var score = this.payload.score || 0;
      var diff = this.payload.diff || DIFF.standard;

      this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.72).setInteractive().setDepth(70);
      var panel = this.add.rectangle(W / 2, H / 2, 480, 500, 0x0b1220, 0.97)
        .setStrokeStyle(2, 0x22d3ee, 0.95).setScale(0.7).setAlpha(0).setDepth(71);

      var badge = this.add.text(W / 2, H / 2 - 168, "GAME OVER", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", fontStyle: "bold",
        color: "#22d3ee", letterSpacing: 3
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      var title = this.add.text(W / 2, H / 2 - 128, "霓虹結算", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "30px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      var scoreTxt = this.add.text(W / 2, H / 2 - 48, score.toLocaleString(), {
        fontFamily: "Segoe UI, sans-serif", fontSize: "54px", fontStyle: "bold", color: "#67e8f9"
      }).setOrigin(0.5).setScale(0.4).setAlpha(0).setDepth(72);

      var meta = this.add.text(W / 2, H / 2 + 30,
        diff.label +
        "\n關卡 " + (this.payload.level || 1) +
        " · 反彈 " + (this.payload.bounces || 0) +
        " · DANGER x" + Number(this.payload.danger || 1).toFixed(2) +
        "\n已執行 RNF.submitScore → 排行榜", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "13px", color: "#94a3b8", align: "center", lineSpacing: 6
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 380, ease: "Back.easeOut" });
      this.tweens.add({ targets: [badge, title, meta], alpha: 1, duration: 300, ease: "Cubic.easeOut", delay: 80 });
      this.tweens.add({ targets: scoreTxt, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 100 });

      neonBurst(this, W / 2, H / 2 - 40, 0x22d3ee, 22);

      var self = this;
      var retry = makeButton(this, W / 2 - 110, H / 2 + 95, "再試一次", 0x22d3ee, function () {
        SFX.confirm();
        self.scene.stop("GameOverModal");
        self.scene.stop("GameScene");
        self.scene.start("GameScene", { difficulty: selectedDiff });
      }, 180);
      retry.bg.setDepth(73); retry.txt.setDepth(74);

      var settings = makeButton(this, W / 2 + 110, H / 2 + 95, "排行榜", 0x34d399, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        try { self.scene.stop("SettingsScene"); } catch (_e) {}
        self.scene.stop("GameScene");
        self.scene.start("LeaderboardScene", { difficulty: (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard" });
      }, 180);
      settings.bg.setDepth(73); settings.txt.setDepth(74);
      var menu = makeButton(this, W / 2, H / 2 + 155, "主選單", 0x64748b, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        self.scene.stop("SettingsScene");
        self.scene.stop("GameScene");
        self.scene.start("MainMenuScene");
      }, 200);
    }
  }

  var config = {
    type: Phaser.AUTO,
    parent: "game-host",
    width: W,
    height: H,
    backgroundColor: "#04060c",
    banner: false,
    physics: {
      default: "arcade",
      arcade: { gravity: { y: 0 }, debug: false }
    },

    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    fps: { target: 144, forceSet: false, smoothStep: true },
    scene: [BootScene, MainMenuScene, DifficultyScene, GameScene, GameOverModal, LeaderboardScene, SettingsScene]
  };

  try {
    window.__VOID_BRICK__ = new Phaser.Game(config);
  } catch (_e) {
    config.type = Phaser.AUTO;
    window.__VOID_BRICK__ = new Phaser.Game(config);
  }
  window.__RNF_ARCADE_GAME__ = window.__VOID_BRICK__;
  if (typeof RNF !== "undefined" && RNF.setShowMenuHandler) {
    RNF.setShowMenuHandler(function () {
      try {
        var g = window.__RNF_ARCADE_GAME__ || window.__VOID_BRICK__;
        if (!g || !g.scene) return;
        ["GameOverModal", "SettingsScene", "LeaderboardScene", "DifficultyScene", "GameScene"].forEach(function (key) {
          try { if (g.scene.getScene(key)) g.scene.stop(key); } catch (_s) {}
        });
        g.scene.start("MainMenuScene");
      } catch (_err) {}
    });
  }
})();
</script>
</body>
</html>
