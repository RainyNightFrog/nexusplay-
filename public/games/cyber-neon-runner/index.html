  var selectedDiff = "standard";

  function loadSettings() {
    var base = { sfx: true, shake: true };
    try {
      if (typeof RNF !== "undefined" && RNF.getSettings) {
        var s = RNF.getSettings();
        base.sfx = (s.sfxVolume == null ? 0.75 : s.sfxVolume) > 0.02;
        base.shake = s.screenShake !== false;
      }
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) Object.assign(base, JSON.parse(raw));
    } catch (_e) {}
    return base;
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameSettings));
      if (typeof RNF !== "undefined" && RNF.setSettings) {
        RNF.setSettings({
          sfxVolume: gameSettings.sfx ? 0.75 : 0,
          screenShake: !!gameSettings.shake
        });
      }
    } catch (_e) {}
  }

  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
    function rnfGameVolMul() {
    try {
      if (typeof RNF !== "undefined" && RNF.getGameVolume) return RNF.getGameVolume();
      if (typeof window !== "undefined" && typeof window.__RNF_GAME_VOLUME__ === "number") return window.__RNF_GAME_VOLUME__;
    } catch (_e) {}
    return 1;
  }
  function tone(freq, dur, type, vol, slide) {
    if (!gameSettings.sfx || rnfGameVolMul() <= 0) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime((vol || 0.1) * rnfGameVolMul(), t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  var SFX = {
    click: function () { tone(520, 0.05, "triangle", 0.07); },
    confirm: function () { tone(660, 0.07, "square", 0.09); tone(990, 0.08, "triangle", 0.07); },
    jump: function () { tone(280, 0.09, "sawtooth", 0.08, 620); },
    land: function () { tone(160, 0.05, "triangle", 0.06); },
    slide: function () { tone(200, 0.08, "sawtooth", 0.05, 90); },
    shoot: function () { tone(720, 0.05, "sawtooth", 0.07, 1200); },
    shatter: function () { tone(140, 0.16, "sawtooth", 0.13, 50); tone(380, 0.08, "square", 0.08); },
    shield: function () {
      tone(220, 0.08, "sawtooth", 0.1); tone(440, 0.1, "square", 0.12); tone(880, 0.12, "sine", 0.09);

    die: function () { tone(120, 0.32, "sawtooth", 0.16, 40); },

      var f = 880 + Math.min(n || 0, 10) * 40;
      tone(f, 0.05, "triangle", 0.08); tone(f * 1.5, 0.06, "sine", 0.06);

      tone(740, 0.05, "square", 0.1); tone(1100, 0.08, "triangle", 0.1); tone(1600, 0.1, "sine", 0.07);

  function doShake(cam, dur, intens) {
    if (!gameSettings.shake || !cam) return;
    cam.shake(dur, intens);
  }

  function neonBurst(scene, x, y, tint, count) {
    var n = Phaser.Math.Clamp(count || 20, 15, 40);
    var emitter = scene.add.particles(x, y, "spark", {
      speed: { min: 90, max: 420 },
      angle: { min: 0, max: 360 },
      lifespan: { min: 260, max: 720 },
      scale: { start: 1.35, end: 0 },
      alpha: { start: 1, end: 0 },
      gravityY: 60,
      blendMode: "ADD",
      tint: tint,
      emitting: false
    });
    emitter.explode(n);
    scene.time.delayedCall(900, function () { if (emitter.destroy) emitter.destroy(); });
  }

  function dualBurst(scene, x, y, c1, c2, n) {
    neonBurst(scene, x, y, c1, n || 22);
    neonBurst(scene, x, y, c2, Math.floor((n || 22) * 0.7));
  }

  function shockwave(scene, x, y, color, maxR) {
    var ring = scene.add.circle(x, y, 10, color, 0)
      .setStrokeStyle(4, color, 1).setDepth(44).setBlendMode(Phaser.BlendModes.ADD);
    scene.tweens.add({
      targets: ring, scale: (maxR || 90) / 10, alpha: 0, duration: 360, ease: "Cubic.easeOut",
      onComplete: function () { ring.destroy(); }
    });
  }

  function floatText(scene, x, y, msg, color, size) {
    var floater = scene.add.text(x, y, msg, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: (size || 15) + "px", fontStyle: "bold", color: color || "#fbbf24",
      stroke: "#020617", strokeThickness: 3
    }).setOrigin(0.5).setDepth(48).setScale(0.6).setAlpha(0);
    scene.tweens.add({ targets: floater, y: y - 48, alpha: 1, scale: 1.15, duration: 220, ease: "Back.easeOut" });
    scene.tweens.add({
      targets: floater, y: y - 86, alpha: 0, duration: 400, delay: 220, ease: "Cubic.easeOut",
      onComplete: function () { floater.destroy(); }
    });
  }

  function powerBanner(scene, title, sub, colorHex) {
    var wrap = scene.add.container(W / 2, H * 0.24).setDepth(55).setAlpha(0).setScale(0.4);
    var col = Phaser.Display.Color.HexStringToColor(colorHex).color;
    var glow = scene.add.rectangle(0, 0, 460, 72, col, 0.16);
    var bar = scene.add.rectangle(0, 0, 440, 64, 0x020617, 0.9).setStrokeStyle(3, col, 1);
    var t1 = scene.add.text(0, -8, title, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "24px", fontStyle: "bold", color: "#ffffff", stroke: "#020617", strokeThickness: 4
    }).setOrigin(0.5);
    var t2 = scene.add.text(0, 16, sub, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "13px", fontStyle: "bold", color: colorHex
    }).setOrigin(0.5);
    wrap.add([glow, bar, t1, t2]);
    scene.tweens.add({ targets: wrap, alpha: 1, scale: 1, duration: 280, ease: "Back.easeOut" });
    scene.tweens.add({
      targets: wrap, alpha: 0, y: H * 0.18, scale: 1.08, duration: 420, delay: 700, ease: "Cubic.easeIn",

    });

  function screenPunch(scene, color, alpha) {
    var flash = scene.add.rectangle(W / 2, H / 2, W, H, color, alpha || 0.35).setDepth(58);
    scene.tweens.add({
      targets: flash, alpha: 0, duration: 280, ease: "Cubic.easeOut",
      onComplete: function () { flash.destroy(); }
    });
    doShake(scene.cameras.main, 120, 0.014);
  }

  function pulseBtn(scene, targets) {
    scene.tweens.add({
      targets: targets, scale: 1.08, duration: 90, yoyo: true, ease: "Back.easeOut"
    });
  }

  function makeButton(scene, x, y, label, color, onClick, width) {
    var bw = width || 300;
    var bg = scene.add.rectangle(x, y, bw, 44, color, 0.2)
      .setStrokeStyle(2, color, 0.9)
      .setInteractive({ useHandCursor: true });
    var txt = scene.add.text(x, y, label, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "18px", fontStyle: "bold", color: "#e2e8f0"
    }).setOrigin(0.5);
    bg.on("pointerover", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1.05, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerout", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerdown", function () {
      pulseBtn(scene, [bg, txt]);
      SFX.click();
      onClick();
    });
    return { bg: bg, txt: txt };
  }

  /* ═══════════════ BootScene ═══════════════ */
  class BootScene extends Phaser.Scene {
    constructor() { super("BootScene"); }
    create() {
      makeTextures(this);
      this.cameras.main.setBackgroundColor("#04060c");
      this.cameras.main.fadeIn(320, 4, 6, 12);
      var t = this.add.text(W / 2, H / 2 - 8, "CYBER NEON RUNNER", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "28px", fontStyle: "bold", color: "#22d3ee"
      }).setOrigin(0.5).setAlpha(0);
      this.add.text(W / 2, H / 2 + 28, "障礙清晰化 · 獎勵強化 · build runnerJuice11", {
        fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif", fontSize: "13px", color: "#fbbf24"
      }).setOrigin(0.5);
      this.tweens.add({ targets: t, alpha: 1, scale: 1.04, duration: 400, ease: "Back.easeOut" });
      this.time.delayedCall(520, function () { this.scene.start("MainMenuScene"); }, [], this);
    }
  }

  /* ═══════════════ MainMenuScene ═══════════════ */
  class MainMenuScene extends Phaser.Scene {
    constructor() { super("MainMenuScene"); }
    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(200, 4, 6, 12);

      for (var i = 0; i < 5; i++) {
        var b = this.add.image(120 + i * 180, H - 40, "bldg").setOrigin(0.5, 1).setAlpha(0.45).setTint(0x334155);
        this.tweens.add({

  /* ═══════════════ GameScene ═══════════════ */
  class GameScene extends Phaser.Scene {
    constructor() { super("GameScene"); }

    init(data) {
      this.diffKey = (data && data.difficulty) || selectedDiff || "standard";
      this.diff = DIFF[this.diffKey] || DIFF.standard;
      selectedDiff = this.diffKey;
      this.ended = false;
      this.distance = 0;
      this.kills = 0;
      this.score = 0;
      this.elapsed = 0;
      this.dangerMultiplier = this.diff.baseDanger;
      this.scrollSpeed = this.diff.scroll;
      this.spawnAcc = 0;
      this.missileAcc = 0;
      this.ammo = this.diff.ammo;
      this.laserCd = 0;
      this.shield = this.diff.startShield;
      this.sliding = false;
      this.slideTimer = 0;
      this.jumpsLeft = this.diff.airJumps;
      this.coyote = 0;
      this.jumpBuf = 0;
      this.wasGrounded = true;
      this.swipeStart = null;
      this.coinCombo = 0;
      this.coinComboTimer = 0;
      this.bestCombo = 0;
    }

    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#050814");
      this.cameras.main.fadeIn(180, 4, 6, 12);

      this.physics.world.setBounds(0, 0, W, H + 80);
      this.physics.world.gravity.y = 1600;

      this.buildParallax();

      this.ground = this.physics.add.staticGroup();
      var floor = this.add.tileSprite(W / 2, GROUND_Y + 40, W + 40, 80, "ground-tile").setDepth(5);
      this.floorTile = floor;
      var groundBody = this.ground.create(W / 2, GROUND_Y + 40, "ground-tile");
      groundBody.setDisplaySize(W + 80, 80).refreshBody().setVisible(false);

      this.player = this.physics.add.sprite(150, GROUND_Y - 40, "runner");
      this.player.setCollideWorldBounds(true);
      this.player.setDepth(20);
      this.player.setBounce(0);
      this.player.body.setSize(28, 44);
      this.player.body.setOffset(4, 4);
      this.player.setMaxVelocity(0, 900);
      this.standHeight = 44;
      this.slideHeight = 22;

      this.trail = this.add.particles(0, 0, "spark", {
        follow: this.player,
        followOffset: { x: -10, y: 8 },
        speed: { min: 20, max: 80 },
        lifespan: { min: 200, max: 450 },
        scale: { start: 0.9, end: 0 },
        alpha: { start: 0.8, end: 0 },
        blendMode: "ADD",
        frequency: 28,
        tint: [0x22d3ee, 0x67e8f9, 0xffffff]
      }).setDepth(15);

      this.slideSparks = this.add.particles(0, 0, "spark", {
        follow: this.player,
        followOffset: { x: 0, y: 18 },
        speed: { min: 40, max: 140 },
        angle: { min: 160, max: 220 },
        lifespan: 280,
        scale: { start: 0.8, end: 0 },
        alpha: { start: 0.9, end: 0 },
        blendMode: "ADD",
        frequency: 40,
        tint: [0xfbbf24, 0xf472b6],
        emitting: false
      }).setDepth(16);

      this.obstacles = this.physics.add.group({ allowGravity: false, immovable: true });
      this.lasers = this.physics.add.group({ allowGravity: false });
      this.coins = this.physics.add.group({ allowGravity: false });
      this.missiles = this.physics.add.group({ allowGravity: false });

      this.physics.add.collider(this.player, this.ground, this.onLand, null, this);
      this.physics.add.overlap(this.player, this.obstacles, this.onHitObstacle, null, this);
      this.physics.add.overlap(this.player, this.missiles, this.onHitMissile, null, this);
      this.physics.add.overlap(this.lasers, this.obstacles, this.onLaserHit, null, this);
      this.physics.add.overlap(this.lasers, this.missiles, this.onLaserHitMissile, null, this);
      this.physics.add.overlap(this.player, this.coins, this.onPickup, null, this);

      this.shieldRing = this.add.circle(150, GROUND_Y - 40, 34, 0x60a5fa, 0.12)
        .setStrokeStyle(2, 0x93c5fd, 0.9).setDepth(19).setVisible(this.shield > 0)
        .setBlendMode(Phaser.BlendModes.ADD);

      this.cursors = this.input.keyboard.createCursorKeys();
      this.keys = this.input.keyboard.addKeys({
        W: Phaser.Input.Keyboard.KeyCodes.W,
        S: Phaser.Input.Keyboard.KeyCodes.S,
        F: Phaser.Input.Keyboard.KeyCodes.F,
        SPACE: Phaser.Input.Keyboard.KeyCodes.SPACE
      });

      this.input.on("pointerdown", this.onPointerDown, this);
      this.input.on("pointerup", this.onPointerUp, this);

      this.flash = this.add.rectangle(W / 2, H / 2, W, H, 0xff0044, 0).setDepth(50).setScrollFactor(0);

      this.hudDist = this.add.text(24, 18, "DIST 0m", {
        fontFamily: "Consolas, monospace", fontSize: "18px", fontStyle: "bold", color: "#e2e8f0"
      }).setDepth(60).setScrollFactor(0);
      this.hudScore = this.add.text(24, 44, "SCORE 0", {
        fontFamily: "Consolas, monospace", fontSize: "14px", color: "#67e8f9"
      }).setDepth(60).setScrollFactor(0);
      this.hudDanger = this.add.text(W - 24, 18, "DANGER: x" + this.diff.baseDanger.toFixed(2), {
        fontFamily: "Consolas, monospace", fontSize: "14px", fontStyle: "bold", color: "#f472b6"
      }).setOrigin(1, 0).setDepth(60).setScrollFactor(0);
      this.hudKills = this.add.text(W - 24, 42, "KILLS 0", {
        fontFamily: "Consolas, monospace", fontSize: "13px", color: "#a78bfa"
      }).setOrigin(1, 0).setDepth(60).setScrollFactor(0);
      this.hudAmmo = this.add.text(W / 2, 20, "", {
        fontFamily: "Consolas, monospace", fontSize: "14px", color: "#22d3ee"
      }).setOrigin(0.5, 0).setDepth(60).setScrollFactor(0);
      this.hudShield = this.add.text(W / 2, 44, "", {
        fontFamily: "Consolas, monospace", fontSize: "13px", color: "#60a5fa"
      }).setOrigin(0.5, 0).setDepth(60).setScrollFactor(0);
      this.hudCombo = this.add.text(W / 2, 66, "", {
        fontFamily: "Consolas, monospace", fontSize: "13px", color: "#fbbf24"
      }).setOrigin(0.5, 0).setDepth(60).setScrollFactor(0);
      this.hudTip = this.add.text(W / 2, H - 28, "紅障跳 · 青牆滑 · 粉機／橘箱射 · 綠墊彈 · 收集發光獎勵", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "12px", color: "#94a3b8"
      }).setOrigin(0.5, 0).setDepth(60).setScrollFactor(0);
      var tipRun = this.hudTip;
      this.time.delayedCall(4500, function () {
        if (!tipRun || !tipRun.scene) return;
        tipRun.scene.tweens.add({ targets: tipRun, alpha: 0, duration: 500 });
      });

      this.updateHudAmmo();
    }

    buildParallax() {
      this.farLayer = this.add.group();
      this.midLayer = this.add.group();
      this.nearDecor = this.add.group();

      for (var i = 0; i < 8; i++) {
        var b = this.add.image(i * 160, GROUND_Y, "bldg")
          .setOrigin(0.5, 1).setDepth(1).setAlpha(0.55)
          .setTint(Phaser.Display.Color.GetColor(40 + i * 8, 50, 80));
        b.setData("baseX", b.x);
        this.farLayer.add(b);
      }
      for (var j = 0; j < 6; j++) {
        var p = this.add.image(j * 220 + 40, 220 + (j % 3) * 30, "pipe")
          .setDepth(2).setAlpha(0.7);
        this.midLayer.add(p);
      }
      for (var k = 0; k < 4; k++) {
        var n = this.add.rectangle(k * 280 + 80, GROUND_Y - 8, 60, 6, 0xf472b6, 0.35).setDepth(4);
        this.nearDecor.add(n);
      }
      this.skyGlow = this.add.rectangle(W / 2, 120, W, 240, 0x1e1b4b, 0.35).setDepth(0);
    }

    scrollParallax(dt) {
      var spd = this.scrollSpeed;
      var self = this;
      this.farLayer.getChildren().forEach(function (b) {
        b.x -= spd * 0.25 * dt;
        if (b.x < -80) b.x += 8 * 160;
      });
      this.midLayer.getChildren().forEach(function (p) {
        p.x -= spd * 0.55 * dt;
        if (p.x < -100) p.x += 6 * 220;
      });
      this.nearDecor.getChildren().forEach(function (n) {
        n.x -= spd * 0.9 * dt;
        if (n.x < -40) n.x += 4 * 280;
      });
      if (this.floorTile) this.floorTile.tilePositionX += spd * dt;
    }

    onLand() {
      if (!this.wasGrounded && this.player.body.velocity.y >= 0) {
        SFX.land();
        this.tweens.killTweensOf(this.player);
        this.player.setScale(1.2, 0.75);
        this.tweens.add({
          targets: this.player, scaleX: 1, scaleY: 1, duration: 140, ease: "Back.easeOut"
        });
      }
      this.jumpsLeft = this.diff.airJumps;
      this.coyote = this.diff.coyote;
      this.wasGrounded = true;
    }

    isGrounded() {
      return this.player.body.blocked.down || this.player.body.touching.down;
    }

    doJump() {
      if (this.ended) return;
      var grounded = this.isGrounded() || this.coyote > 0;
      if (grounded || this.jumpsLeft > 0) {
        if (!grounded) this.jumpsLeft--;
        else this.coyote = 0;
        this.endSlide();
        this.player.setVelocityY(-620);
        SFX.jump();
        this.tweens.killTweensOf(this.player);
        this.player.setScale(0.75, 1.25);
        this.tweens.add({
          targets: this.player, scaleX: 1, scaleY: 1, duration: 160, ease: "Back.easeOut"
        });
        this.wasGrounded = false;
        this.jumpBuf = 0;
      } else {
        this.jumpBuf = this.diff.jumpBuffer;
      }
    }

    startSlide() {
      if (this.ended || !this.isGrounded() || this.sliding) return;
      this.sliding = true;
      this.slideTimer = 0.55;
      this.player.setTexture("runner-slide");
      this.player.body.setSize(30, this.slideHeight);
      this.player.body.setOffset(3, 2);
      this.player.y = GROUND_Y - this.slideHeight / 2 - 2;
      this.slideSparks.start();
      SFX.slide();
    }

    endSlide() {
      if (!this.sliding) return;
      this.sliding = false;
      this.slideSparks.stop();
      this.player.setTexture("runner");
      this.player.body.setSize(28, this.standHeight);
      this.player.body.setOffset(4, 4);
      if (this.isGrounded()) this.player.y = GROUND_Y - this.standHeight / 2 - 4;
    }

    shoot() {
      if (this.ended || this.laserCd > 0) return;
      if (this.diff.limitedAmmo && this.ammo <= 0) return;
      if (this.diff.limitedAmmo) this.ammo--;
      this.laserCd = this.diff.laserCd;
      var lx = this.player.x + 28;
      var ly = this.player.y - (this.sliding ? 0 : 6);
      var beam = this.lasers.create(lx, ly, "laser");
      beam.setVelocityX(780);
      beam.setDepth(25);
      beam.setBlendMode(Phaser.BlendModes.ADD);
      SFX.shoot();
      this.updateHudAmmo();
    }

    onPointerDown(pointer) {
      this.swipeStart = { x: pointer.x, y: pointer.y, t: this.time.now };
    }

    onPointerUp(pointer) {
      if (!this.swipeStart || this.ended) return;
      var dx = pointer.x - this.swipeStart.x;
      var dy = pointer.y - this.swipeStart.y;
      var dt = this.time.now - this.swipeStart.t;
      this.swipeStart = null;
      if (dt < 400 && Math.abs(dy) > 36 && Math.abs(dy) > Math.abs(dx) * 0.8) {
        if (dy < 0) this.doJump();
        else this.startSlide();
      } else if (Math.abs(dx) < 18 && Math.abs(dy) < 18) {
        this.shoot();
      }
    }

    decorateHazard(obs, label, color, colorHex) {
      obs.setDepth(14);
      var aura = this.add.circle(obs.x, obs.y, 28, color, 0.14)
        .setStrokeStyle(2, color, 0.85).setDepth(13).setBlendMode(Phaser.BlendModes.ADD);
      var tag = this.add.text(obs.x, obs.y - 36, label, {
        fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
        fontSize: "11px", fontStyle: "bold", color: colorHex || "#ffffff",
        stroke: "#020617", strokeThickness: 3
      }).setOrigin(0.5).setDepth(15);
      obs.setData("aura", aura);
      obs.setData("tag", tag);
      this.tweens.add({
        targets: [aura, tag], alpha: { from: 0.55, to: 1 }, duration: 420, yoyo: true, repeat: -1, ease: "Sine.easeInOut"
      });
      return obs;
    }

    syncDecor(obj) {
      var aura = obj.getData("aura");
      var tag = obj.getData("tag");
      if (aura && aura.active) { aura.x = obj.x; aura.y = obj.y; }
      if (tag && tag.active) { tag.x = obj.x; tag.y = obj.y - 36; }
    }

    clearDecor(obj) {
      var aura = obj.getData("aura");
      var tag = obj.getData("tag");
      if (aura && aura.destroy) aura.destroy();
      if (tag && tag.destroy) tag.destroy();
    }

    spawnPickupAt(x, y, type) {
      var key = type === "gem" ? "gem" : (type === "shield" ? "shield-icon" : (type === "ammo" ? "ammo-icon" : "coin"));
      var p = this.coins.create(x, y, key);
      p.body.setAllowGravity(false);
      p.setDepth(16);
      p.setData("type", type || "coin");
      p.setBlendMode(Phaser.BlendModes.ADD);
      var col = type === "gem" ? 0xe879f9 : (type === "shield" ? 0x60a5fa : (type === "ammo" ? 0x22d3ee : 0xfbbf24));
      var aura = this.add.circle(x, y, type === "coin" ? 16 : 22, col, 0.2)
        .setStrokeStyle(2, col, 0.9).setDepth(15).setBlendMode(Phaser.BlendModes.ADD);
      p.setData("aura", aura);
      this.tweens.add({ targets: [p, aura], scale: 1.2, duration: 380, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
      if (type !== "coin") {
        this.tweens.add({ targets: p, angle: 360, duration: 2000, repeat: -1, ease: "Linear" });
      }
      return p;
    }

    spawnRewardCluster(baseX) {
      var roll = Math.random();
      if (roll < 0.5) {
        this.spawnPickupAt(baseX + 60, GROUND_Y - 70, "coin");
        this.spawnPickupAt(baseX + 90, GROUND_Y - 110, "coin");
        this.spawnPickupAt(baseX + 120, GROUND_Y - 70, "coin");
      } else if (roll < 0.72) {
        this.spawnPickupAt(baseX + 80, GROUND_Y - 100, "gem");
      } else if (roll < 0.88) {
        this.spawnPickupAt(baseX + 70, GROUND_Y - 90, "shield");
      } else {
        this.spawnPickupAt(baseX + 70, GROUND_Y - 90, "ammo");
      }
    }

    spawnObstacle() {
      var roll = Math.random();
      var x = W + 50;
      var type;
      if (roll < 0.18) type = "barrier";
      else if (roll < 0.34) type = "wall";
      else if (roll < 0.5) type = "drone";
      else if (roll < 0.62) type = "crate";
      else if (roll < 0.74) type = "saw";
      else if (roll < 0.84) type = "spring";
      else if (roll < 0.93) type = "highlow";
      else type = "triple";

      var obs;
      if (type === "barrier") {
        obs = this.obstacles.create(x, GROUND_Y - 18, "barrier");
        obs.setData("kind", "solid");
        obs.setData("breakable", false);
        this.decorateHazard(obs, "JUMP ↑", 0xf43f5e, "#fda4af");
      } else if (type === "wall") {
        obs = this.obstacles.create(x, GROUND_Y - 58, "wall");
        obs.setData("kind", "solid");
        obs.setData("breakable", false);
        obs.setData("needSlide", true);
        this.decorateHazard(obs, "SLIDE ↓", 0x22d3ee, "#67e8f9");
      } else if (type === "drone") {
        var dy = GROUND_Y - Phaser.Math.Between(80, 170);
        obs = this.obstacles.create(x, dy, "drone");
        obs.setData("kind", "drone");
        obs.setData("breakable", true);
        obs.setData("bob", Phaser.Math.FloatBetween(0, Math.PI * 2));
        this.decorateHazard(obs, "SHOT ✦", 0xf472b6, "#f9a8d4");
      } else if (type === "crate") {
        obs = this.obstacles.create(x, GROUND_Y - 24, "crate");
        obs.setData("kind", "crate");
        obs.setData("breakable", true);
        this.decorateHazard(obs, "BREAK ✕", 0xfbbf24, "#fde68a");
      } else if (type === "saw") {
        obs = this.obstacles.create(x, GROUND_Y - Phaser.Math.Between(50, 120), "saw");
        obs.setData("kind", "saw");
        obs.setData("breakable", false);
        obs.setData("spin", 1);
        this.decorateHazard(obs, "AVOID", 0xef4444, "#fca5a5");
      } else if (type === "spring") {
        obs = this.obstacles.create(x, GROUND_Y - 16, "spring");
        obs.setData("kind", "spring");
        obs.setData("breakable", false);
        obs.setData("boost", 1);
        this.decorateHazard(obs, "BOOST ↑↑", 0x22c55e, "#86efac");
      } else if (type === "highlow") {
        var low = this.obstacles.create(x, GROUND_Y - 18, "barrier");
        low.setData("kind", "solid");
        low.setData("breakable", false);
        this.decorateHazard(low, "JUMP ↑", 0xf43f5e, "#fda4af");
        var hi = this.obstacles.create(x + 100, GROUND_Y - 140, "drone");
        hi.setData("kind", "drone");
        hi.setData("breakable", true);
        hi.setData("bob", 0);
        this.decorateHazard(hi, "SHOT ✦", 0xf472b6, "#f9a8d4");
        obs = low;
      } else {
        // 三連挑戰：矮障 → 鋸 → 高牆
        var a = this.obstacles.create(x, GROUND_Y - 18, "barrier");
        a.setData("kind", "solid"); a.setData("breakable", false);
        this.decorateHazard(a, "JUMP ↑", 0xf43f5e, "#fda4af");
        var b = this.obstacles.create(x + 110, GROUND_Y - 90, "saw");
        b.setData("kind", "saw"); b.setData("breakable", false); b.setData("spin", 1);
        this.decorateHazard(b, "AVOID", 0xef4444, "#fca5a5");
        var c = this.obstacles.create(x + 220, GROUND_Y - 58, "wall");
        c.setData("kind", "solid"); c.setData("breakable", false); c.setData("needSlide", true);
        this.decorateHazard(c, "SLIDE ↓", 0x22d3ee, "#67e8f9");
        obs = a;
      }

      if (Math.random() < 0.62) this.spawnRewardCluster(x);
    }

    spawnMissile() {
      var m = this.missiles.create(W + 30, this.player.y + Phaser.Math.Between(-40, 40), "missile");
      m.setDepth(18);
      m.setData("homing", 1);
      this.decorateHazard(m, "MISSILE!", 0xf97316, "#fdba74");
      SFX.shoot();
    }

    destroyThing(obj, tint) {
      if (!obj || !obj.active) return;
      this.clearDecor(obj);
      dualBurst(this, obj.x, obj.y, tint || 0xf472b6, 0xfbbf24, 26);
      shockwave(this, obj.x, obj.y, tint || 0xf472b6, 70);
      doShake(this.cameras.main, 120, 0.015);
      SFX.shatter();
      obj.destroy();
      this.kills++;
      this.score += Math.floor(150 * this.diff.scoreMult * this.dangerMultiplier);
      floatText(this, obj.x, obj.y - 10, "碎裂!", "#f9a8d4", 14);
    }

    onLaserHit(laser, obs) {
      if (!obs.getData("breakable")) {
        if (laser.active) laser.destroy();
        return;
      }
      if (laser.active) laser.destroy();
      this.destroyThing(obs, obs.getData("kind") === "drone" ? 0xf472b6 : 0xfbbf24);
    }

    onLaserHitMissile(laser, missile) {
      if (laser.active) laser.destroy();
      this.destroyThing(missile, 0xfbbf24);
    }

    onPickup(_player, item) {
      if (!item.active) return;
      var type = item.getData("type") || "coin";
      var x = item.x, y = item.y;
      this.clearDecor(item);
      item.destroy();

      if (type === "coin") {
        this.coinCombo++;
        this.bestCombo = Math.max(this.bestCombo, this.coinCombo);
        this.coinComboTimer = 2.8;
        var pts = Math.floor(35 * (1 + this.coinCombo * 0.2) * this.diff.scoreMult);
        this.score += pts;
        SFX.coin(this.coinCombo);
        dualBurst(this, x, y, 0xfbbf24, 0xfef08a, 16);
        shockwave(this, x, y, 0xfbbf24, 36);
        floatText(this, x, y, "+" + pts + (this.coinCombo > 1 ? " x" + this.coinCombo : ""), "#fde68a", 15);
      } else if (type === "gem") {
        this.coinCombo += 2;
        this.bestCombo = Math.max(this.bestCombo, this.coinCombo);
        this.coinComboTimer = 3.2;
        var gpts = Math.floor(120 * this.diff.scoreMult * (1 + this.coinCombo * 0.1));
        this.score += gpts;
        SFX.gem(); SFX.power();
        powerBanner(this, "VOID GEM", "紫晶爆擊 · 高分入手", "#f0abfc");
        screenPunch(this, 0xe879f9, 0.35);
        dualBurst(this, x, y, 0xe879f9, 0xffffff, 28);
        floatText(this, x, y - 16, "+" + gpts + " GEM", "#f0abfc", 18);
      } else if (type === "shield") {
        this.shield = Math.min(2, this.shield + 1);
        this.shieldRing.setVisible(true);
        SFX.shield(); SFX.power();
        powerBanner(this, "ENERGY SHIELD", "護盾展開 · 擋下致命撞擊", "#93c5fd");
        screenPunch(this, 0x60a5fa, 0.32);
        dualBurst(this, x, y, 0x60a5fa, 0xe0f2fe, 24);
        floatText(this, x, y - 12, "護盾 x" + this.shield, "#bfdbfe", 16);
        this.updateHudAmmo();
      } else if (type === "ammo") {
        if (this.diff.limitedAmmo) this.ammo = Math.min(this.diff.ammo + 4, this.ammo + 3);
        else this.laserCd = 0;
        SFX.ammo(); SFX.power();
        powerBanner(this, "OVERCHARGE", "雷射超載 · 火力補滿", "#67e8f9");
        screenPunch(this, 0x22d3ee, 0.3);
        dualBurst(this, x, y, 0x22d3ee, 0xffffff, 22);
        floatText(this, x, y - 12, "AMMO ↑", "#a5f3fc", 16);
        this.updateHudAmmo();
      }
    }

    onHitObstacle(player, obs) {
      if (this.ended) return;
      if (obs.getData("kind") === "spring") {
        if (obs.getData("used")) return;
        if (player.body.velocity.y >= -40) {
          obs.setData("used", 1);
          player.setVelocityY(-820);
          SFX.spring();
          dualBurst(this, obs.x, obs.y, 0x22c55e, 0x86efac, 18);
          floatText(this, obs.x, obs.y - 30, "彈飛!", "#86efac", 15);
          doShake(this.cameras.main, 60, 0.008);
          this.time.delayedCall(900, function () {
            if (obs.active) obs.setData("used", 0);
          });
        }
        return;
      }
      if (obs.getData("needSlide") && this.sliding) return;
      if (obs.getData("kind") === "drone" && this.sliding && player.y > obs.y + 10) return;
      this.takeDamage(obs.x, obs.y);
    }

    onHitMissile(player, missile) {
      if (this.ended) return;
      this.destroyThing(missile, 0xfbbf24);
      this.takeDamage(missile.x, missile.y);
    }

    takeDamage(x, y) {
      if (this.ended) return;
      if (this.shield > 0) {
        this.shield--;
        this.shieldRing.setVisible(this.shield > 0);
        SFX.shieldBreak();
        doShake(this.cameras.main, 120, 0.016);
        screenPunch(this, 0x60a5fa, 0.35);
        shockwave(this, x, y, 0x60a5fa, 90);
        dualBurst(this, x, y, 0x60a5fa, 0xe0f2fe, 24);
        powerBanner(this, "SHIELD BREAK", "護盾抵擋 · 繼續衝刺", "#93c5fd");
        this.updateHudAmmo();
        return;
      }
      this.gameOver();
    }

    gameOver() {
      if (this.ended) return;
      this.ended = true;
      this.player.setVelocity(0, 0);
      this.player.body.enable = false;

      neonBurst(this, this.player.x, this.player.y, 0x22d3ee, 28);
      neonBurst(this, this.player.x, this.player.y, 0xf472b6, 20);
      this.player.setVisible(false);
      this.trail.stop();
      this.slideSparks.stop();

      this.flash.setFillStyle(0xff0044, 0);
      this.flash.setAlpha(0.55);
      this.tweens.add({ targets: this.flash, alpha: 0, duration: 450 });
      doShake(this.cameras.main, 250, 0.025);
      SFX.die();

      var distScore = Math.floor(this.distance * 2.5);
      var killScore = this.kills * 150;
      var raw = distScore + killScore + this.score;
      var finalScore = Math.floor(raw * this.diff.scoreMult * (0.85 + this.dangerMultiplier * 0.15));

      var meta = {
        difficulty: this.diff.id,
        rawScore: raw,
        slug: "cyber-neon-runner",
        distance: Math.floor(this.distance),
        kills: this.kills
      };
      try {
        if (typeof RNF !== "undefined" && RNF.submitScore) RNF.submitScore(finalScore, meta);
      } catch (_e) {}

      var self = this;
      this.time.delayedCall(420, function () {
        self.scene.launch("GameOverModal", {
          score: finalScore,
          distance: Math.floor(self.distance),
          kills: self.kills,
          diff: self.diff,
          danger: self.dangerMultiplier
        });
      });
    }

    updateHudAmmo() {
      if (this.diff.limitedAmmo) {
        this.hudAmmo.setText("LASER " + this.ammo + "/" + this.diff.ammo);
      } else {
        this.hudAmmo.setText("LASER ∞ · CD " + this.laserCd.toFixed(1));
      }
      this.hudShield.setText(this.shield > 0 ? "SHIELD x" + this.shield : "SHIELD —");
    }

    update(_t, delta) {
      if (this.ended) return;
      var dt = Math.min(delta, 40) / 1000;
      this.elapsed += dt;

      // danger & scroll ramp
      this.dangerMultiplier =
        this.diff.baseDanger * (1 + Math.log(1 + this.elapsed / 30) * 0.8);
      var ramp = Math.min(1, this.distance / 2500);
      this.scrollSpeed = Phaser.Math.Linear(
        this.diff.scroll,
        this.diff.scrollCap,
        ramp
      );

      this.distance += this.scrollSpeed * dt * 0.08;
      this.score += Math.floor(this.scrollSpeed * dt * 0.15 * this.diff.scoreMult);

      this.scrollParallax(dt);

      // input
      if (Phaser.Input.Keyboard.JustDown(this.cursors.up) || Phaser.Input.Keyboard.JustDown(this.keys.W)) {
        this.doJump();
      }
      if (this.cursors.down.isDown || this.keys.S.isDown) this.startSlide();
      if (Phaser.Input.Keyboard.JustDown(this.keys.SPACE) || Phaser.Input.Keyboard.JustDown(this.keys.F)) {
        this.shoot();
      }

      if (this.jumpBuf > 0) {
        this.jumpBuf -= dt;
        if (this.isGrounded() || this.coyote > 0) this.doJump();
      }
      if (this.isGrounded()) {
        this.coyote = this.diff.coyote;
      } else {
        this.coyote = Math.max(0, this.coyote - dt);
        this.wasGrounded = false;
      }

      if (this.sliding) {
        this.slideTimer -= dt;
        if (this.slideTimer <= 0 || !this.isGrounded()) this.endSlide();
      }

      if (this.laserCd > 0) this.laserCd = Math.max(0, this.laserCd - dt);

      // spawn
      var interval = Math.max(
        this.diff.spawnFloor,
        this.diff.spawnBase / (1 + this.elapsed / 45) / this.diff.dens
      );
      this.spawnAcc += dt;
      if (this.spawnAcc >= interval) {
        this.spawnAcc = 0;
        this.spawnObstacle();
      }

      if (this.diff.missiles) {
        this.missileAcc += dt;
        if (this.missileAcc >= Math.max(2.2, 4.5 - this.elapsed * 0.04)) {
          this.missileAcc = 0;
          this.spawnMissile();
        }
      }

      // move world objects left
      var spd = this.scrollSpeed;
      var self = this;
      this.obstacles.getChildren().forEach(function (o) {
        if (!o.active) return;
        o.x -= spd * dt;
        if (o.getData("kind") === "drone") {
          var bob = o.getData("bob") || 0;
          bob += dt * 3;
          o.setData("bob", bob);
          o.y += Math.sin(bob) * 22 * dt;
        }
        if (o.getData("spin")) o.angle += 360 * dt;
        // 接近玩家時警示放大
        if (o.x < 420 && o.x > 160) {
          var tag = o.getData("tag");
          if (tag) tag.setScale(1.15);
          var aura = o.getData("aura");
          if (aura) aura.setScale(1.25);
        }
        self.syncDecor(o);
        if (o.x < -100) {
          self.clearDecor(o);
          o.destroy();
        }
      });
      this.coins.getChildren().forEach(function (c) {
        if (!c.active) return;
        c.x -= spd * dt;
        var aura = c.getData("aura");
        if (aura && aura.active) { aura.x = c.x; aura.y = c.y; }
        if (c.x < -40) {
          self.clearDecor(c);
          c.destroy();
        }
      });
      this.missiles.getChildren().forEach(function (m) {
        if (!m.active) return;
        var targetY = self.player.y;
        m.y += Phaser.Math.Clamp(targetY - m.y, -180, 180) * dt * 1.4;
        m.x -= (spd * 1.35 + 80) * dt;
        self.syncDecor(m);
        if (m.x < -60) {
          self.clearDecor(m);
          m.destroy();
        }
      });
      this.lasers.getChildren().forEach(function (l) {
        if (!l.active) return;
        if (l.x > W + 40) l.destroy();
      });

      this.coinComboTimer = Math.max(0, this.coinComboTimer - dt);
      if (this.coinComboTimer <= 0) this.coinCombo = 0;

      this.player.x = 150;
      if (this.shieldRing) {
        this.shieldRing.setPosition(this.player.x, this.player.y);
        this.shieldRing.setVisible(this.shield > 0);
        this.shieldRing.setAlpha(0.35 + Math.sin((_t || 0) / 100) * 0.2);
      }

      this.hudDist.setText("DIST " + Math.floor(this.distance) + "m");
      this.hudScore.setText("SCORE " + this.score.toLocaleString());
      this.hudDanger.setText("DANGER: x" + this.dangerMultiplier.toFixed(2));
      this.hudKills.setText("KILLS " + this.kills);
      if (this.hudCombo) {
        this.hudCombo.setText(this.coinCombo > 0 ? "COMBO x" + this.coinCombo : "");
      }
      this.updateHudAmmo();
    }
  }


  /* ═══════════════ LeaderboardScene（本遊戲獨立排行榜） ═══════════════ */
  var LeaderboardScene = (window.RNFPhaserLeaderboard && RNFPhaserLeaderboard.createLeaderboardScene)
    ? RNFPhaserLeaderboard.createLeaderboardScene({
        Phaser: Phaser,
        makeButton: makeButton,
        W: W,
        H: H,
        accent: 0x22d3ee,
        returnScene: "MainMenuScene",
        getDefaultDiff: function () {
          return (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard";
        }
      })
    : class LeaderboardSceneMissing extends Phaser.Scene {
        constructor() { super("LeaderboardScene"); }
        create() {
          this.add.text(W / 2, H / 2, "排行榜模組未載入", {
            fontFamily: "Microsoft JhengHei, Segoe UI", fontSize: "18px", color: "#f472b6"
          }).setOrigin(0.5);
        }
      };

  class GameOverModal extends Phaser.Scene {
    constructor() { super("GameOverModal"); }
    init(data) { this.payload = data || {}; }

    create() {
      var score = this.payload.score || 0;
      var diff = this.payload.diff || DIFF.standard;

      this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.75).setInteractive().setDepth(70);
      var panel = this.add.rectangle(W / 2, H / 2, 480, 500, 0x0b1220, 0.97)
        .setStrokeStyle(2, 0xf472b6, 0.95).setScale(0.7).setAlpha(0).setDepth(71);

      var badge = this.add.text(W / 2, H / 2 - 160, "> RUN_TERMINATED", {
        fontFamily: "Consolas, monospace", fontSize: "14px", fontStyle: "bold",
        color: "#f87171", letterSpacing: 2
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      var title = this.add.text(W / 2, H / 2 - 120, "霓虹跑道中斷", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "28px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      var scoreTxt = this.add.text(W / 2, H / 2 - 45, score.toLocaleString(), {
        fontFamily: "Consolas, monospace", fontSize: "50px", fontStyle: "bold", color: "#22d3ee"
      }).setOrigin(0.5).setScale(0.4).setAlpha(0).setDepth(72);

      var meta = this.add.text(W / 2, H / 2 + 30,
        diff.label +
        "\n奔跑距離 " + (this.payload.distance || 0) + "m" +
        " · 擊碎敵機／障礙 " + (this.payload.kills || 0) +
        "\nDANGER x" + Number(this.payload.danger || 1).toFixed(2) +
        "\n已執行 RNF.submitScore → 排行榜", {
        fontFamily: "Consolas, Microsoft JhengHei, monospace",
        fontSize: "13px", color: "#94a3b8", align: "center", lineSpacing: 6
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 380, ease: "Back.easeOut" });
      this.tweens.add({ targets: [badge, title, meta], alpha: 1, duration: 300, ease: "Cubic.easeOut", delay: 80 });
      this.tweens.add({ targets: scoreTxt, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 100 });

      neonBurst(this, W / 2, H / 2 - 45, 0xf472b6, 22);

      var self = this;
      var retry = makeButton(this, W / 2 - 110, H / 2 + 95, "再試一次", 0x22d3ee, function () {
        SFX.confirm();
        self.scene.stop("GameOverModal");
        self.scene.stop("GameScene");
        self.scene.start("GameScene", { difficulty: selectedDiff });
      }, 180);
      retry.bg.setDepth(73); retry.txt.setDepth(74);

      var settings = makeButton(this, W / 2 + 110, H / 2 + 95, "排行榜", 0x34d399, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        try { self.scene.stop("SettingsScene"); } catch (_e) {}
        self.scene.stop("GameScene");
        self.scene.start("LeaderboardScene", { difficulty: (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard" });
      }, 180);
      settings.bg.setDepth(73); settings.txt.setDepth(74);
      var menu = makeButton(this, W / 2, H / 2 + 155, "主選單", 0x64748b, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        self.scene.stop("SettingsScene");
        self.scene.stop("GameScene");
        self.scene.start("MainMenuScene");
      }, 200);
    }
  }

  var config = {
    type: Phaser.WEBGL,
    parent: "game-host",
    width: W,
    height: H,
    backgroundColor: "#04060c",
    banner: false,
    physics: {
      default: "arcade",
      arcade: { gravity: { y: 0 }, debug: false }
    },

    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    fps: { target: 144, forceSet: false, smoothStep: true },
    scene: [BootScene, MainMenuScene, DifficultyScene, GameScene, GameOverModal, LeaderboardScene, SettingsScene]
  };

  try {
    window.__CYBER_NEON_RUNNER__ = new Phaser.Game(config);
  } catch (_e) {
    config.type = Phaser.AUTO;
    window.__CYBER_NEON_RUNNER__ = new Phaser.Game(config);
  }
  window.__RNF_ARCADE_GAME__ = window.__CYBER_NEON_RUNNER__;
  if (typeof RNF !== "undefined" && RNF.setShowMenuHandler) {
    RNF.setShowMenuHandler(function () {
      try {
        var g = window.__RNF_ARCADE_GAME__ || window.__CYBER_NEON_RUNNER__;
        if (!g || !g.scene) return;
        ["GameOverModal", "SettingsScene", "LeaderboardScene", "DifficultyScene", "GameScene"].forEach(function (key) {
          try { if (g.scene.getScene(key)) g.scene.stop(key); } catch (_s) {}
        });
        g.scene.start("MainMenuScene");
      } catch (_err) {}
    });
  }
})();
</script>
