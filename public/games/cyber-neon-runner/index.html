<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber Neon Runner · 賽博霓虹無盡跑酷</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #04060c; overflow: hidden;
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      touch-action: none; user-select: none;
    }
    #game-host { width: 100%; height: 100%; }
  </style>
  <script src="/sdk/phaser.min.js"></script>
  <script src="/sdk/rnf-i18n.js?v=20260730i"></script>
  <script src="/sdk/rnf-game-packs.js?v=20260730i"></script>
  <script src="/sdk/rnf-game-sdk.js?v=20260731e"></script>
  <script src="/games/_shared/rnf-phaser-leaderboard.js?v=20260731b"></script>
  <script src="/games/_shared/rnf-phaser-help.js?v=20260731d"></script>
</head>
<body>
  <div id="game-host"></div>
<script>
/**
 * Cyber Neon Runner — Phaser 3 商業級電競重構
 * Boot → MainMenu → Difficulty → Game → GameOverModal (+ Settings)
 * Juice：視差城市 · Squash&Stretch · 雷射碎裂 · 護盾 · 追蹤飛彈
 * Casual 護盾＋寬鬆二段跳 · Standard · Extreme 限彈＋飛彈
 */
(function () {
  "use strict";

  if (typeof RNF !== "undefined" && RNF.init) RNF.init();

  var W = 960;
  var H = 540;
  var GROUND_Y = 460;
  var SETTINGS_KEY = "rnf:cyber-neon-runner:settings";

  var DIFF = {
    casual: {
      id: "casual",
      label: "Casual 輕鬆",
      desc: "滾動平緩 · 預設護盾 · 二段跳寬鬆",
      color: "#67e8f9",
      scoreMult: 1.0,
      baseDanger: 1.0,
      scroll: 220,
      scrollCap: 380,
      spawnBase: 1.55,
      spawnFloor: 0.85,
      airJumps: 2,
      coyote: 0.14,
      jumpBuffer: 0.12,
      laserCd: 0.28,
      ammo: 99,
      limitedAmmo: false,
      startShield: 1,
      missiles: false,
      dens: 0.85
    },
    standard: {
      id: "standard",
      label: "Standard 電競",
      desc: "標準捲軸 · 標準障礙密度與雷射冷卻",
      color: "#a78bfa",
      scoreMult: 1.35,
      baseDanger: 1.25,
      scroll: 280,
      scrollCap: 480,
      spawnBase: 1.25,
      spawnFloor: 0.68,
      airJumps: 1,
      coyote: 0.09,
      jumpBuffer: 0.09,
      laserCd: 0.38,
      ammo: 8,
      limitedAmmo: false,
      startShield: 0,
      missiles: false,
      dens: 1
    },
    extreme: {
      id: "extreme",
      label: "Extreme 狂暴",
      desc: "極速滾動 · 限彈 · 高低差＋追蹤飛彈",
      color: "#f472b6",
      scoreMult: 2.0,
      baseDanger: 2.0,
      scroll: 360,
      scrollCap: 620,
      spawnBase: 0.95,
      spawnFloor: 0.42,
      airJumps: 1,
      coyote: 0.05,
      jumpBuffer: 0.06,
      laserCd: 0.48,
      ammo: 4,
      limitedAmmo: true,
      startShield: 0,
      missiles: true,
      dens: 1.35
    }
  };

  var selectedDiff = "standard";
  var gameSettings = loadSettings();

  function loadSettings() {
    var base = { sfx: true, shake: true };
    try {
      if (typeof RNF !== "undefined" && RNF.getSettings) {
        var s = RNF.getSettings();
        base.sfx = (s.sfxVolume == null ? 0.75 : s.sfxVolume) > 0.02;
        base.shake = s.screenShake !== false;
      }
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) Object.assign(base, JSON.parse(raw));
    } catch (_e) {}
    return base;
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameSettings));
      if (typeof RNF !== "undefined" && RNF.setSettings) {
        RNF.setSettings({
          sfxVolume: gameSettings.sfx ? 0.75 : 0,
          screenShake: !!gameSettings.shake
        });
      }
    } catch (_e) {}
  }

  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
    function rnfGameVolMul() {
    try {
      if (typeof RNF !== "undefined" && RNF.getGameVolume) return RNF.getGameVolume();
      if (typeof window !== "undefined" && typeof window.__RNF_GAME_VOLUME__ === "number") return window.__RNF_GAME_VOLUME__;
    } catch (_e) {}
    return 1;
  }
  function tone(freq, dur, type, vol, slide) {
    if (!gameSettings.sfx || rnfGameVolMul() <= 0) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime((vol || 0.1) * rnfGameVolMul(), t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  var SFX = {
    click: function () { tone(520, 0.05, "triangle", 0.07); },
    confirm: function () { tone(660, 0.07, "square", 0.09); tone(990, 0.08, "triangle", 0.07); },
    jump: function () { tone(280, 0.09, "sawtooth", 0.08, 620); },
    land: function () { tone(160, 0.05, "triangle", 0.06); },
    slide: function () { tone(200, 0.08, "sawtooth", 0.05, 90); },
    shoot: function () { tone(720, 0.05, "sawtooth", 0.07, 1200); },
    shatter: function () { tone(140, 0.16, "sawtooth", 0.13, 50); tone(380, 0.08, "square", 0.08); },
    shield: function () { tone(480, 0.12, "sine", 0.1); },
    shieldBreak: function () { tone(180, 0.2, "sawtooth", 0.12, 60); },
    die: function () { tone(120, 0.32, "sawtooth", 0.16, 40); },
    coin: function () { tone(880, 0.05, "triangle", 0.06); },
    toggle: function () { tone(440, 0.05, "triangle", 0.07); }
  };

  function doShake(cam, dur, intens) {
    if (!gameSettings.shake || !cam) return;
    cam.shake(dur, intens);
  }

  function neonBurst(scene, x, y, tint, count) {
    var n = Phaser.Math.Clamp(count || 20, 15, 40);
    var emitter = scene.add.particles(x, y, "spark", {
      speed: { min: 80, max: 380 },
      angle: { min: 0, max: 360 },
      lifespan: { min: 260, max: 700 },
      scale: { start: 1.2, end: 0 },
      alpha: { start: 1, end: 0 },
      gravityY: 80,
      blendMode: "ADD",
      tint: tint,
      emitting: false
    });
    emitter.explode(n);
    scene.time.delayedCall(900, function () { if (emitter.destroy) emitter.destroy(); });
  }

  function makeTextures(scene) {
    var g = scene.make.graphics({ x: 0, y: 0, add: false });

    g.clear();
    g.fillStyle(0x22d3ee, 1);
    g.fillRoundedRect(4, 4, 28, 40, 6);
    g.fillStyle(0xffffff, 0.45);
    g.fillCircle(14, 16, 5);
    g.fillStyle(0xa78bfa, 1);
    g.fillRect(8, 36, 8, 12);
    g.fillRect(20, 36, 8, 12);
    g.generateTexture("runner", 36, 52);

    g.clear();
    g.fillStyle(0x22d3ee, 1);
    g.fillRoundedRect(0, 0, 36, 26, 6);
    g.fillStyle(0xffffff, 0.4);
    g.fillCircle(12, 12, 4);
    g.generateTexture("runner-slide", 36, 26);

    g.clear();
    g.fillStyle(0xf472b6, 1);
    g.fillRoundedRect(0, 0, 36, 28, 4);
    g.fillStyle(0xffffff, 0.35);
    g.fillCircle(12, 10, 4);
    g.fillStyle(0xa78bfa, 1);
    g.fillTriangle(36, 6, 48, 14, 36, 22);
    g.generateTexture("drone", 48, 28);

    g.clear();
    g.fillStyle(0xf43f5e, 1);
    g.fillRoundedRect(0, 0, 28, 14, 4);
    g.fillStyle(0xfbbf24, 1);
    g.fillTriangle(28, 0, 40, 7, 28, 14);
    g.generateTexture("missile", 40, 14);

    g.clear();
    g.fillStyle(0x64748b, 1);
    g.fillRoundedRect(0, 0, 40, 36, 4);
    g.fillStyle(0xf472b6, 0.8);
    g.fillRect(4, 8, 32, 6);
    g.generateTexture("crate", 40, 36);

    g.clear();
    g.fillStyle(0x334155, 1);
    g.fillRect(0, 0, 28, 90);
    g.fillStyle(0x22d3ee, 0.7);
    g.fillRect(4, 10, 20, 8);
    g.fillRect(4, 40, 20, 8);
    g.generateTexture("wall", 28, 90);

    g.clear();
    g.fillStyle(0xfbbf24, 1);
    g.fillRoundedRect(0, 0, 52, 18, 4);
    g.fillStyle(0xffffff, 0.4);
    g.fillRect(6, 4, 40, 4);
    g.generateTexture("barrier", 52, 18);

    g.clear();
    g.fillStyle(0x67e8f9, 1);
    g.fillRect(0, 0, 28, 5);
    g.fillStyle(0xffffff, 0.8);
    g.fillRect(20, 1, 8, 3);
    g.generateTexture("laser", 28, 5);

    g.clear();
    g.fillStyle(0xfbbf24, 1);
    g.fillCircle(8, 8, 7);
    g.fillStyle(0xffffff, 0.5);
    g.fillCircle(5, 5, 2);
    g.generateTexture("coin", 16, 16);

    g.clear();
    g.fillStyle(0x60a5fa, 1);
    g.fillCircle(12, 12, 11);
    g.lineStyle(2, 0xe0f2fe, 1);
    g.strokeCircle(12, 12, 11);
    g.generateTexture("shield-icon", 24, 24);

    g.clear();
    g.fillStyle(0xffffff, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark", 6, 6);

    g.clear();
    g.fillStyle(0x0b1224, 1);
    g.fillRect(0, 40, 120, 140);
    g.fillStyle(0x1e293b, 1);
    g.fillRect(10, 20, 40, 160);
    g.fillRect(60, 60, 50, 120);
    g.fillStyle(0x22d3ee, 0.55);
    g.fillRect(18, 40, 10, 14);
    g.fillRect(32, 70, 10, 14);
    g.fillStyle(0xf472b6, 0.5);
    g.fillRect(70, 80, 12, 10);
    g.fillRect(88, 110, 12, 10);
    g.generateTexture("bldg", 120, 180);

    g.clear();
    g.fillStyle(0x0ea5e9, 0.35);
    g.fillRoundedRect(0, 0, 160, 28, 8);
    g.lineStyle(2, 0x67e8f9, 0.7);
    g.strokeRoundedRect(1, 1, 158, 26, 8);
    g.generateTexture("pipe", 160, 28);

    g.clear();
    g.fillStyle(0x111827, 1);
    g.fillRect(0, 0, 200, 80);
    g.fillStyle(0x22d3ee, 0.25);
    for (var i = 0; i < 8; i++) g.fillRect(i * 26, 0, 2, 80);
    g.fillStyle(0xa78bfa, 0.35);
    g.fillRect(0, 36, 200, 4);
    g.generateTexture("ground-tile", 200, 80);

    g.destroy();
  }

  function pulseBtn(scene, targets) {
    scene.tweens.add({
      targets: targets, scale: 1.08, duration: 90, yoyo: true, ease: "Back.easeOut"
    });
  }

  function makeButton(scene, x, y, label, color, onClick, width) {
    var bw = width || 300;
    var bg = scene.add.rectangle(x, y, bw, 50, color, 0.2)
      .setStrokeStyle(2, color, 0.9)
      .setInteractive({ useHandCursor: true });
    var txt = scene.add.text(x, y, label, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "18px", fontStyle: "bold", color: "#e2e8f0"
    }).setOrigin(0.5);
    bg.on("pointerover", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1.05, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerout", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerdown", function () {
      pulseBtn(scene, [bg, txt]);
      SFX.click();
      onClick();
    });
    return { bg: bg, txt: txt };
  }

  /* ═══════════════ BootScene ═══════════════ */
  class BootScene extends Phaser.Scene {
    constructor() { super("BootScene"); }
    create() {
      makeTextures(this);
      this.cameras.main.setBackgroundColor("#04060c");
      this.cameras.main.fadeIn(320, 4, 6, 12);
      var t = this.add.text(W / 2, H / 2 - 8, "CYBER NEON RUNNER", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "28px", fontStyle: "bold", color: "#22d3ee"
      }).setOrigin(0.5).setAlpha(0);
      this.add.text(W / 2, H / 2 + 28, "Phaser 3 · RainyNightFrog", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", color: "#64748b"
      }).setOrigin(0.5);
      this.tweens.add({ targets: t, alpha: 1, scale: 1.04, duration: 400, ease: "Back.easeOut" });
      this.time.delayedCall(520, function () { this.scene.start("MainMenuScene"); }, [], this);
    }
  }

  /* ═══════════════ MainMenuScene ═══════════════ */
  class MainMenuScene extends Phaser.Scene {
    constructor() { super("MainMenuScene"); }
    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(200, 4, 6, 12);

      for (var i = 0; i < 5; i++) {
        var b = this.add.image(120 + i * 180, H - 40, "bldg").setOrigin(0.5, 1).setAlpha(0.45).setTint(0x334155);
        this.tweens.add({
          targets: b, x: b.x - 40, duration: 8000 + i * 400, repeat: -1, yoyo: true, ease: "Sine.easeInOut"
        });
      }

      var badge = this.add.text(W / 2, 78, "RAINYNIGHTFROG · CYBER ARCADE", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "11px", fontStyle: "bold",
        color: "#22d3ee", letterSpacing: 3
      }).setOrigin(0.5).setAlpha(0);

      var title = this.add.text(W / 2, 140, "CYBER NEON RUNNER", {
        fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
        fontSize: "34px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setScale(0.65).setAlpha(0);

      var sub = this.add.text(W / 2, 195, "賽博霓虹無盡跑酷 · 跳躍／滑行／雷射 · 視差城市", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "15px", color: "#94a3b8"
      }).setOrigin(0.5).setAlpha(0);

      this.tweens.add({ targets: badge, alpha: 1, y: 88, duration: 400, ease: "Cubic.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 50 });
      this.tweens.add({ targets: sub, alpha: 1, duration: 380, ease: "Cubic.easeOut", delay: 120 });

      var self = this;
      makeButton(this, W / 2, 300, "開始遊戲 START", 0x22d3ee, function () {
        SFX.confirm();
        self.cameras.main.fadeOut(160, 4, 6, 12);
        self.time.delayedCall(170, function () { self.scene.start("DifficultyScene"); });
      });
      makeButton(this, W / 2, 370, "設定 SETTINGS", 0xa78bfa, function () {
        self.scene.launch("SettingsScene");
      });
      makeButton(this, W / 2, 440, "排行榜", 0x34d399, function () {
        self.scene.start("LeaderboardScene", { difficulty: (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard" });
      });
      makeButton(this, W / 2, 504, "操作說明", 0x64748b, function () {
        if (window.RNFPhaserHelp && RNFPhaserHelp.showHelpOverlay) {
          RNFPhaserHelp.showHelpOverlay(self, "↑／W 跳（二段）· ↓／S 滑行 · 空白／F 雷射 · 觸控上滑跳／下滑滑／點擊射", { W: W, H: H });
        }
      }, 240);
    }
  }

  /* ═══════════════ DifficultyScene ═══════════════ */
  class DifficultyScene extends Phaser.Scene {
    constructor() { super("DifficultyScene"); }
    create() {
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(160, 4, 6, 12);

      var head = this.add.text(W / 2, 70, "選擇難度", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "34px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setScale(0.7).setAlpha(0);
      this.tweens.add({ targets: head, alpha: 1, scale: 1, duration: 360, ease: "Back.easeOut" });

      this.add.text(W / 2, 118, "距離越遠 → 捲軸越快、障礙越密 · HUD 顯示 DANGER", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "14px", color: "#64748b"
      }).setOrigin(0.5);

      var self = this;
      ["casual", "standard", "extreme"].forEach(function (key, i) {
        var d = DIFF[key];
        var col = Phaser.Display.Color.HexStringToColor(d.color).color;
        var y = 190 + i * 88;
        makeButton(self, W / 2, y, d.label, col, function () {
          selectedDiff = key;
          SFX.confirm();
          self.cameras.main.fadeOut(160, 4, 6, 12);
          self.time.delayedCall(170, function () {
            self.scene.start("GameScene", { difficulty: key });
          });
        });
        self.add.text(W / 2, y + 32, d.desc + " · 分數 x" + d.scoreMult.toFixed(2) + " · DANGER x" + d.baseDanger.toFixed(1), {
          fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
          fontSize: "12px", color: "#94a3b8"
        }).setOrigin(0.5);
      });

      makeButton(this, W / 2, 490, "返回", 0x475569, function () {
        self.scene.start("MainMenuScene");
      }, 160);
    }
  }

  /* ═══════════════ SettingsScene ═══════════════ */
  class SettingsScene extends Phaser.Scene {
    constructor() { super("SettingsScene"); }
    create() {
      var dim = this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.75).setInteractive().setDepth(100);
      var panel = this.add.rectangle(W / 2, H / 2, 420, 300, 0x0b1220, 0.98)
        .setStrokeStyle(2, 0x22d3ee, 0.85).setScale(0.75).setAlpha(0).setDepth(101);
      var title = this.add.text(W / 2, H / 2 - 110, "設定選單", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "26px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setAlpha(0).setDepth(102);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 300, ease: "Back.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, duration: 260, ease: "Cubic.easeOut", delay: 50 });

      var self = this;
      var sfxBtn = makeButton(this, W / 2, H / 2 - 20, gameSettings.sfx ? "音效：開" : "音效：關", 0x22d3ee, function () {
        gameSettings.sfx = !gameSettings.sfx; saveSettings(); SFX.toggle();
        sfxBtn.txt.setText(gameSettings.sfx ? "音效：開" : "音效：關");
      }, 260);
      sfxBtn.bg.setDepth(102); sfxBtn.txt.setDepth(103);

      var shakeBtn = makeButton(this, W / 2, H / 2 + 50, gameSettings.shake ? "震屏：開" : "震屏：關", 0xa78bfa, function () {
        gameSettings.shake = !gameSettings.shake; saveSettings(); SFX.toggle();
        shakeBtn.txt.setText(gameSettings.shake ? "震屏：開" : "震屏：關");
      }, 260);
      shakeBtn.bg.setDepth(102); shakeBtn.txt.setDepth(103);

      var closeBtn = makeButton(this, W / 2, H / 2 + 120, "關閉", 0x64748b, function () {
        self.scene.stop("SettingsScene");
      }, 180);
      closeBtn.bg.setDepth(102); closeBtn.txt.setDepth(103);

      dim.on("pointerdown", function () { self.scene.stop("SettingsScene"); });
    }
  }

  /* ═══════════════ GameScene ═══════════════ */
  class GameScene extends Phaser.Scene {
    constructor() { super("GameScene"); }

    init(data) {
      this.diffKey = (data && data.difficulty) || selectedDiff || "standard";
      this.diff = DIFF[this.diffKey] || DIFF.standard;
      selectedDiff = this.diffKey;
      this.ended = false;
      this.distance = 0;
      this.kills = 0;
      this.score = 0;
      this.elapsed = 0;
      this.dangerMultiplier = this.diff.baseDanger;
      this.scrollSpeed = this.diff.scroll;
      this.spawnAcc = 0;
      this.missileAcc = 0;
      this.ammo = this.diff.ammo;
      this.laserCd = 0;
      this.shield = this.diff.startShield;
      this.sliding = false;
      this.slideTimer = 0;
      this.jumpsLeft = this.diff.airJumps;
      this.coyote = 0;
      this.jumpBuf = 0;
      this.wasGrounded = true;
      this.swipeStart = null;
    }

    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#050814");
      this.cameras.main.fadeIn(180, 4, 6, 12);

      this.physics.world.setBounds(0, 0, W, H + 80);
      this.physics.world.gravity.y = 1600;

      this.buildParallax();

      this.ground = this.physics.add.staticGroup();
      var floor = this.add.tileSprite(W / 2, GROUND_Y + 40, W + 40, 80, "ground-tile").setDepth(5);
      this.floorTile = floor;
      var groundBody = this.ground.create(W / 2, GROUND_Y + 40, "ground-tile");
      groundBody.setDisplaySize(W + 80, 80).refreshBody().setVisible(false);

      this.player = this.physics.add.sprite(150, GROUND_Y - 40, "runner");
      this.player.setCollideWorldBounds(true);
      this.player.setDepth(20);
      this.player.setBounce(0);
      this.player.body.setSize(28, 44);
      this.player.body.setOffset(4, 4);
      this.player.setMaxVelocity(0, 900);
      this.standHeight = 44;
      this.slideHeight = 22;

      this.trail = this.add.particles(0, 0, "spark", {
        follow: this.player,
        followOffset: { x: -10, y: 8 },
        speed: { min: 20, max: 80 },
        lifespan: { min: 200, max: 450 },
        scale: { start: 0.9, end: 0 },
        alpha: { start: 0.8, end: 0 },
        blendMode: "ADD",
        frequency: 28,
        tint: [0x22d3ee, 0x67e8f9, 0xffffff]
      }).setDepth(15);

      this.slideSparks = this.add.particles(0, 0, "spark", {
        follow: this.player,
        followOffset: { x: 0, y: 18 },
        speed: { min: 40, max: 140 },
        angle: { min: 160, max: 220 },
        lifespan: 280,
        scale: { start: 0.8, end: 0 },
        alpha: { start: 0.9, end: 0 },
        blendMode: "ADD",
        frequency: 40,
        tint: [0xfbbf24, 0xf472b6],
        emitting: false
      }).setDepth(16);

      this.obstacles = this.physics.add.group({ allowGravity: false, immovable: true });
      this.lasers = this.physics.add.group({ allowGravity: false });
      this.coins = this.physics.add.group({ allowGravity: false });
      this.missiles = this.physics.add.group({ allowGravity: false });

      this.physics.add.collider(this.player, this.ground, this.onLand, null, this);
      this.physics.add.overlap(this.player, this.obstacles, this.onHitObstacle, null, this);
      this.physics.add.overlap(this.player, this.missiles, this.onHitMissile, null, this);
      this.physics.add.overlap(this.lasers, this.obstacles, this.onLaserHit, null, this);
      this.physics.add.overlap(this.lasers, this.missiles, this.onLaserHitMissile, null, this);
      this.physics.add.overlap(this.player, this.coins, this.onCoin, null, this);

      this.cursors = this.input.keyboard.createCursorKeys();
      this.keys = this.input.keyboard.addKeys({
        W: Phaser.Input.Keyboard.KeyCodes.W,
        S: Phaser.Input.Keyboard.KeyCodes.S,
        F: Phaser.Input.Keyboard.KeyCodes.F,
        SPACE: Phaser.Input.Keyboard.KeyCodes.SPACE
      });

      this.input.on("pointerdown", this.onPointerDown, this);
      this.input.on("pointerup", this.onPointerUp, this);

      this.flash = this.add.rectangle(W / 2, H / 2, W, H, 0xff0044, 0).setDepth(50).setScrollFactor(0);

      this.hudDist = this.add.text(24, 18, "DIST 0m", {
        fontFamily: "Consolas, monospace", fontSize: "18px", fontStyle: "bold", color: "#e2e8f0"
      }).setDepth(60).setScrollFactor(0);
      this.hudScore = this.add.text(24, 44, "SCORE 0", {
        fontFamily: "Consolas, monospace", fontSize: "14px", color: "#67e8f9"
      }).setDepth(60).setScrollFactor(0);
      this.hudDanger = this.add.text(W - 24, 18, "DANGER: x" + this.diff.baseDanger.toFixed(2), {
        fontFamily: "Consolas, monospace", fontSize: "14px", fontStyle: "bold", color: "#f472b6"
      }).setOrigin(1, 0).setDepth(60).setScrollFactor(0);
      this.hudKills = this.add.text(W - 24, 42, "KILLS 0", {
        fontFamily: "Consolas, monospace", fontSize: "13px", color: "#a78bfa"
      }).setOrigin(1, 0).setDepth(60).setScrollFactor(0);
      this.hudAmmo = this.add.text(W / 2, 20, "", {
        fontFamily: "Consolas, monospace", fontSize: "14px", color: "#22d3ee"
      }).setOrigin(0.5, 0).setDepth(60).setScrollFactor(0);
      this.hudShield = this.add.text(W / 2, 44, "", {
        fontFamily: "Consolas, monospace", fontSize: "13px", color: "#60a5fa"
      }).setOrigin(0.5, 0).setDepth(60).setScrollFactor(0);
      this.hudTip = this.add.text(W / 2, 16, "↑跳 · ↓滑 · 空白／F／點擊射 · 上滑跳／下滑滑", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "12px", color: "#64748b"
      }).setOrigin(0.5, 0).setDepth(60).setScrollFactor(0);
      var tipRun = this.hudTip;
      this.time.delayedCall(4500, function () {
        if (!tipRun || !tipRun.scene) return;
        tipRun.scene.tweens.add({ targets: tipRun, alpha: 0, duration: 500 });
      });

      this.updateHudAmmo();
    }

    buildParallax() {
      this.farLayer = this.add.group();
      this.midLayer = this.add.group();
      this.nearDecor = this.add.group();

      for (var i = 0; i < 8; i++) {
        var b = this.add.image(i * 160, GROUND_Y, "bldg")
          .setOrigin(0.5, 1).setDepth(1).setAlpha(0.55)
          .setTint(Phaser.Display.Color.GetColor(40 + i * 8, 50, 80));
        b.setData("baseX", b.x);
        this.farLayer.add(b);
      }
      for (var j = 0; j < 6; j++) {
        var p = this.add.image(j * 220 + 40, 220 + (j % 3) * 30, "pipe")
          .setDepth(2).setAlpha(0.7);
        this.midLayer.add(p);
      }
      for (var k = 0; k < 4; k++) {
        var n = this.add.rectangle(k * 280 + 80, GROUND_Y - 8, 60, 6, 0xf472b6, 0.35).setDepth(4);
        this.nearDecor.add(n);
      }
      this.skyGlow = this.add.rectangle(W / 2, 120, W, 240, 0x1e1b4b, 0.35).setDepth(0);
    }

    scrollParallax(dt) {
      var spd = this.scrollSpeed;
      var self = this;
      this.farLayer.getChildren().forEach(function (b) {
        b.x -= spd * 0.25 * dt;
        if (b.x < -80) b.x += 8 * 160;
      });
      this.midLayer.getChildren().forEach(function (p) {
        p.x -= spd * 0.55 * dt;
        if (p.x < -100) p.x += 6 * 220;
      });
      this.nearDecor.getChildren().forEach(function (n) {
        n.x -= spd * 0.9 * dt;
        if (n.x < -40) n.x += 4 * 280;
      });
      if (this.floorTile) this.floorTile.tilePositionX += spd * dt;
    }

    onLand() {
      if (!this.wasGrounded && this.player.body.velocity.y >= 0) {
        SFX.land();
        this.tweens.killTweensOf(this.player);
        this.player.setScale(1.2, 0.75);
        this.tweens.add({
          targets: this.player, scaleX: 1, scaleY: 1, duration: 140, ease: "Back.easeOut"
        });
      }
      this.jumpsLeft = this.diff.airJumps;
      this.coyote = this.diff.coyote;
      this.wasGrounded = true;
    }

    isGrounded() {
      return this.player.body.blocked.down || this.player.body.touching.down;
    }

    doJump() {
      if (this.ended) return;
      var grounded = this.isGrounded() || this.coyote > 0;
      if (grounded || this.jumpsLeft > 0) {
        if (!grounded) this.jumpsLeft--;
        else this.coyote = 0;
        this.endSlide();
        this.player.setVelocityY(-620);
        SFX.jump();
        this.tweens.killTweensOf(this.player);
        this.player.setScale(0.75, 1.25);
        this.tweens.add({
          targets: this.player, scaleX: 1, scaleY: 1, duration: 160, ease: "Back.easeOut"
        });
        this.wasGrounded = false;
        this.jumpBuf = 0;
      } else {
        this.jumpBuf = this.diff.jumpBuffer;
      }
    }

    startSlide() {
      if (this.ended || !this.isGrounded() || this.sliding) return;
      this.sliding = true;
      this.slideTimer = 0.55;
      this.player.setTexture("runner-slide");
      this.player.body.setSize(30, this.slideHeight);
      this.player.body.setOffset(3, 2);
      this.player.y = GROUND_Y - this.slideHeight / 2 - 2;
      this.slideSparks.start();
      SFX.slide();
    }

    endSlide() {
      if (!this.sliding) return;
      this.sliding = false;
      this.slideSparks.stop();
      this.player.setTexture("runner");
      this.player.body.setSize(28, this.standHeight);
      this.player.body.setOffset(4, 4);
      if (this.isGrounded()) this.player.y = GROUND_Y - this.standHeight / 2 - 4;
    }

    shoot() {
      if (this.ended || this.laserCd > 0) return;
      if (this.diff.limitedAmmo && this.ammo <= 0) return;
      if (this.diff.limitedAmmo) this.ammo--;
      this.laserCd = this.diff.laserCd;
      var lx = this.player.x + 28;
      var ly = this.player.y - (this.sliding ? 0 : 6);
      var beam = this.lasers.create(lx, ly, "laser");
      beam.setVelocityX(780);
      beam.setDepth(25);
      beam.setBlendMode(Phaser.BlendModes.ADD);
      SFX.shoot();
      this.updateHudAmmo();
    }

    onPointerDown(pointer) {
      this.swipeStart = { x: pointer.x, y: pointer.y, t: this.time.now };
    }

    onPointerUp(pointer) {
      if (!this.swipeStart || this.ended) return;
      var dx = pointer.x - this.swipeStart.x;
      var dy = pointer.y - this.swipeStart.y;
      var dt = this.time.now - this.swipeStart.t;
      this.swipeStart = null;
      if (dt < 400 && Math.abs(dy) > 36 && Math.abs(dy) > Math.abs(dx) * 0.8) {
        if (dy < 0) this.doJump();
        else this.startSlide();
      } else if (Math.abs(dx) < 18 && Math.abs(dy) < 18) {
        this.shoot();
      }
    }

    spawnObstacle() {
      var roll = Math.random();
      var dens = this.diff.dens;
      var x = W + 40;
      var type;

      if (roll < 0.28 * dens) type = "barrier";
      else if (roll < 0.5 * dens) type = "wall";
      else if (roll < 0.72) type = "drone";
      else if (roll < 0.88) type = "crate";
      else type = "highlow";

      var obs;
      if (type === "barrier") {
        obs = this.obstacles.create(x, GROUND_Y - 12, "barrier");
        obs.setData("kind", "solid");
        obs.setData("breakable", false);
      } else if (type === "wall") {
        obs = this.obstacles.create(x, GROUND_Y - 48, "wall");
        obs.setData("kind", "solid");
        obs.setData("breakable", false);
        obs.setData("needSlide", true);
      } else if (type === "drone") {
        var dy = GROUND_Y - Phaser.Math.Between(70, 160);
        obs = this.obstacles.create(x, dy, "drone");
        obs.setData("kind", "drone");
        obs.setData("breakable", true);
        obs.setData("bob", Phaser.Math.FloatBetween(0, Math.PI * 2));
      } else if (type === "crate") {
        obs = this.obstacles.create(x, GROUND_Y - 20, "crate");
        obs.setData("kind", "crate");
        obs.setData("breakable", true);
      } else {
        // high-low combo: low barrier + high floating
        var low = this.obstacles.create(x, GROUND_Y - 12, "barrier");
        low.setData("kind", "solid");
        low.setData("breakable", false);
        var hi = this.obstacles.create(x + 90, GROUND_Y - 130, "drone");
        hi.setData("kind", "drone");
        hi.setData("breakable", true);
        hi.setData("bob", 0);
        obs = low;
      }

      if (Math.random() < 0.45) {
        var coin = this.coins.create(x + Phaser.Math.Between(40, 100), GROUND_Y - Phaser.Math.Between(40, 120), "coin");
        coin.setDepth(12);
      }
    }

    spawnMissile() {
      var m = this.missiles.create(W + 30, this.player.y + Phaser.Math.Between(-40, 40), "missile");
      m.setDepth(18);
      m.setData("homing", 1);
      SFX.shoot();
    }

    destroyThing(obj, tint) {
      if (!obj || !obj.active) return;
      neonBurst(this, obj.x, obj.y, tint || 0xf472b6, 25);
      doShake(this.cameras.main, 120, 0.015);
      SFX.shatter();
      obj.destroy();
      this.kills++;
      this.score += Math.floor(150 * this.diff.scoreMult * this.dangerMultiplier);
    }

    onLaserHit(laser, obs) {
      if (!obs.getData("breakable")) {
        if (laser.active) laser.destroy();
        return;
      }
      if (laser.active) laser.destroy();
      this.destroyThing(obs, obs.getData("kind") === "drone" ? 0xf472b6 : 0x94a3b8);
    }

    onLaserHitMissile(laser, missile) {
      if (laser.active) laser.destroy();
      this.destroyThing(missile, 0xfbbf24);
    }

    onCoin(player, coin) {
      coin.destroy();
      this.score += Math.floor(40 * this.diff.scoreMult);
      SFX.coin();
    }

    onHitObstacle(player, obs) {
      if (this.ended) return;
      if (obs.getData("needSlide") && this.sliding) return;
      if (obs.getData("kind") === "drone" && this.sliding && player.y > obs.y + 10) return;
      this.takeDamage(obs.x, obs.y);
    }

    onHitMissile(player, missile) {
      if (this.ended) return;
      this.destroyThing(missile, 0xfbbf24);
      this.takeDamage(missile.x, missile.y);
    }

    takeDamage(x, y) {
      if (this.ended) return;
      if (this.shield > 0) {
        this.shield--;
        SFX.shieldBreak();
        doShake(this.cameras.main, 100, 0.012);
        neonBurst(this, x, y, 0x60a5fa, 18);
        this.flash.setFillStyle(0x60a5fa, 0);
        this.flash.setAlpha(0.35);
        this.tweens.add({ targets: this.flash, alpha: 0, duration: 200 });
        this.updateHudAmmo();
        return;
      }
      this.gameOver();
    }

    gameOver() {
      if (this.ended) return;
      this.ended = true;
      this.player.setVelocity(0, 0);
      this.player.body.enable = false;

      neonBurst(this, this.player.x, this.player.y, 0x22d3ee, 28);
      neonBurst(this, this.player.x, this.player.y, 0xf472b6, 20);
      this.player.setVisible(false);
      this.trail.stop();
      this.slideSparks.stop();

      this.flash.setFillStyle(0xff0044, 0);
      this.flash.setAlpha(0.55);
      this.tweens.add({ targets: this.flash, alpha: 0, duration: 450 });
      doShake(this.cameras.main, 250, 0.025);
      SFX.die();

      var distScore = Math.floor(this.distance * 2.5);
      var killScore = this.kills * 150;
      var raw = distScore + killScore + this.score;
      var finalScore = Math.floor(raw * this.diff.scoreMult * (0.85 + this.dangerMultiplier * 0.15));

      var meta = {
        difficulty: this.diff.id,
        rawScore: raw,
        slug: "cyber-neon-runner",
        distance: Math.floor(this.distance),
        kills: this.kills
      };
      try {
        if (typeof RNF !== "undefined" && RNF.submitScore) RNF.submitScore(finalScore, meta);
      } catch (_e) {}

      var self = this;
      this.time.delayedCall(420, function () {
        self.scene.launch("GameOverModal", {
          score: finalScore,
          distance: Math.floor(self.distance),
          kills: self.kills,
          diff: self.diff,
          danger: self.dangerMultiplier
        });
      });
    }

    updateHudAmmo() {
      if (this.diff.limitedAmmo) {
        this.hudAmmo.setText("LASER " + this.ammo + "/" + this.diff.ammo);
      } else {
        this.hudAmmo.setText("LASER ∞ · CD " + this.laserCd.toFixed(1));
      }
      this.hudShield.setText(this.shield > 0 ? "SHIELD x" + this.shield : "SHIELD —");
    }

    update(_t, delta) {
      if (this.ended) return;
      var dt = Math.min(delta, 40) / 1000;
      this.elapsed += dt;

      // danger & scroll ramp
      this.dangerMultiplier =
        this.diff.baseDanger * (1 + Math.log(1 + this.elapsed / 30) * 0.8);
      var ramp = Math.min(1, this.distance / 2500);
      this.scrollSpeed = Phaser.Math.Linear(
        this.diff.scroll,
        this.diff.scrollCap,
        ramp
      );

      this.distance += this.scrollSpeed * dt * 0.08;
      this.score += Math.floor(this.scrollSpeed * dt * 0.15 * this.diff.scoreMult);

      this.scrollParallax(dt);

      // input
      if (Phaser.Input.Keyboard.JustDown(this.cursors.up) || Phaser.Input.Keyboard.JustDown(this.keys.W)) {
        this.doJump();
      }
      if (this.cursors.down.isDown || this.keys.S.isDown) this.startSlide();
      if (Phaser.Input.Keyboard.JustDown(this.keys.SPACE) || Phaser.Input.Keyboard.JustDown(this.keys.F)) {
        this.shoot();
      }

      if (this.jumpBuf > 0) {
        this.jumpBuf -= dt;
        if (this.isGrounded() || this.coyote > 0) this.doJump();
      }
      if (this.isGrounded()) {
        this.coyote = this.diff.coyote;
      } else {
        this.coyote = Math.max(0, this.coyote - dt);
        this.wasGrounded = false;
      }

      if (this.sliding) {
        this.slideTimer -= dt;
        if (this.slideTimer <= 0 || !this.isGrounded()) this.endSlide();
      }

      if (this.laserCd > 0) this.laserCd = Math.max(0, this.laserCd - dt);

      // spawn
      var interval = Math.max(
        this.diff.spawnFloor,
        this.diff.spawnBase / (1 + this.elapsed / 45) / this.diff.dens
      );
      this.spawnAcc += dt;
      if (this.spawnAcc >= interval) {
        this.spawnAcc = 0;
        this.spawnObstacle();
      }

      if (this.diff.missiles) {
        this.missileAcc += dt;
        if (this.missileAcc >= Math.max(2.2, 4.5 - this.elapsed * 0.04)) {
          this.missileAcc = 0;
          this.spawnMissile();
        }
      }

      // move world objects left
      var spd = this.scrollSpeed;
      var self = this;
      this.obstacles.getChildren().forEach(function (o) {
        if (!o.active) return;
        o.x -= spd * dt;
        if (o.getData("kind") === "drone") {
          var bob = o.getData("bob") || 0;
          bob += dt * 3;
          o.setData("bob", bob);
          o.y += Math.sin(bob) * 18 * dt;
        }
        if (o.x < -80) o.destroy();
      });
      this.coins.getChildren().forEach(function (c) {
        if (!c.active) return;
        c.x -= spd * dt;
        if (c.x < -40) c.destroy();
      });
      this.missiles.getChildren().forEach(function (m) {
        if (!m.active) return;
        var targetY = self.player.y;
        m.y += Phaser.Math.Clamp(targetY - m.y, -180, 180) * dt * 1.4;
        m.x -= (spd * 1.35 + 80) * dt;
        if (m.x < -60) m.destroy();
      });
      this.lasers.getChildren().forEach(function (l) {
        if (!l.active) return;
        if (l.x > W + 40) l.destroy();
      });

      // keep player x fixed-ish
      this.player.x = 150;

      this.hudDist.setText("DIST " + Math.floor(this.distance) + "m");
      this.hudScore.setText("SCORE " + this.score.toLocaleString());
      this.hudDanger.setText("DANGER: x" + this.dangerMultiplier.toFixed(2));
      this.hudKills.setText("KILLS " + this.kills);
      this.updateHudAmmo();
    }
  }

      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 380, ease: "Back.easeOut" });
      this.tweens.add({ targets: [badge, title, meta], alpha: 1, duration: 300, ease: "Cubic.easeOut", delay: 80 });

      var retry = makeButton(this, W / 2 - 110, H / 2 + 110, "再試一次", 0x22d3ee, function () {
