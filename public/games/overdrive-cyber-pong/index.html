<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Overdrive Cyber Pong · 超光速霓虹乒乓</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #04060c; overflow: hidden;
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      touch-action: none; user-select: none;
    }
    #game-host { width: 100%; height: 100%; }
  </style>
  <script src="/sdk/phaser.min.js"></script>
  <script src="/sdk/rnf-i18n.js?v=20260730h"></script>
  <script src="/sdk/rnf-game-packs.js?v=20260730h"></script>
  <script src="/sdk/rnf-game-sdk.js?v=20260731lb6"></script>
  <script src="/games/_shared/rnf-phaser-leaderboard.js?v=20260731lb8"></script>
  <script src="/games/_shared/rnf-phaser-help.js?v=20260731d"></script>
</head>
<body>
  <div id="game-host"></div>
<script>
/**
 * Overdrive Cyber Pong — Phaser 3 商業級電競重構
 * Boot → MainMenu → Difficulty → Game → GameOverModal (+ Settings)
 * Juice：弧線切球 · Squash&Stretch · 重力井／加速帶 · 進球光束
 * Casual 緩速長板 · Standard 預測 AI · Extreme 光速＋黑洞
 */
(function () {
  "use strict";

  if (typeof RNF !== "undefined" && RNF.init) RNF.init();

  var W = 960;
  var H = 540;
  var SETTINGS_KEY = "rnf:overdrive-cyber-pong:settings";
  var WIN_SCORE = 7;

  var DIFF = {
    casual: {
      id: "casual",
      label: "Casual 輕鬆",
      desc: "球速平緩 · 長擋板 · AI 反應延遲",
      color: "#67e8f9",
      scoreMult: 1.0,
      baseDanger: 1.0,
      ballSpeed: 280,
      paddleH: 110,
      paddleSpd: 420,
      aiLag: 0.22,
      aiSpd: 260,
      aiPredict: 0.35,
      wellChance: 0.35,
      wellAlways: false,
      boostChance: 0.4
    },
    standard: {
      id: "standard",
      label: "Standard 電競",
      desc: "標準球速 · 預測路徑 AI · 動態障礙",
      color: "#a78bfa",
      scoreMult: 1.35,
      baseDanger: 1.25,
      ballSpeed: 360,
      paddleH: 88,
      paddleSpd: 520,
      aiLag: 0.08,
      aiSpd: 420,
      aiPredict: 0.85,
      wellChance: 0.55,
      wellAlways: false,
      boostChance: 0.55
    },
    extreme: {
      id: "extreme",
      label: "Extreme 狂暴",
      desc: "光速初速 · 短板 · 完美 AI · 中央黑洞",
      color: "#f472b6",
      scoreMult: 2.0,
      baseDanger: 2.0,
      ballSpeed: 480,
      paddleH: 64,
      paddleSpd: 580,
      aiLag: 0.02,
      aiSpd: 620,
      aiPredict: 1.0,
      wellChance: 1,
      wellAlways: true,
      boostChance: 0.7
    }
  };

  var selectedDiff = "standard";
  var gameSettings = loadSettings();

  function loadSettings() {
    var base = { sfx: true, shake: true };
    try {
      if (typeof RNF !== "undefined" && RNF.getSettings) {
        var s = RNF.getSettings();
        base.sfx = (s.sfxVolume == null ? 0.75 : s.sfxVolume) > 0.02;
        base.shake = s.screenShake !== false;
      }
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) Object.assign(base, JSON.parse(raw));
    } catch (_e) {}
    return base;
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameSettings));
      if (typeof RNF !== "undefined" && RNF.setSettings) {
        RNF.setSettings({
          sfxVolume: gameSettings.sfx ? 0.75 : 0,
          screenShake: !!gameSettings.shake
        });
      }
    } catch (_e) {}
  }

  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
    function rnfGameVolMul() {
    try {
      if (typeof RNF !== "undefined" && RNF.getGameVolume) return RNF.getGameVolume();
      if (typeof window !== "undefined" && typeof window.__RNF_GAME_VOLUME__ === "number") return window.__RNF_GAME_VOLUME__;
    } catch (_e) {}
    return 1;
  }
  function tone(freq, dur, type, vol, slide) {
    if (!gameSettings.sfx || rnfGameVolMul() <= 0) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime((vol || 0.1) * rnfGameVolMul(), t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  var SFX = {
    click: function () { tone(520, 0.05, "triangle", 0.07); },
    confirm: function () { tone(660, 0.07, "square", 0.09); tone(990, 0.08, "triangle", 0.07); },
    hit: function () { tone(420, 0.05, "square", 0.09, 720); },
    wall: function () { tone(280, 0.04, "triangle", 0.05); },
    spin: function () { tone(540, 0.06, "sawtooth", 0.06, 880); },
    well: function () { tone(120, 0.16, "sine", 0.08, 60); },
    boost: function () { tone(700, 0.1, "sawtooth", 0.1, 1400); },
    goal: function () {
      tone(180, 0.12, "sawtooth", 0.14, 90);
      tone(520, 0.1, "square", 0.1);
      tone(780, 0.14, "triangle", 0.09);
    },
    win: function () { tone(660, 0.1, "square", 0.1); tone(880, 0.12, "triangle", 0.09); tone(1100, 0.18, "sine", 0.08); },
    lose: function () { tone(200, 0.22, "sawtooth", 0.14, 70); },
    toggle: function () { tone(440, 0.05, "triangle", 0.07); }
  };

  function doShake(cam, dur, intens) {
    if (!gameSettings.shake || !cam) return;
    cam.shake(dur, intens);
  }

  function neonBurst(scene, x, y, tint, count) {
    var n = Phaser.Math.Clamp(count || 20, 15, 40);
    var emitter = scene.add.particles(x, y, "spark", {
      speed: { min: 80, max: 360 },
      angle: { min: 0, max: 360 },
      lifespan: { min: 240, max: 680 },
      scale: { start: 1.2, end: 0 },
      alpha: { start: 1, end: 0 },
      gravityY: 30,
      blendMode: "ADD",
      tint: tint,
      emitting: false
    });
    emitter.explode(n);
    scene.time.delayedCall(850, function () { if (emitter.destroy) emitter.destroy(); });
  }

  function makeTextures(scene) {
    var g = scene.make.graphics({ x: 0, y: 0, add: false });

    g.clear();
    g.fillStyle(0x22d3ee, 1);
    g.fillRoundedRect(0, 0, 16, 100, 6);
    g.fillStyle(0xffffff, 0.45);
    g.fillRoundedRect(3, 8, 4, 84, 2);
    g.generateTexture("paddle-cyan", 16, 100);

    g.clear();
    g.fillStyle(0xf472b6, 1);
    g.fillRoundedRect(0, 0, 16, 100, 6);
    g.fillStyle(0xffffff, 0.35);
    g.fillRoundedRect(9, 8, 4, 84, 2);
    g.generateTexture("paddle-pink", 16, 100);

    g.clear();
    g.fillStyle(0xffffff, 1);
    g.fillCircle(10, 10, 9);
    g.fillStyle(0x67e8f9, 0.9);
    g.fillCircle(10, 10, 6);
    g.fillStyle(0xffffff, 0.7);
    g.fillCircle(7, 7, 2.5);
    g.generateTexture("ball", 20, 20);

    g.clear();
    g.fillStyle(0xffffff, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark", 6, 6);

    g.clear();
    g.fillStyle(0xa78bfa, 0.35);
    g.fillCircle(40, 40, 38);
    g.lineStyle(3, 0xc4b5fd, 0.9);
    g.strokeCircle(40, 40, 36);
    g.lineStyle(2, 0x22d3ee, 0.7);
    g.strokeCircle(40, 40, 18);
    g.fillStyle(0x0ea5e9, 0.5);
    g.fillCircle(40, 40, 8);
    g.generateTexture("well", 80, 80);

    g.clear();
    g.fillStyle(0xfbbf24, 0.25);
    g.fillRoundedRect(0, 0, 56, 120, 10);
    g.lineStyle(2, 0xfde68a, 0.85);
    g.strokeRoundedRect(1, 1, 54, 118, 10);
    g.fillStyle(0xfbbf24, 0.55);
    for (var i = 0; i < 4; i++) g.fillTriangle(8, 20 + i * 26, 48, 32 + i * 26, 8, 44 + i * 26);
    g.generateTexture("boost", 56, 120);

    g.destroy();
  }

  function pulseBtn(scene, targets) {
    scene.tweens.add({
      targets: targets, scale: 1.08, duration: 90, yoyo: true, ease: "Back.easeOut"
    });
  }

  function makeButton(scene, x, y, label, color, onClick, width) {
    var bw = width || 300;
    var bg = scene.add.rectangle(x, y, bw, 44, color, 0.2)
      .setStrokeStyle(2, color, 0.9)
      .setInteractive({ useHandCursor: true });
    var txt = scene.add.text(x, y, label, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "18px", fontStyle: "bold", color: "#e2e8f0"
    }).setOrigin(0.5);
    bg.on("pointerover", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1.05, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerout", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerdown", function () {
      pulseBtn(scene, [bg, txt]);
      SFX.click();
      onClick();
    });
    return { bg: bg, txt: txt };
  }

  /* ═══════════════ BootScene ═══════════════ */
  class BootScene extends Phaser.Scene {
    constructor() { super("BootScene"); }
    create() {
      makeTextures(this);
      this.cameras.main.setBackgroundColor("#04060c");
      this.cameras.main.fadeIn(320, 4, 6, 12);
      var t = this.add.text(W / 2, H / 2 - 8, "OVERDRIVE CYBER PONG", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "26px", fontStyle: "bold", color: "#22d3ee"
      }).setOrigin(0.5).setAlpha(0);
      this.add.text(W / 2, H / 2 + 28, "Phaser 3 · RainyNightFrog", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", color: "#64748b"
      }).setOrigin(0.5);
      this.tweens.add({ targets: t, alpha: 1, scale: 1.04, duration: 400, ease: "Back.easeOut" });
      this.time.delayedCall(520, function () { this.scene.start("MainMenuScene"); }, [], this);
    }
  }

  /* ═══════════════ MainMenuScene ═══════════════ */
  class MainMenuScene extends Phaser.Scene {
    constructor() { super("MainMenuScene"); }
    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(200, 4, 6, 12);

      var gfx = this.add.graphics().setAlpha(0.15);
      gfx.lineStyle(1, 0x22d3ee, 1);
      for (var x = 0; x < W; x += 48) gfx.lineBetween(x, 0, x, H);
      for (var y = 0; y < H; y += 48) gfx.lineBetween(0, y, W, y);

      for (var i = 0; i < 36; i++) {
        var orb = this.add.circle(
          Phaser.Math.Between(0, W), Phaser.Math.Between(0, H),
          Phaser.Math.Between(1, 3), 0xf472b6, Phaser.Math.FloatBetween(0.12, 0.45)
        );
        this.tweens.add({
          targets: orb, alpha: 0.08, duration: Phaser.Math.Between(700, 1600),
          yoyo: true, repeat: -1, ease: "Sine.easeInOut"
        });
      }

      var badge = this.add.text(W / 2, 78, "RAINYNIGHTFROG · CYBER ARCADE", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "11px", fontStyle: "bold",
        color: "#22d3ee", letterSpacing: 3
      }).setOrigin(0.5).setAlpha(0);

      var title = this.add.text(W / 2, 140, "OVERDRIVE CYBER PONG", {
        fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
        fontSize: "34px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setScale(0.65).setAlpha(0);

      var sub = this.add.text(W / 2, 195, "超光速霓虹乒乓 · 弧線切球 · 重力井 · 賽博 AI", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "15px", color: "#94a3b8"
      }).setOrigin(0.5).setAlpha(0);

      this.tweens.add({ targets: badge, alpha: 1, y: 88, duration: 400, ease: "Cubic.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 50 });
      this.tweens.add({ targets: sub, alpha: 1, duration: 380, ease: "Cubic.easeOut", delay: 120 });

      var self = this;
      makeButton(this, W / 2, 300, "開始遊戲 START", 0x22d3ee, function () {
        SFX.confirm();
        self.cameras.main.fadeOut(160, 4, 6, 12);
        self.time.delayedCall(170, function () { self.scene.start("DifficultyScene"); });
      });
      makeButton(this, W / 2, 370, "設定 SETTINGS", 0xa78bfa, function () {
        self.scene.launch("SettingsScene");
      });
      makeButton(this, W / 2, 440, "排行榜", 0x34d399, function () {
        self.scene.start("LeaderboardScene", { difficulty: (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard" });
      });
      makeButton(this, W / 2, 504, "操作說明", 0x64748b, function () {
        if (window.RNFPhaserHelp && RNFPhaserHelp.showHelpOverlay) {
          RNFPhaserHelp.showHelpOverlay(self, "拖曳／W S／↑↓ 移動擋板 · 移動中擊球產生弧線切球 · 先達 7 分勝", { W: W, H: H });
        }
      }, 220);
    }
  }

  /* ═══════════════ DifficultyScene ═══════════════ */
  class DifficultyScene extends Phaser.Scene {
    constructor() { super("DifficultyScene"); }
    create() {
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(160, 4, 6, 12);

      var head = this.add.text(W / 2, 70, "選擇難度", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "34px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setScale(0.7).setAlpha(0);
      this.tweens.add({ targets: head, alpha: 1, scale: 1, duration: 360, ease: "Back.easeOut" });

      this.add.text(W / 2, 118, "單人挑戰賽博 AI · 未得分前每反彈球速 +5% · 先達 7 分", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "14px", color: "#64748b"
      }).setOrigin(0.5);

      var self = this;
      ["casual", "standard", "extreme"].forEach(function (key, i) {
        var d = DIFF[key];
        var col = Phaser.Display.Color.HexStringToColor(d.color).color;
        var y = 190 + i * 88;
        makeButton(self, W / 2, y, d.label, col, function () {
          selectedDiff = key;
          SFX.confirm();
          self.cameras.main.fadeOut(160, 4, 6, 12);
          self.time.delayedCall(170, function () {
            self.scene.start("GameScene", { difficulty: key });
          });
        });
        self.add.text(W / 2, y + 32, d.desc + " · 分數 x" + d.scoreMult.toFixed(2) + " · DANGER x" + d.baseDanger.toFixed(1), {
          fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
          fontSize: "12px", color: "#94a3b8"
        }).setOrigin(0.5);
      });

      makeButton(this, W / 2, 490, "返回", 0x475569, function () {
        self.scene.start("MainMenuScene");
      }, 160);
    }
  }

  /* ═══════════════ SettingsScene ═══════════════ */
  class SettingsScene extends Phaser.Scene {
    constructor() { super("SettingsScene"); }
    create() {
      var dim = this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.75).setInteractive().setDepth(100);
      var panel = this.add.rectangle(W / 2, H / 2, 420, 300, 0x0b1220, 0.98)
        .setStrokeStyle(2, 0x22d3ee, 0.85).setScale(0.75).setAlpha(0).setDepth(101);
      var title = this.add.text(W / 2, H / 2 - 110, "設定選單", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "26px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setAlpha(0).setDepth(102);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 300, ease: "Back.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, duration: 260, ease: "Cubic.easeOut", delay: 50 });

      var self = this;
      var sfxBtn = makeButton(this, W / 2, H / 2 - 20, gameSettings.sfx ? "音效：開" : "音效：關", 0x22d3ee, function () {
        gameSettings.sfx = !gameSettings.sfx; saveSettings(); SFX.toggle();
        sfxBtn.txt.setText(gameSettings.sfx ? "音效：開" : "音效：關");
      }, 260);
      sfxBtn.bg.setDepth(102); sfxBtn.txt.setDepth(103);

      var shakeBtn = makeButton(this, W / 2, H / 2 + 50, gameSettings.shake ? "震屏：開" : "震屏：關", 0xa78bfa, function () {
        gameSettings.shake = !gameSettings.shake; saveSettings(); SFX.toggle();
        shakeBtn.txt.setText(gameSettings.shake ? "震屏：開" : "震屏：關");
      }, 260);
      shakeBtn.bg.setDepth(102); shakeBtn.txt.setDepth(103);

      var closeBtn = makeButton(this, W / 2, H / 2 + 120, "關閉", 0x64748b, function () {
        self.scene.stop("SettingsScene");
      }, 180);
      closeBtn.bg.setDepth(102); closeBtn.txt.setDepth(103);

      dim.on("pointerdown", function () { self.scene.stop("SettingsScene"); });
    }
  }

  /* ═══════════════ GameScene ═══════════════ */
  class GameScene extends Phaser.Scene {
    constructor() { super("GameScene"); }

    init(data) {
      this.diffKey = (data && data.difficulty) || selectedDiff || "standard";
      this.diff = DIFF[this.diffKey] || DIFF.standard;
      selectedDiff = this.diffKey;
      this.scoreL = 0;
      this.scoreR = 0;
      this.elapsed = 0;
      this.dangerMultiplier = this.diff.baseDanger;
      this.rally = 0;
      this.maxRally = 0;
      this.maxSpeed = 0;
      this.bounceCount = 0;
      this.spin = 0;
      this.ended = false;
      this.serveReady = true;
      this.serveDir = 1;
      this.playerVy = 0;
      this.aiTargetY = H / 2;
      this.aiTimer = 0;
      this.pointerDragging = false;
    }

    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#050814");
      this.cameras.main.fadeIn(180, 4, 6, 12);

      this.physics.world.setBounds(0, 0, W, H);
      this.physics.world.setBoundsCollision(false, false, true, true);

      this.bgGfx = this.add.graphics().setDepth(0);
      this.drawCourt();

      // center dashed line
      var dash = this.add.graphics().setDepth(1).setAlpha(0.35);
      dash.lineStyle(3, 0x94a3b8, 1);
      for (var y = 20; y < H; y += 28) dash.lineBetween(W / 2, y, W / 2, y + 14);

      this.goalFlashL = this.add.rectangle(8, H / 2, 16, H, 0x22d3ee, 0).setDepth(5);
      this.goalFlashR = this.add.rectangle(W - 8, H / 2, 16, H, 0xf472b6, 0).setDepth(5);

      var ph = this.diff.paddleH;
      this.player = this.physics.add.sprite(40, H / 2, "paddle-cyan");
      this.player.setDisplaySize(16, ph);
      this.player.body.setSize(16, 100);
      this.player.body.setAllowGravity(false);
      this.player.setImmovable(true);
      this.player.setCollideWorldBounds(true);
      this.player.body.setFriction(0);
      this.player.setDepth(10);
      this.lastPlayerY = this.player.y;

      this.ai = this.physics.add.sprite(W - 40, H / 2, "paddle-pink");
      this.ai.setDisplaySize(16, ph);
      this.ai.body.setSize(16, 100);
      this.ai.body.setAllowGravity(false);
      this.ai.setImmovable(true);
      this.ai.setCollideWorldBounds(true);
      this.ai.body.setFriction(0);
      this.ai.setDepth(10);
      this.lastAiY = this.ai.y;

      this.ball = this.physics.add.sprite(W / 2, H / 2, "ball");
      this.ball.setCircle(9);
      this.ball.setBounce(1, 1);
      this.ball.setCollideWorldBounds(true);
      this.ball.body.onWorldBounds = true;
      this.ball.body.setAllowGravity(false);
      this.ball.setDepth(12);
      this.ball.setMaxVelocity(1400, 1400);
      this.ball.body.setFriction(0, 0);

      this.trail = this.add.particles(0, 0, "spark", {
        follow: this.ball,
        speed: { min: 10, max: 40 },
        lifespan: { min: 180, max: 420 },
        scale: { start: 0.9, end: 0 },
        alpha: { start: 0.85, end: 0 },
        blendMode: "ADD",
        frequency: 18,
        tint: [0x67e8f9, 0xa78bfa, 0xffffff]
      }).setDepth(8);

      this.hazards = [];
      this.spawnHazards();

      this.cursors = this.input.keyboard.createCursorKeys();
      this.keys = this.input.keyboard.addKeys({
        W: Phaser.Input.Keyboard.KeyCodes.W,
        S: Phaser.Input.Keyboard.KeyCodes.S
      });

      this.input.on("pointerdown", this.onPointerDown, this);
      this.input.on("pointermove", this.onPointerMove, this);
      this.input.on("pointerup", this.onPointerUp, this);

      this.physics.world.on("worldbounds", this.onWorldBounds, this);

      this.hudScore = this.add.text(W / 2, 28, "0  —  0", {
        fontFamily: "Consolas, monospace", fontSize: "36px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setDepth(30);

      this.hudDanger = this.add.text(24, 20, "DANGER: x" + this.diff.baseDanger.toFixed(2), {
        fontFamily: "Consolas, monospace", fontSize: "14px", fontStyle: "bold", color: "#f472b6"
      }).setDepth(30);

      this.hudRally = this.add.text(W - 24, 20, "RALLY 0", {
        fontFamily: "Consolas, monospace", fontSize: "14px", color: "#67e8f9"
      }).setOrigin(1, 0).setDepth(30);

      this.hudSpeed = this.add.text(W / 2, 62, "SPD 0", {
        fontFamily: "Consolas, monospace", fontSize: "13px", color: "#94a3b8"
      }).setOrigin(0.5).setDepth(30);

      this.hudTip = this.add.text(W / 2, 16, "單人挑戰 · 滑鼠／觸控拖曳 或 W/S／↑↓", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "12px", color: "#64748b"
      }).setOrigin(0.5, 0).setDepth(30);
      var tipPong = this.hudTip;
      this.time.delayedCall(4500, function () {
        if (!tipPong || !tipPong.scene) return;
        tipPong.scene.tweens.add({ targets: tipPong, alpha: 0, duration: 500 });
      });

      this.serveBall();
    }

    drawCourt() {
      this.bgGfx.clear();
      this.bgGfx.fillStyle(0x050814, 1);
      this.bgGfx.fillRect(0, 0, W, H);
      this.bgGfx.lineStyle(1, 0x22d3ee, 0.12);
      for (var x = 0; x < W; x += 40) this.bgGfx.lineBetween(x, 0, x, H);
      for (var y = 0; y < H; y += 40) this.bgGfx.lineBetween(0, y, W, y);
      this.bgGfx.lineStyle(3, 0x22d3ee, 0.55);
      this.bgGfx.strokeRect(4, 4, W - 8, H - 8);
    }

    spawnHazards() {
      var self = this;
      this.hazards.forEach(function (h) {
        if (h.sprite && h.sprite.destroy) h.sprite.destroy();
      });
      this.hazards = [];

      if (this.diff.wellAlways || Math.random() < this.diff.wellChance) {
        var wy = Phaser.Math.Between(120, H - 120);
        var well = this.add.image(W / 2, wy, "well").setDepth(3).setAlpha(0.85);
        this.tweens.add({
          targets: well, scale: 1.12, alpha: 0.55, duration: 900,
          yoyo: true, repeat: -1, ease: "Sine.easeInOut"
        });
        this.hazards.push({ type: "well", sprite: well, r: 70, strength: 520 });
      }

      if (Math.random() < this.diff.boostChance) {
        var side = Math.random() < 0.5 ? -1 : 1;
        var bx = W / 2 + side * Phaser.Math.Between(90, 160);
        var by = Phaser.Math.Between(100, H - 100);
        var boost = this.add.image(bx, by, "boost").setDepth(3).setAlpha(0.8);
        this.tweens.add({
          targets: boost, alpha: 0.45, duration: 500, yoyo: true, repeat: -1
        });
        this.hazards.push({ type: "boost", sprite: boost, w: 56, h: 120, power: 1.35 });
      }
    }

    onPointerDown(pointer) {
      if (this.ended) return;
      if (pointer.x < W * 0.55) this.pointerDragging = true;
    }
    onPointerMove(pointer) {
      if (!this.pointerDragging || this.ended) return;
      this.player.y = Phaser.Math.Clamp(pointer.y, this.diff.paddleH / 2 + 8, H - this.diff.paddleH / 2 - 8);
    }
    onPointerUp() {
      this.pointerDragging = false;
    }

    onWorldBounds(body) {
      if (body.gameObject !== this.ball || this.ended || this.serveReady) return;
      if (body.blocked.up || body.blocked.down) {
        SFX.wall();
        this.applyBounceSpeed();
        neonBurst(this, this.ball.x, this.ball.y, 0x94a3b8, 12);
      }
    }

    serveBall() {
      this.serveReady = true;
      this.bounceCount = 0;
      this.spin = 0;
      this.rally = 0;
      this.ball.setVelocity(0, 0);
      this.ball.setPosition(W / 2, H / 2);
      this.ball.setAlpha(0.4);
      this.tweens.add({
        targets: this.ball, alpha: 1, scale: 1.25, duration: 220, yoyo: true, ease: "Cubic.easeOut"
      });

      var self = this;
      this.time.delayedCall(650, function () {
        if (self.ended) return;
        self.serveReady = false;
        var spd = self.diff.ballSpeed;
        var ang = Phaser.Math.FloatBetween(-0.35, 0.35);
        self.ball.setVelocity(
          Math.cos(ang) * spd * self.serveDir,
          Math.sin(ang) * spd * 0.75
        );
        SFX.hit();
      });
    }

    applyBounceSpeed() {
      this.bounceCount++;
      var body = this.ball.body;
      var vx = body.velocity.x * 1.05;
      var vy = body.velocity.y * 1.05;
      var max = 1350;
      var sp = Math.sqrt(vx * vx + vy * vy);
      if (sp > max) {
        vx = (vx / sp) * max;
        vy = (vy / sp) * max;
      }
      this.ball.setVelocity(vx, vy);
    }

    squashPaddle(paddle) {
      this.tweens.killTweensOf(paddle);
      var baseSX = paddle.scaleX;
      var baseSY = paddle.scaleY;
      paddle.setScale(baseSX * 0.7, baseSY * 1.25);
      this.tweens.add({
        targets: paddle,
        scaleX: baseSX,
        scaleY: baseSY,
        duration: 160,
        ease: "Back.easeOut"
      });
    }

    hitPaddle(paddle, isPlayer) {
      if (this.serveReady || this.ended) return;

      var half = this.diff.paddleH / 2;
      var offset = Phaser.Math.Clamp((this.ball.y - paddle.y) / half, -1, 1);
      var dir = isPlayer ? 1 : -1;
      var base = this.diff.ballSpeed * Math.pow(1.05, this.bounceCount);
      base = Math.min(base, 1200);

      var paddleVy = isPlayer ? this.playerVy : (paddle.y - this.lastAiY) * 60;
      this.spin = Phaser.Math.Clamp(paddleVy * 0.018 + offset * 40, -220, 220);

      var angle = offset * 0.75;
      var vx = Math.cos(angle) * base * dir;
      var vy = Math.sin(angle) * base + this.spin * 0.35;
      this.ball.setVelocity(vx, vy);
      this.ball.x = paddle.x + dir * 22;

      this.applyBounceSpeed();
      this.rally++;
      if (this.rally > this.maxRally) this.maxRally = this.rally;

      this.squashPaddle(paddle);
      doShake(this.cameras.main, 80, 0.008);
      neonBurst(this, this.ball.x, this.ball.y, isPlayer ? 0x22d3ee : 0xf472b6, 15);
      if (Math.abs(this.spin) > 60) SFX.spin();
      else SFX.hit();
    }

    checkPaddleHits() {
      var ball = this.ball;
      var r = 10;
      var ph = this.diff.paddleH / 2;
      var pw = 10;

      // player
      if (
        ball.x - r < this.player.x + pw &&
        ball.x + r > this.player.x - pw &&
        Math.abs(ball.y - this.player.y) < ph + r &&
        ball.body.velocity.x < 0
      ) {
        this.hitPaddle(this.player, true);
      }

      // ai
      if (
        ball.x + r > this.ai.x - pw &&
        ball.x - r < this.ai.x + pw &&
        Math.abs(ball.y - this.ai.y) < ph + r &&
        ball.body.velocity.x > 0
      ) {
        this.hitPaddle(this.ai, false);
      }
    }

    applyHazards(dt) {
      var self = this;
      var ball = this.ball;
      this.hazards.forEach(function (h) {
        if (!h.sprite || !h.sprite.active) return;
        if (h.type === "well") {
          var dx = h.sprite.x - ball.x;
          var dy = h.sprite.y - ball.y;
          var dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (dist < h.r) {
            var pull = (1 - dist / h.r) * h.strength * dt;
            ball.body.velocity.x += (dx / dist) * pull;
            ball.body.velocity.y += (dy / dist) * pull;
            if (Math.random() < 0.02) SFX.well();
          }
        } else if (h.type === "boost") {
          if (
            Math.abs(ball.x - h.sprite.x) < h.w / 2 &&
            Math.abs(ball.y - h.sprite.y) < h.h / 2
          ) {
            if (!h.cooldown) {
              h.cooldown = 0.45;
              ball.body.velocity.x *= h.power;
              ball.body.velocity.y *= h.power;
              neonBurst(self, ball.x, ball.y, 0xfbbf24, 18);
              SFX.boost();
              doShake(self.cameras.main, 60, 0.006);
            }
          }
          if (h.cooldown) h.cooldown = Math.max(0, h.cooldown - dt);
        }
      });

      // continuous spin curve (neon arc)
      if (Math.abs(this.spin) > 1) {
        ball.body.velocity.y += this.spin * dt * 2.2;
        this.spin *= Math.pow(0.92, dt * 60);
      }
    }

    updateAI(dt) {
      this.aiTimer -= dt;
      if (this.aiTimer <= 0) {
        this.aiTimer = this.diff.aiLag;
        var predict = this.diff.aiPredict;
        var target = this.ball.y;
        if (this.ball.body.velocity.x > 0 && predict > 0) {
          var t = (this.ai.x - this.ball.x) / Math.max(40, this.ball.body.velocity.x);
          target = this.ball.y + this.ball.body.velocity.y * t * predict;
          // bounce estimate against top/bottom
          while (target < 20 || target > H - 20) {
            if (target < 20) target = 40 - target;
            if (target > H - 20) target = 2 * (H - 20) - target;
          }
        } else {
          target = H / 2 + (Math.random() - 0.5) * 40;
        }
        this.aiTargetY = Phaser.Math.Clamp(target, this.diff.paddleH / 2 + 8, H - this.diff.paddleH / 2 - 8);
      }

      var dy = this.aiTargetY - this.ai.y;
      var step = Phaser.Math.Clamp(dy, -this.diff.aiSpd * dt, this.diff.aiSpd * dt);
      this.ai.y += step;
      this.ai.y = Phaser.Math.Clamp(this.ai.y, this.diff.paddleH / 2 + 8, H - this.diff.paddleH / 2 - 8);
    }

    scoreGoal(scorer) {
      if (this.ended || this.serveReady) return;
      this.serveReady = true;
      this.ball.setVelocity(0, 0);

      var playerScored = scorer === "player";
      if (playerScored) this.scoreL++;
      else this.scoreR++;

      var flash = playerScored ? this.goalFlashR : this.goalFlashL;
      flash.setAlpha(0.95);
      this.tweens.add({ targets: flash, alpha: 0, duration: 420, ease: "Cubic.easeOut" });

      // full-screen beam shockwave
      var beam = this.add.rectangle(
        playerScored ? W - 4 : 4,
        H / 2,
        8,
        H,
        playerScored ? 0x22d3ee : 0xf472b6,
        0.9
      ).setDepth(40);
      this.tweens.add({
        targets: beam,
        scaleX: 40,
        alpha: 0,
        duration: 380,
        ease: "Cubic.easeOut",
        onComplete: function () { beam.destroy(); }
      });

      neonBurst(this, playerScored ? W - 30 : 30, this.ball.y, playerScored ? 0x22d3ee : 0xf472b6, 28);
      doShake(this.cameras.main, 200, 0.02);
      SFX.goal();

      this.hudScore.setText(this.scoreL + "  —  " + this.scoreR);
      this.tweens.add({
        targets: this.hudScore, scale: 1.25, duration: 120, yoyo: true, ease: "Back.easeOut"
      });

      this.serveDir = playerScored ? -1 : 1;
      this.spawnHazards();

      var self = this;
      this.time.delayedCall(700, function () {
        if (self.scoreL >= WIN_SCORE || self.scoreR >= WIN_SCORE) self.endMatch();
        else self.serveBall();
      });
    }

    endMatch() {
      if (this.ended) return;
      this.ended = true;
      this.ball.setVelocity(0, 0);
      var won = this.scoreL >= WIN_SCORE;
      if (won) SFX.win();
      else SFX.lose();

      var raw =
        this.scoreL * 1000 +
        this.maxRally * 120 +
        Math.floor(this.maxSpeed) +
        (won ? 2500 : 0);
      var finalScore = Math.floor(raw * this.diff.scoreMult * this.dangerMultiplier);

      var meta = {
        difficulty: this.diff.id,
        rawScore: raw,
        slug: "overdrive-cyber-pong",
        playerScore: this.scoreL,
        aiScore: this.scoreR,
        maxRally: this.maxRally,
        maxSpeed: Math.floor(this.maxSpeed),
        won: won
      };
      try {
        if (typeof RNF !== "undefined" && RNF.submitScore) RNF.submitScore(finalScore, meta);
      } catch (_e) {}

      this.scene.launch("GameOverModal", {
        score: finalScore,
        won: won,
        diff: this.diff,
        scoreL: this.scoreL,
        scoreR: this.scoreR,
        maxRally: this.maxRally,
        maxSpeed: Math.floor(this.maxSpeed),
        danger: this.dangerMultiplier
      });
    }

    update(_t, delta) {
      if (this.ended) return;
      var dt = Math.min(delta, 40) / 1000;
      this.elapsed += dt;

      // danger curve (skill formula) stacked on base
      this.dangerMultiplier =
        this.diff.baseDanger * (1 + Math.log(1 + this.elapsed / 30) * 0.8);

      // player keyboard
      var move = 0;
      if (this.keys.W.isDown || this.cursors.up.isDown) move -= 1;
      if (this.keys.S.isDown || this.cursors.down.isDown) move += 1;
      if (move !== 0 && !this.pointerDragging) {
        this.player.y += move * this.diff.paddleSpd * dt;
      }
      this.player.y = Phaser.Math.Clamp(
        this.player.y,
        this.diff.paddleH / 2 + 8,
        H - this.diff.paddleH / 2 - 8
      );
      this.playerVy = (this.player.y - this.lastPlayerY) / Math.max(dt, 0.001);
      this.lastPlayerY = this.player.y;
      this.lastAiY = this.ai.y;

      this.updateAI(dt);

      if (!this.serveReady) {
        this.checkPaddleHits();
        this.applyHazards(dt);

        var sp = Math.sqrt(
          this.ball.body.velocity.x * this.ball.body.velocity.x +
          this.ball.body.velocity.y * this.ball.body.velocity.y
        );
        if (sp > this.maxSpeed) this.maxSpeed = sp;

        if (this.ball.x < -20) this.scoreGoal("ai");
        else if (this.ball.x > W + 20) this.scoreGoal("player");
      }

      this.hudDanger.setText("DANGER: x" + this.dangerMultiplier.toFixed(2));
      this.hudRally.setText("RALLY " + this.rally + " · MAX " + this.maxRally);
      this.hudSpeed.setText("SPD " + Math.floor(this.maxSpeed) + " · Bounce+" + this.bounceCount);
    }
  }


  /* ═══════════════ LeaderboardScene（本遊戲獨立排行榜） ═══════════════ */
  var LeaderboardScene = (window.RNFPhaserLeaderboard && RNFPhaserLeaderboard.createLeaderboardScene)
    ? RNFPhaserLeaderboard.createLeaderboardScene({
        Phaser: Phaser,
        makeButton: makeButton,
        W: W,
        H: H,
        accent: 0x22d3ee,
        returnScene: "MainMenuScene",
        getDefaultDiff: function () {
          return (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard";
        }
      })
    : class LeaderboardSceneMissing extends Phaser.Scene {
        constructor() { super("LeaderboardScene"); }
        create() {
          this.add.text(W / 2, H / 2, "排行榜模組未載入", {
            fontFamily: "Microsoft JhengHei, Segoe UI", fontSize: "18px", color: "#f472b6"
          }).setOrigin(0.5);
        }
      };

  class GameOverModal extends Phaser.Scene {
    constructor() { super("GameOverModal"); }
    init(data) { this.payload = data || {}; }

    create() {
      var score = this.payload.score || 0;
      var won = !!this.payload.won;
      var diff = this.payload.diff || DIFF.standard;

      this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.75).setInteractive().setDepth(70);
      var panel = this.add.rectangle(W / 2, H / 2, 480, 500, 0x0b1220, 0.97)
        .setStrokeStyle(2, won ? 0x22d3ee : 0xf43f5e, 0.95).setScale(0.7).setAlpha(0).setDepth(71);

      var badge = this.add.text(W / 2, H / 2 - 160, won ? "> MATCH_WON" : "> MATCH_LOST", {
        fontFamily: "Consolas, monospace", fontSize: "14px", fontStyle: "bold",
        color: won ? "#67e8f9" : "#f87171", letterSpacing: 2
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      var title = this.add.text(W / 2, H / 2 - 120, won ? "超光速勝利" : "矩陣防線崩潰", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "28px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      var scoreTxt = this.add.text(W / 2, H / 2 - 45, score.toLocaleString(), {
        fontFamily: "Consolas, monospace", fontSize: "50px", fontStyle: "bold", color: "#22d3ee"
      }).setOrigin(0.5).setScale(0.4).setAlpha(0).setDepth(72);

      var meta = this.add.text(W / 2, H / 2 + 30,
        diff.label +
        "\n比分 " + (this.payload.scoreL || 0) + " : " + (this.payload.scoreR || 0) +
        " · 最高球速 " + (this.payload.maxSpeed || 0) +
        "\n最長對打 RALLY " + (this.payload.maxRally || 0) +
        " · DANGER x" + Number(this.payload.danger || 1).toFixed(2) +
        "\n已執行 RNF.submitScore → 排行榜", {
        fontFamily: "Consolas, Microsoft JhengHei, monospace",
        fontSize: "13px", color: "#94a3b8", align: "center", lineSpacing: 6
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 380, ease: "Back.easeOut" });
      this.tweens.add({ targets: [badge, title, meta], alpha: 1, duration: 300, ease: "Cubic.easeOut", delay: 80 });
      this.tweens.add({ targets: scoreTxt, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 100 });

      neonBurst(this, W / 2, H / 2 - 45, won ? 0x22d3ee : 0xf43f5e, 22);

      var self = this;
      var retry = makeButton(this, W / 2 - 110, H / 2 + 95, "再試一次", 0x22d3ee, function () {
        SFX.confirm();
        self.scene.stop("GameOverModal");
        self.scene.stop("GameScene");
        self.scene.start("GameScene", { difficulty: selectedDiff });
      }, 180);
      retry.bg.setDepth(73); retry.txt.setDepth(74);

      var settings = makeButton(this, W / 2 + 110, H / 2 + 95, "排行榜", 0x34d399, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        try { self.scene.stop("SettingsScene"); } catch (_e) {}
        self.scene.stop("GameScene");
        self.scene.start("LeaderboardScene", { difficulty: (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard" });
      }, 180);
      settings.bg.setDepth(73); settings.txt.setDepth(74);
      var menu = makeButton(this, W / 2, H / 2 + 155, "主選單", 0x64748b, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        self.scene.stop("SettingsScene");
        self.scene.stop("GameScene");
        self.scene.start("MainMenuScene");
      }, 200);
    }
  }

  var config = {
    type: Phaser.WEBGL,
    parent: "game-host",
    width: W,
    height: H,
    backgroundColor: "#04060c",
    banner: false,
    physics: {
      default: "arcade",
      arcade: { gravity: { y: 0 }, debug: false }
    },

    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    fps: { target: 144, forceSet: false, smoothStep: true },
    scene: [BootScene, MainMenuScene, DifficultyScene, GameScene, GameOverModal, LeaderboardScene, SettingsScene]
  };

  try {
    window.__OVERDRIVE_CYBER_PONG__ = new Phaser.Game(config);
  } catch (_e) {
    config.type = Phaser.AUTO;
    window.__OVERDRIVE_CYBER_PONG__ = new Phaser.Game(config);
  }
  window.__RNF_ARCADE_GAME__ = window.__OVERDRIVE_CYBER_PONG__;
  if (typeof RNF !== "undefined" && RNF.setShowMenuHandler) {
    RNF.setShowMenuHandler(function () {
      try {
        var g = window.__RNF_ARCADE_GAME__ || window.__OVERDRIVE_CYBER_PONG__;
        if (!g || !g.scene) return;
        ["GameOverModal", "SettingsScene", "LeaderboardScene", "DifficultyScene", "GameScene"].forEach(function (key) {
          try { if (g.scene.getScene(key)) g.scene.stop(key); } catch (_s) {}
        });
        g.scene.start("MainMenuScene");
      } catch (_err) {}
    });
  }
})();
</script>
