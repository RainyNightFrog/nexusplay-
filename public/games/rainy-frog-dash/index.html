<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rainy Frog Dash · 雨夜飛天蛙</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #04060c; overflow: hidden;
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      touch-action: none;
    }
    #game-host { width: 100%; height: 100%; }
  </style>
  <script src="/sdk/phaser.min.js"></script>
  <script src="/sdk/rnf-i18n.js?v=20260730e"></script>
  <script src="/sdk/rnf-game-packs.js?v=20260730e"></script>
  <script src="/sdk/rnf-game-sdk.js?v=20260731e"></script>
  <script src="/games/_shared/rnf-phaser-leaderboard.js?v=20260731b"></script>
  <script src="/games/_shared/rnf-phaser-help.js?v=20260731d"></script>
</head>
<body>
  <div id="game-host"></div>
<script>
/**
 * Rainy Frog Dash — Phaser 3 商業級電競重構
 * Boot → MainMenu → Difficulty → Game → GameOverModal (+ Settings)
 * Juice：擠壓拉伸／雨絲／護盾·火箭·金雨滴
 * Casual 寬隙二段跳 · Standard · Extreme 窄隙移動管＋暴風
 */
(function () {
  "use strict";

  if (typeof RNF !== "undefined" && RNF.init) RNF.init();

  var W = 960;
  var H = 540;
  var SETTINGS_KEY = "rnf:rainy-frog-dash:settings";

  var DIFF = {
    casual: {
      id: "casual",
      label: "Casual 輕鬆",
      desc: "管道間隙寬 · 重力平緩 · 二段跳躍",
      color: "#67e8f9",
      scoreMult: 1.0,
      gravity: 980,
      jump: -380,
      jump2: -320,
      maxJumps: 2,
      gap: 190,
      scroll: 160,
      spawnEvery: 2.0,
      movingPipes: false
    },
    standard: {
      id: "standard",
      label: "Standard 電競",
      desc: "標準間隙 · 標準重力 · 一次二段跳",
      color: "#a78bfa",
      scoreMult: 1.35,
      gravity: 1200,
      jump: -420,
      jump2: -340,
      maxJumps: 2,
      gap: 150,
      scroll: 200,
      spawnEvery: 1.55,
      movingPipes: false
    },
    extreme: {
      id: "extreme",
      label: "Extreme 狂暴",
      desc: "窄間隙 · 管道動態移動 · 雨夜暴風",
      color: "#f472b6",
      scoreMult: 2.5,
      gravity: 1450,
      jump: -450,
      jump2: -300,
      maxJumps: 2,
      gap: 118,
      scroll: 250,
      spawnEvery: 1.2,
      movingPipes: true
    }
  };

  var selectedDiff = "standard";
  var gameSettings = loadSettings();

  function loadSettings() {
    var base = { sfx: true, shake: true };
    try {
      if (typeof RNF !== "undefined" && RNF.getSettings) {
        var s = RNF.getSettings();
        base.sfx = (s.sfxVolume == null ? 0.75 : s.sfxVolume) > 0.02;
        base.shake = s.screenShake !== false;
      }
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) Object.assign(base, JSON.parse(raw));
    } catch (_e) {}
    return base;
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameSettings));
      if (typeof RNF !== "undefined" && RNF.setSettings) {
        RNF.setSettings({
          sfxVolume: gameSettings.sfx ? 0.75 : 0,
          screenShake: !!gameSettings.shake
        });
      }
    } catch (_e) {}
  }

  /* ── Audio ── */
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
    function rnfGameVolMul() {
    try {
      if (typeof RNF !== "undefined" && RNF.getGameVolume) return RNF.getGameVolume();
      if (typeof window !== "undefined" && typeof window.__RNF_GAME_VOLUME__ === "number") return window.__RNF_GAME_VOLUME__;
    } catch (_e) {}
    return 1;
  }
  function tone(freq, dur, type, vol, slide) {
    if (!gameSettings.sfx || rnfGameVolMul() <= 0) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime((vol || 0.1) * rnfGameVolMul(), t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  var SFX = {
    click: function () { tone(520, 0.05, "triangle", 0.07); },
    confirm: function () { tone(660, 0.07, "square", 0.09); tone(990, 0.08, "triangle", 0.07); },
    jump: function () { tone(320, 0.08, "sawtooth", 0.09, 560); },
    drop: function (n) {
      var f = 600 + Math.min(n || 0, 12) * 45;
      tone(f, 0.06, "square", 0.1);
      tone(f * 1.4, 0.08, "triangle", 0.07);
    },
    shield: function () { tone(480, 0.1, "sine", 0.1); tone(720, 0.12, "triangle", 0.08); },
    shieldBreak: function () { tone(200, 0.15, "sawtooth", 0.12, 80); },
    rocket: function () { tone(140, 0.2, "sawtooth", 0.12, 400); tone(90, 0.25, "triangle", 0.08); },
    die: function () { tone(160, 0.22, "sawtooth", 0.14, 45); tone(70, 0.35, "triangle", 0.1); },
    toggle: function () { tone(440, 0.05, "triangle", 0.07); }
  };

  function doShake(cam, dur, intens) {
    if (!gameSettings.shake || !cam) return;
    cam.shake(dur, intens);
  }

  function neonBurst(scene, x, y, tint, count) {
    var n = Phaser.Math.Clamp(count || 20, 15, 40);
    var emitter = scene.add.particles(x, y, "spark", {
      speed: { min: 60, max: 320 },
      angle: { min: 0, max: 360 },
      lifespan: { min: 260, max: 700 },
      scale: { start: 1.15, end: 0 },
      alpha: { start: 1, end: 0 },
      gravityY: 80,
      blendMode: "ADD",
      tint: tint,
      emitting: false
    });
    emitter.explode(n);
    scene.time.delayedCall(850, function () { if (emitter.destroy) emitter.destroy(); });
  }

  function makeTextures(scene) {
    var g = scene.make.graphics({ x: 0, y: 0, add: false });

    // frog body
    g.clear();
    g.fillStyle(0x34d399, 1);
    g.fillEllipse(20, 18, 36, 28);
    g.fillStyle(0x6ee7b7, 1);
    g.fillCircle(12, 10, 7);
    g.fillCircle(28, 10, 7);
    g.fillStyle(0x0f172a, 1);
    g.fillCircle(12, 10, 3);
    g.fillCircle(28, 10, 3);
    g.fillStyle(0x22d3ee, 1);
    g.fillTriangle(36, 16, 48, 12, 48, 22);
    g.generateTexture("frog", 52, 36);

    // pipe
    g.clear();
    g.fillStyle(0xa78bfa, 1);
    g.fillRect(0, 0, 64, 200);
    g.fillStyle(0x22d3ee, 0.35);
    g.fillRect(0, 0, 10, 200);
    g.fillStyle(0xc4b5fd, 1);
    g.fillRect(-4, 0, 72, 18);
    g.generateTexture("pipe", 72, 200);

    g.clear();
    g.fillStyle(0x22d3ee, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark", 6, 6);

    g.clear();
    g.fillStyle(0x67e8f9, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark-cyan", 6, 6);

    g.clear();
    g.fillStyle(0xfbbf24, 1);
    g.fillCircle(5, 5, 5);
    g.fillStyle(0xffffff, 0.5);
    g.fillCircle(3, 3, 2);
    g.generateTexture("raindrop", 10, 10);

    g.clear();
    g.fillStyle(0xa78bfa, 1);
    g.fillCircle(12, 12, 11);
    g.lineStyle(2, 0xe9d5ff, 1);
    g.strokeCircle(12, 12, 11);
    g.generateTexture("shield-icon", 24, 24);

    g.clear();
    g.fillStyle(0xf97316, 1);
    g.fillTriangle(4, 20, 20, 12, 4, 4);
    g.fillStyle(0xfbbf24, 1);
    g.fillTriangle(8, 16, 18, 12, 8, 8);
    g.generateTexture("rocket-icon", 24, 24);

    g.clear();
    g.fillStyle(0xf97316, 1);
    g.fillCircle(4, 4, 4);
    g.generateTexture("flame", 8, 8);

    g.destroy();
  }

  function pulseBtn(scene, targets) {
    scene.tweens.add({
      targets: targets, scale: 1.08, duration: 90, yoyo: true, ease: "Back.easeOut"
    });
  }

  function makeButton(scene, x, y, label, color, onClick, width) {
    var bw = width || 300;
    var bg = scene.add.rectangle(x, y, bw, 50, color, 0.2)
      .setStrokeStyle(2, color, 0.9)
      .setInteractive({ useHandCursor: true });
    var txt = scene.add.text(x, y, label, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "18px", fontStyle: "bold", color: "#e2e8f0"
    }).setOrigin(0.5);
    bg.on("pointerover", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1.05, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerout", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerdown", function () {
      pulseBtn(scene, [bg, txt]);
      SFX.click();
      onClick();
    });
    return { bg: bg, txt: txt };
  }

  /* ═══════════════ Boot ═══════════════ */
  class BootScene extends Phaser.Scene {
    constructor() { super("BootScene"); }
    create() {
      makeTextures(this);
      this.cameras.main.setBackgroundColor("#04060c");
      this.cameras.main.fadeIn(320, 4, 6, 12);
      var t = this.add.text(W / 2, H / 2 - 8, "RAINY FROG DASH", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "28px", fontStyle: "bold", color: "#22d3ee"
      }).setOrigin(0.5).setAlpha(0);
      this.add.text(W / 2, H / 2 + 28, "Phaser 3 · RainyNightFrog", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", color: "#64748b"
      }).setOrigin(0.5);
      this.tweens.add({ targets: t, alpha: 1, scale: 1.04, duration: 400, ease: "Back.easeOut" });
      this.time.delayedCall(520, function () { this.scene.start("MainMenuScene"); }, [], this);
    }
  }

  /* ═══════════════ Main Menu ═══════════════ */
  class MainMenuScene extends Phaser.Scene {
    constructor() { super("MainMenuScene"); }
    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(200, 4, 6, 12);

      for (var i = 0; i < 40; i++) {
        var drop = this.add.rectangle(
          Phaser.Math.Between(0, W), Phaser.Math.Between(0, H),
          2, Phaser.Math.Between(8, 18), 0x22d3ee, Phaser.Math.FloatBetween(0.08, 0.25)
        ).setAngle(18);
        this.tweens.add({
          targets: drop, y: drop.y + 80, alpha: 0.05,
          duration: Phaser.Math.Between(800, 1600), yoyo: true, repeat: -1, ease: "Sine.easeInOut"
        });
      }

      var badge = this.add.text(W / 2, 78, "RAINYNIGHTFROG · CYBER ARCADE", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "11px", fontStyle: "bold",
        color: "#22d3ee", letterSpacing: 3
      }).setOrigin(0.5).setAlpha(0);

      var title = this.add.text(W / 2, 140, "RAINY FROG DASH", {
        fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
        fontSize: "38px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setScale(0.65).setAlpha(0);

      var sub = this.add.text(W / 2, 195, "雨夜飛天蛙 · 護盾／火箭 · 金雨滴 Combo · 暴風危險曲線", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "15px", color: "#94a3b8"
      }).setOrigin(0.5).setAlpha(0);

      this.tweens.add({ targets: badge, alpha: 1, y: 88, duration: 400, ease: "Cubic.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 50 });
      this.tweens.add({ targets: sub, alpha: 1, duration: 380, ease: "Cubic.easeOut", delay: 120 });

      var self = this;
      makeButton(this, W / 2, 300, "開始遊戲 START", 0x22d3ee, function () {
        SFX.confirm();
        self.cameras.main.fadeOut(160, 4, 6, 12);
        self.time.delayedCall(170, function () { self.scene.start("DifficultyScene"); });
      });
      makeButton(this, W / 2, 370, "設定 SETTINGS", 0xa78bfa, function () {
        self.scene.launch("SettingsScene");
      });
      makeButton(this, W / 2, 440, "排行榜", 0x34d399, function () {
        self.scene.start("LeaderboardScene", { difficulty: (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard" });
      });
      makeButton(this, W / 2, 504, "操作說明", 0x64748b, function () {
        if (window.RNFPhaserHelp && RNFPhaserHelp.showHelpOverlay) {
          RNFPhaserHelp.showHelpOverlay(self, "空白／↑／點擊跳躍 · 二段跳 · 收集金雨滴 · 護盾擋一次 · 火箭無敵衝刺", { W: W, H: H });
        }
      }, 240);
    }
  }

  /* ═══════════════ Difficulty ═══════════════ */
  class DifficultyScene extends Phaser.Scene {
    constructor() { super("DifficultyScene"); }
    create() {
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(160, 4, 6, 12);

      var head = this.add.text(W / 2, 70, "選擇難度", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "34px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setScale(0.7).setAlpha(0);
      this.tweens.add({ targets: head, alpha: 1, scale: 1, duration: 360, ease: "Back.easeOut" });

      this.add.text(W / 2, 118, "飛越越遠 → 滾動越快 · 管道越密 · DANGER 越高", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "14px", color: "#64748b"
      }).setOrigin(0.5);

      var self = this;
      ["casual", "standard", "extreme"].forEach(function (key, i) {
        var d = DIFF[key];
        var col = Phaser.Display.Color.HexStringToColor(d.color).color;
        var y = 190 + i * 88;
        makeButton(self, W / 2, y, d.label, col, function () {
          selectedDiff = key;
          SFX.confirm();
          self.cameras.main.fadeOut(160, 4, 6, 12);
          self.time.delayedCall(170, function () {
            self.scene.start("GameScene", { difficulty: key });
          });
        });
        self.add.text(W / 2, y + 32, d.desc + " · 分數 x" + d.scoreMult.toFixed(2), {
          fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
          fontSize: "12px", color: "#94a3b8"
        }).setOrigin(0.5);
      });

      makeButton(this, W / 2, 490, "返回", 0x475569, function () {
        self.scene.start("MainMenuScene");
      }, 160);
    }
  }

  /* ═══════════════ Settings ═══════════════ */
  class SettingsScene extends Phaser.Scene {
    constructor() { super("SettingsScene"); }
    create() {
      var dim = this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.75).setInteractive().setDepth(100);
      var panel = this.add.rectangle(W / 2, H / 2, 420, 300, 0x0b1220, 0.98)
        .setStrokeStyle(2, 0x22d3ee, 0.85).setScale(0.75).setAlpha(0).setDepth(101);
      var title = this.add.text(W / 2, H / 2 - 110, "設定選單", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "26px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setAlpha(0).setDepth(102);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 300, ease: "Back.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, duration: 260, ease: "Cubic.easeOut", delay: 50 });

      var self = this;
      var sfxBtn = makeButton(this, W / 2, H / 2 - 20, gameSettings.sfx ? "音效：開" : "音效：關", 0x22d3ee, function () {
        gameSettings.sfx = !gameSettings.sfx; saveSettings(); SFX.toggle();
        sfxBtn.txt.setText(gameSettings.sfx ? "音效：開" : "音效：關");
      }, 260);
      sfxBtn.bg.setDepth(102); sfxBtn.txt.setDepth(103);

      var shakeBtn = makeButton(this, W / 2, H / 2 + 50, gameSettings.shake ? "震屏：開" : "震屏：關", 0xa78bfa, function () {
        gameSettings.shake = !gameSettings.shake; saveSettings(); SFX.toggle();
        shakeBtn.txt.setText(gameSettings.shake ? "震屏：開" : "震屏：關");
      }, 260);
      shakeBtn.bg.setDepth(102); shakeBtn.txt.setDepth(103);

      var closeBtn = makeButton(this, W / 2, H / 2 + 120, "關閉", 0x64748b, function () {
        self.scene.stop("SettingsScene");
      }, 180);
      closeBtn.bg.setDepth(102); closeBtn.txt.setDepth(103);

      dim.on("pointerdown", function () { self.scene.stop("SettingsScene"); });
    }
  }

  /* ═══════════════ Game ═══════════════ */
  class GameScene extends Phaser.Scene {
    constructor() { super("GameScene"); }

    init(data) {
      this.diffKey = (data && data.difficulty) || selectedDiff || "standard";
      this.diff = DIFF[this.diffKey] || DIFF.standard;
      selectedDiff = this.diffKey;
    }

    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#050814");
      this.cameras.main.fadeIn(180, 4, 6, 12);

      this.score = 0;
      this.combo = 0;
      this.comboTimer = 0;
      this.distance = 0;
      this.dangerMultiplier = 1;
      this.alive = true;
      this.started = false;
      this.jumpsUsed = 0;
      this.shield = 0;
      this.rocketTimer = 0;
      this.invuln = 0;
      this.spawnAcc = 0;
      this.scrollSpeed = this.diff.scroll;
      this.pipePairs = [];

      this.drawSkyline();
      this.createRain();

      this.physics.world.gravity.y = this.diff.gravity;

      this.frog = this.physics.add.sprite(220, H / 2, "frog");
      this.frog.setCollideWorldBounds(false);
      this.frog.setDepth(20);
      this.frog.body.setSize(36, 28);
      this.frog.body.setOffset(6, 4);
      this.frog.body.setAllowGravity(false);
      this.frog.setBounce(0);

      this.pipes = this.physics.add.group();
      this.pickups = this.physics.add.group();

      this.physics.add.overlap(this.frog, this.pipes, this.onHitPipe, null, this);
      this.physics.add.overlap(this.frog, this.pickups, this.onPickup, null, this);

      this.shieldRing = this.add.circle(this.frog.x, this.frog.y, 28, 0xa78bfa, 0.2)
        .setStrokeStyle(2, 0xc4b5fd, 0.9).setDepth(19).setVisible(false);

      this.rocketTrail = this.add.particles(0, 0, "flame", {
        speed: { min: 40, max: 140 },
        angle: { min: 150, max: 210 },
        lifespan: { min: 200, max: 450 },
        scale: { start: 1.4, end: 0 },
        alpha: { start: 0.9, end: 0 },
        blendMode: "ADD",
        frequency: 18,
        follow: this.frog,
        followOffset: { x: -18, y: 0 },
        emitting: false
      }).setDepth(18);

      this.flash = this.add.rectangle(W / 2, H / 2, W, H, 0xff2244, 0).setDepth(60);
      this.createHud();
      this.bindInput();

      this.hudHint = this.add.text(W / 2, H / 2 + 60, "點擊／空白 開始飛躍", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "16px", color: "#94a3b8"
      }).setOrigin(0.5).setDepth(40);
    }

    drawSkyline() {
      var g = this.add.graphics().setDepth(0);
      g.fillStyle(0x050814, 1);
      g.fillRect(0, 0, W, H);
      // city silhouettes (static parallax feel via scroll offset later)
      this.cityGfx = this.add.graphics().setDepth(1);
      this.cityOffset = 0;
      this.redrawCity(0);

      // ground line
      this.add.rectangle(W / 2, H - 8, W, 16, 0x0ea5e9, 0.25).setDepth(5);
      this.add.rectangle(W / 2, 8, W, 16, 0xa78bfa, 0.15).setDepth(5);
    }

    redrawCity(off) {
      var g = this.cityGfx;
      g.clear();
      for (var i = -1; i < 14; i++) {
        var x = ((i * 90 - off) % (W + 90));
        if (x < -80) x += W + 90;
        var h = 60 + ((i * 37) % 120);
        g.fillStyle(0x22d3ee, 0.06);
        g.fillRect(x, H - 24 - h, 50, h);
        g.fillStyle(0xfbbf24, 0.15);
        if ((i + off) % 3 < 1) g.fillRect(x + 10, H - 24 - h + 20, 6, 8);
      }
    }

    createRain() {
      this.rain = this.add.particles(0, 0, "spark-cyan", {
        x: { min: 0, max: W + 100 },
        y: { min: -40, max: 0 },
        speedY: { min: 280, max: 520 },
        speedX: { min: -80, max: -40 },
        scale: { start: 0.35, end: 0.1 },
        alpha: { start: 0.35, end: 0 },
        lifespan: 1400,
        quantity: 2,
        frequency: 16,
        blendMode: "ADD"
      }).setDepth(3);
      // slanted look via angle on particle texture is limited; offset velocity gives slant
    }

    createHud() {
      this.hudScore = this.add.text(14, 10, "SCORE 0", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "16px", fontStyle: "bold", color: "#67e8f9"
      }).setDepth(40);
      this.hudDanger = this.add.text(14, 32, "DANGER: x1.00", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "14px", fontStyle: "bold", color: "#f472b6"
      }).setDepth(40);
      this.hudDist = this.add.text(W / 2, 10, "0m", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "15px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5, 0).setDepth(40);
      this.hudCombo = this.add.text(W / 2, 32, "COMBO —", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", color: "#fbbf24"
      }).setOrigin(0.5, 0).setDepth(40);
      this.hudDiff = this.add.text(W - 14, 10, this.diff.label, {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif", fontSize: "13px", color: this.diff.color
      }).setOrigin(1, 0).setDepth(40);
      this.hudPower = this.add.text(W - 14, 32, "", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif", fontSize: "12px", color: "#94a3b8"
      }).setOrigin(1, 0).setDepth(40);
    }

    bindInput() {
      var self = this;
      var jump = function () { self.tryJump(); };
      this.input.keyboard.on("keydown-SPACE", jump);
      this.input.keyboard.on("keydown-UP", jump);
      this.input.keyboard.on("keydown-W", jump);
      this.input.on("pointerdown", jump);
    }

    tryJump() {
      if (!this.alive) return;
      ensureAudio();

      if (!this.started) {
        this.started = true;
        this.frog.body.setAllowGravity(true);
        this.hudHint.setVisible(false);
        this.spawnPipePair();
      }

      if (this.jumpsUsed >= this.diff.maxJumps) return;

      var isSecond = this.jumpsUsed >= 1;
      var vy = isSecond ? this.diff.jump2 : this.diff.jump;
      this.frog.setVelocityY(vy);
      this.jumpsUsed++;

      // Squash & Stretch + tilt
      this.tweens.killTweensOf(this.frog);
      this.frog.setScale(1.25, 0.7);
      this.frog.setAngle(-18);
      this.tweens.add({
        targets: this.frog,
        scaleX: 1,
        scaleY: 1,
        duration: 160,
        ease: "Back.easeOut"
      });

      neonBurst(this, this.frog.x, this.frog.y + 16, 0x22d3ee, 15);
      SFX.jump();
      doShake(this.cameras.main, 50, 0.005);

      // rocket "dash" feel on jump while rocket active — extra micro shake
      if (this.rocketTimer > 0) {
        doShake(this.cameras.main, 40, 0.006);
      }
    }

    spawnPipePair() {
      var gap = this.diff.gap / Math.sqrt(Math.max(1, this.dangerMultiplier * 0.55 + 0.45));
      gap = Phaser.Math.Clamp(gap, 96, this.diff.gap + 10);
      var margin = 70;
      var gapY = Phaser.Math.Between(margin + gap / 2, H - margin - gap / 2);

      var topH = gapY - gap / 2;
      var botY = gapY + gap / 2;
      var botH = H - botY;

      var top = this.pipes.create(W + 40, topH / 2, "pipe");
      top.setDisplaySize(64, Math.max(40, topH));
      top.body.setAllowGravity(false);
      top.setImmovable(true);
      top.body.setSize(56, Math.max(40, topH));
      top.setFlipY(true);
      top.setDepth(10);
      top.setData("role", "pipe");

      var bot = this.pipes.create(W + 40, botY + botH / 2, "pipe");
      bot.setDisplaySize(64, Math.max(40, botH));
      bot.body.setAllowGravity(false);
      bot.setImmovable(true);
      bot.body.setSize(56, Math.max(40, botH));
      bot.setDepth(10);
      bot.setData("role", "pipe");

      var pair = {
        top: top,
        bot: bot,
        scored: false,
        moving: this.diff.movingPipes,
        phase: Math.random() * Math.PI * 2,
        baseGapY: gapY,
        gap: gap,
        amp: this.diff.movingPipes ? Phaser.Math.Between(18, 36) : 0
      };
      this.pipePairs.push(pair);

      // pickups in gap
      if (Math.random() < 0.7) {
        this.spawnPickup(W + 40, gapY, "drop");
      }
      if (Math.random() < 0.12) {
        this.spawnPickup(W + 40, gapY + Phaser.Math.Between(-40, 40), Math.random() < 0.5 ? "shield" : "rocket");
      }
    }

    spawnPickup(x, y, type) {
      var key = type === "drop" ? "raindrop" : (type === "shield" ? "shield-icon" : "rocket-icon");
      var p = this.pickups.create(x, y, key);
      p.body.setAllowGravity(false);
      p.setDepth(12);
      p.setData("type", type);
      p.setBlendMode(type === "drop" ? Phaser.BlendModes.ADD : Phaser.BlendModes.NORMAL);
      this.tweens.add({
        targets: p, scale: 1.2, duration: 400, yoyo: true, repeat: -1, ease: "Sine.easeInOut"
      });
    }

    onPickup(_frog, item) {
      if (!item.active || !this.alive) return;
      var type = item.getData("type");
      var x = item.x, y = item.y;
      item.destroy();

      if (type === "drop") {
        this.combo++;
        this.comboTimer = 3.5;
        var pts = Math.floor(15 * (1 + this.combo * 0.25) * this.diff.scoreMult * this.dangerMultiplier);
        this.score += pts;
        SFX.drop(this.combo);
        neonBurst(this, x, y, 0xfbbf24, 16);
        var floater = this.add.text(x, y, "+" + pts, {
          fontFamily: "Segoe UI, sans-serif", fontSize: "16px", fontStyle: "bold", color: "#fbbf24"
        }).setOrigin(0.5).setDepth(35);
        this.tweens.add({
          targets: floater, y: y - 40, alpha: 0, duration: 400, ease: "Cubic.easeOut",
          onComplete: function () { floater.destroy(); }
        });
      } else if (type === "shield") {
        this.shield = 1;
        this.shieldRing.setVisible(true);
        SFX.shield();
        neonBurst(this, x, y, 0xa78bfa, 18);
      } else if (type === "rocket") {
        this.rocketTimer = 3;
        this.invuln = Math.max(this.invuln, 3);
        this.rocketTrail.start();
        SFX.rocket();
        doShake(this.cameras.main, 100, 0.01);
        neonBurst(this, x, y, 0xf97316, 22);
      }
    }

    onHitPipe(_frog, pipe) {
      if (!this.alive || this.invuln > 0 || this.rocketTimer > 0) return;

      if (this.shield > 0) {
        this.shield = 0;
        this.shieldRing.setVisible(false);
        this.invuln = 1.0;
        SFX.shieldBreak();
        doShake(this.cameras.main, 120, 0.015);
        neonBurst(this, this.frog.x, this.frog.y, 0x60a5fa, 24);
        neonBurst(this, this.frog.x, this.frog.y, 0xa78bfa, 16);
        return;
      }

      this.die();
    }

    die() {
      if (!this.alive) return;
      this.alive = false;
      this.rocketTrail.stop();
      SFX.die();

      this.flash.setAlpha(0.75);
      this.tweens.add({ targets: this.flash, alpha: 0, duration: 450, ease: "Cubic.easeOut" });
      doShake(this.cameras.main, 200, 0.02);

      neonBurst(this, this.frog.x, this.frog.y, 0x34d399, 28);
      neonBurst(this, this.frog.x, this.frog.y, 0x22d3ee, 20);
      neonBurst(this, this.frog.x, this.frog.y, 0xf472b6, 16);

      this.tweens.add({
        targets: this.frog,
        angle: 180,
        scaleX: 0.2,
        scaleY: 0.2,
        alpha: 0,
        y: this.frog.y + 40,
        duration: 420,
        ease: "Cubic.easeIn"
      });
      this.frog.body.setVelocity(0, 0);
      this.frog.body.setAllowGravity(false);

      var distBonus = Math.floor(this.distance * 0.5 * this.diff.scoreMult);
      var finalScore = Math.floor(this.score + distBonus);
      var meta = {
        slug: "rainy-frog-dash",
        difficulty: this.diff.id,
        distance: Math.floor(this.distance),
        combo: this.combo,
        dangerPeak: Number(this.dangerMultiplier.toFixed(2))
      };
      try {
        if (typeof RNF !== "undefined" && RNF.submitScore) RNF.submitScore(finalScore, meta);
      } catch (_e) {}

      var self = this;
      this.time.delayedCall(520, function () {
        self.scene.launch("GameOverModal", {
          score: finalScore,
          distance: self.distance,
          combo: self.combo,
          danger: self.dangerMultiplier,
          diff: self.diff
        });
      });
    }

    update(_t, delta) {
      if (!this.alive) return;
      var dt = Math.min(0.05, delta / 1000);

      // dive pose when falling
      if (this.started && this.frog.body.velocity.y > 80) {
        this.frog.setAngle(Phaser.Math.Clamp(this.frog.body.velocity.y * 0.05, 12, 55));
      } else if (this.started && this.frog.body.velocity.y < -40) {
        this.frog.setAngle(Phaser.Math.Clamp(this.frog.body.velocity.y * 0.04, -35, -8));
      }

      // reset jumps near apex soft floor — treat as grounded when near bottom? Flappy style: reset jumps when going up from jump only once per air. Reset when velocity was positive and we jump again limit. Reset jumps when frog "lands" conceptually: when vy becomes positive after jump cycle we keep jumpsUsed until pass pipe... Better: reset jumps when frog is falling past a threshold after being low, or when rocket ends. Classic double jump: reset when "onGround". For flappy, reset jumps when frog crosses into upper half after falling, OR reset when velocity > 0 and we haven't used - actually simplest: reset jumpsUsed when frog.y is near bottom safe OR when rocket. Spec: double jump available - reset when frog starts falling after first jump and allow second; reset both when frog would touch ground line.

      if (this.frog.y > H - 30) {
        this.die();
        return;
      }
      if (this.frog.y < 10) {
        this.frog.y = 10;
        this.frog.setVelocityY(Math.max(0, this.frog.body.velocity.y));
      }

      // soft ground bounce reset jumps at y near bottom without dying? Spec says fall to bottom = death. So jumps reset only after successful jump cycle: reset when vy > 100 (falling) after using jumps? No - double jump means 2 in air. Reset when starting new "flap session" after landing - we don't land. So reset jumps when frog passes through a pipe gap (scored) or after 0.4s of falling enable? Better approach matching Casual "二段跳躍可用": jumpsUsed resets when frog is falling (vy>0) for more than 0.15s after last jump... Actually standard: max 2 jumps per airtime, reset when you would land. Without ground, reset when rocket ends or every time after score? Simplest good feel: reset jumpsUsed whenever frog velocity.y > 150 (diving) so you get one recovery flap + second, or reset on each pipe pass.

      if (this.frog.body.velocity.y > 200) {
        // allow refreshing one jump for recovery in casual/standard feel — only if all jumps used
        // Actually don't auto-reset mid-dive. Reset on pipe score:
      }

      this.shieldRing.setPosition(this.frog.x, this.frog.y);
      this.shieldRing.setVisible(this.shield > 0);

      if (!this.started) return;

      // danger from distance
      this.distance += this.scrollSpeed * dt * 0.1;
      this.dangerMultiplier = 1 + Math.log(1 + this.distance / 40) * 0.8;
      this.scrollSpeed = this.diff.scroll * (0.85 + this.dangerMultiplier * 0.35);
      if (this.rocketTimer > 0) this.scrollSpeed *= 1.55;

      this.cityOffset += this.scrollSpeed * dt * 0.4;
      this.redrawCity(this.cityOffset);

      // spawn pipes
      var spawnEvery = this.diff.spawnEvery / Math.max(0.7, 0.5 + this.dangerMultiplier * 0.5);
      this.spawnAcc += dt;
      if (this.spawnAcc >= spawnEvery) {
        this.spawnAcc = 0;
        this.spawnPipePair();
      }

      // move pipes & pickups
      var spd = this.scrollSpeed;
      var self = this;
      for (var i = this.pipePairs.length - 1; i >= 0; i--) {
        var pair = this.pipePairs[i];
        if (!pair.top.active) {
          this.pipePairs.splice(i, 1);
          continue;
        }
        pair.top.x -= spd * dt;
        pair.bot.x -= spd * dt;

        if (pair.moving) {
          pair.phase += dt * 1.6;
          var gy = pair.baseGapY + Math.sin(pair.phase) * pair.amp;
          var topH = Math.max(40, gy - pair.gap / 2);
          var botY = gy + pair.gap / 2;
          var botH = Math.max(40, H - botY);
          pair.top.setDisplaySize(64, topH);
          pair.top.y = topH / 2;
          pair.top.body.setSize(56, topH);
          pair.bot.setDisplaySize(64, botH);
          pair.bot.y = botY + botH / 2;
          pair.bot.body.setSize(56, botH);
        }

        if (!pair.scored && pair.top.x + 32 < this.frog.x) {
          pair.scored = true;
          this.jumpsUsed = 0; // refresh jumps after clearing a pipe
          var pts = Math.floor(50 * this.diff.scoreMult * this.dangerMultiplier * (1 + this.combo * 0.1));
          this.score += pts;
          SFX.drop(Math.min(this.combo + 2, 8));
        }

        if (pair.top.x < -80) {
          pair.top.destroy();
          pair.bot.destroy();
          this.pipePairs.splice(i, 1);
        }
      }

      this.pickups.getChildren().forEach(function (p) {
        if (!p.active) return;
        p.x -= spd * dt;
        if (p.x < -40) p.destroy();
      });

      // timers
      this.comboTimer = Math.max(0, this.comboTimer - dt);
      if (this.comboTimer <= 0) this.combo = 0;
      this.invuln = Math.max(0, this.invuln - dt);
      if (this.rocketTimer > 0) {
        this.rocketTimer = Math.max(0, this.rocketTimer - dt);
        if (this.rocketTimer <= 0) this.rocketTrail.stop();
        else if (Math.random() < 0.08) doShake(this.cameras.main, 30, 0.004);
      }

      // blink when invuln without rocket
      if (this.invuln > 0 && this.rocketTimer <= 0) {
        this.frog.setAlpha(Math.sin(this.invuln * 20) > 0 ? 1 : 0.4);
      } else {
        this.frog.setAlpha(1);
      }

      this.hudScore.setText("SCORE " + this.score.toLocaleString());
      this.hudDanger.setText("DANGER: x" + this.dangerMultiplier.toFixed(2));
      this.hudDist.setText(Math.floor(this.distance) + "m");
      this.hudCombo.setText(this.combo > 0 ? "COMBO x" + this.combo : "COMBO —");
      var powers = [];
      if (this.shield > 0) powers.push("護盾");
      if (this.rocketTimer > 0) powers.push("火箭 " + this.rocketTimer.toFixed(1) + "s");
      this.hudPower.setText(powers.join(" · "));
    }
  }

  /* ═══════════════ Game Over ═══════════════ */

  /* ═══════════════ LeaderboardScene（本遊戲獨立排行榜） ═══════════════ */
  var LeaderboardScene = (window.RNFPhaserLeaderboard && RNFPhaserLeaderboard.createLeaderboardScene)
    ? RNFPhaserLeaderboard.createLeaderboardScene({
        Phaser: Phaser,
        makeButton: makeButton,
        W: W,
        H: H,
        accent: 0x22d3ee,
        returnScene: "MainMenuScene",
        getDefaultDiff: function () {
          return (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard";
        }
      })
    : class LeaderboardSceneMissing extends Phaser.Scene {
        constructor() { super("LeaderboardScene"); }
        create() {
          this.add.text(W / 2, H / 2, "排行榜模組未載入", {
            fontFamily: "Microsoft JhengHei, Segoe UI", fontSize: "18px", color: "#f472b6"
          }).setOrigin(0.5);
        }
      };

  class GameOverModal extends Phaser.Scene {
    constructor() { super("GameOverModal"); }
    init(data) { this.payload = data || {}; }

    create() {
      var score = this.payload.score || 0;
      var diff = this.payload.diff || DIFF.standard;

      this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.72).setInteractive().setDepth(70);
      var panel = this.add.rectangle(W / 2, H / 2, 480, 460, 0x0b1220, 0.97)
        .setStrokeStyle(2, 0x22d3ee, 0.95).setScale(0.7).setAlpha(0).setDepth(71);

      var badge = this.add.text(W / 2, H / 2 - 168, "GAME OVER", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", fontStyle: "bold",
        color: "#f472b6", letterSpacing: 3
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      var title = this.add.text(W / 2, H / 2 - 128, "霓虹結算", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "30px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      var scoreTxt = this.add.text(W / 2, H / 2 - 48, score.toLocaleString(), {
        fontFamily: "Segoe UI, sans-serif", fontSize: "54px", fontStyle: "bold", color: "#67e8f9"
      }).setOrigin(0.5).setScale(0.4).setAlpha(0).setDepth(72);

      var meta = this.add.text(W / 2, H / 2 + 30,
        diff.label +
        "\n飛行 " + Math.floor(this.payload.distance || 0) + "m" +
        " · 最高 Combo x" + (this.payload.combo || 0) +
        " · DANGER x" + Number(this.payload.danger || 1).toFixed(2) +
        "\n已執行 RNF.submitScore → 排行榜", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "13px", color: "#94a3b8", align: "center", lineSpacing: 6
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 380, ease: "Back.easeOut" });
      this.tweens.add({ targets: [badge, title, meta], alpha: 1, duration: 300, ease: "Cubic.easeOut", delay: 80 });
      this.tweens.add({ targets: scoreTxt, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 100 });

      neonBurst(this, W / 2, H / 2 - 40, 0x22d3ee, 22);

      var self = this;
      var retry = makeButton(this, W / 2 - 110, H / 2 + 110, "再試一次", 0x22d3ee, function () {
        SFX.confirm();
        self.scene.stop("GameOverModal");
        self.scene.stop("GameScene");
        self.scene.start("GameScene", { difficulty: selectedDiff });
      }, 180);
      retry.bg.setDepth(73); retry.txt.setDepth(74);

      var settings = makeButton(this, W / 2 + 110, H / 2 + 110, "排行榜", 0x34d399, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        try { self.scene.stop("SettingsScene"); } catch (_e) {}
        self.scene.stop("GameScene");
        self.scene.start("LeaderboardScene", { difficulty: (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard" });
      }, 180);
      settings.bg.setDepth(73); settings.txt.setDepth(74);

      var menu = makeButton(this, W / 2, H / 2 + 172, "主選單", 0x64748b, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        self.scene.stop("SettingsScene");
        self.scene.stop("GameScene");
        self.scene.start("MainMenuScene");
      }, 200);
    }
  }

  var config = {
    type: Phaser.WEBGL,
    parent: "game-host",
    width: W,
    height: H,
    backgroundColor: "#04060c",
    banner: false,
    physics: {
      default: "arcade",
      arcade: { gravity: { y: 0 }, debug: false }
    },
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    fps: { target: 144, forceSet: false, smoothStep: true },
    scene: [BootScene, MainMenuScene, DifficultyScene, GameScene, GameOverModal, LeaderboardScene, SettingsScene]
  };

  try {
    window.__RAINY_FROG__ = new Phaser.Game(config);
  } catch (_e) {
    config.type = Phaser.AUTO;
    window.__RAINY_FROG__ = new Phaser.Game(config);
  }
})();
</script>
