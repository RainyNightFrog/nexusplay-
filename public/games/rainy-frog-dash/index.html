<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rainy Frog Dash · 雨夜飛天蛙</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #04060c; overflow: hidden;
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      touch-action: none;
    }
    #game-host { width: 100%; height: 100%; }

<body>
  <div id="game-host"></div>
<script>
/**
 * Rainy Frog Dash — Phaser 3 電競街機
 * Boot → MainMenu → Difficulty → Game → GameOverModal
 * 平衡：寬隙連跳／正確 hitbox（外觀與判定分離）
 * 內容：金雨滴路徑 · 護盾／火箭／慢動作／磁吸 · 近距刮擦 · 里程碑 · 天氣階段
 */
(function () {
  "use strict";

  if (typeof RNF !== "undefined" && RNF.init) RNF.init();

  var W = 960;
  var H = 540;
  var SETTINGS_KEY = "rnf:rainy-frog-dash:settings";

  var DIFF = {
    casual: {
      id: "casual",
      label: "Casual 輕鬆",
      desc: "寬管道 · 連跳飛躍 · 開局護盾 · 手感寬鬆",
      color: "#67e8f9",
      scoreMult: 1.0,
      gravity: 720,
      jump: -390,
      jumpCooldown: 0.02,
      gap: 250,
      scroll: 115,
      spawnEvery: 2.6,
      movingPipes: false,
      startShield: 1,
      gapFloor: 0.82,
      pickupRate: 0.85,
      powerRate: 0.22
    },
    standard: {
      id: "standard",
      label: "Standard 電競",
      desc: "標準間隙 · 連跳飛躍 · 道具豐富",
      color: "#a78bfa",
      scoreMult: 1.35,
      gravity: 820,
      jump: -410,
      jumpCooldown: 0.02,
      gap: 210,
      scroll: 140,
      spawnEvery: 2.2,
      movingPipes: false,
      startShield: 1,
      gapFloor: 0.78,
      pickupRate: 0.78,
      powerRate: 0.18
    },
    extreme: {
      id: "extreme",
      label: "Extreme 狂暴",
      desc: "較窄間隙 · 移動管 · 暴風階段 · 高分倍率",
      color: "#f472b6",
      scoreMult: 2.2,
      gravity: 960,
      jump: -430,
      jumpCooldown: 0.03,
      gap: 175,
      scroll: 170,
      spawnEvery: 1.85,
      movingPipes: true,
      startShield: 0,
      gapFloor: 0.74,
      pickupRate: 0.72,
      powerRate: 0.2
    }
  };

  var selectedDiff = "standard";
  var gameSettings = loadSettings();

  function loadSettings() {
    var base = { sfx: true, shake: true };
    try {
      if (typeof RNF !== "undefined" && RNF.getSettings) {
        var s = RNF.getSettings();
        base.sfx = (s.sfxVolume == null ? 0.75 : s.sfxVolume) > 0.02;
        base.shake = s.screenShake !== false;
      }
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) Object.assign(base, JSON.parse(raw));
    } catch (_e) {}
    return base;
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameSettings));
      if (typeof RNF !== "undefined" && RNF.setSettings) {
        RNF.setSettings({
          sfxVolume: gameSettings.sfx ? 0.75 : 0,
          screenShake: !!gameSettings.shake
        });
      }
    } catch (_e) {}
  }

  /* ── Audio ── */
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function rnfGameVolMul() {
    try {
      if (typeof RNF !== "undefined" && RNF.getGameVolume) return RNF.getGameVolume();
      if (typeof window !== "undefined" && typeof window.__RNF_GAME_VOLUME__ === "number") return window.__RNF_GAME_VOLUME__;
    } catch (_e) {}
    return 1;
  }
  function tone(freq, dur, type, vol, slide) {
    if (!gameSettings.sfx || rnfGameVolMul() <= 0) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime((vol || 0.1) * rnfGameVolMul(), t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  var SFX = {
    click: function () { tone(520, 0.05, "triangle", 0.07); },
    confirm: function () { tone(660, 0.07, "square", 0.09); tone(990, 0.08, "triangle", 0.07); },
    jump: function () { tone(320, 0.08, "sawtooth", 0.09, 560); },
    drop: function (n) {
      var f = 620 + Math.min(n || 0, 12) * 50;
      tone(f, 0.05, "square", 0.11);
      tone(f * 1.5, 0.07, "triangle", 0.08);
      tone(f * 2.1, 0.05, "sine", 0.05);
    },
    shield: function () {
      tone(220, 0.08, "sawtooth", 0.1); tone(440, 0.1, "square", 0.12);
      tone(880, 0.14, "sine", 0.1); tone(1320, 0.1, "triangle", 0.07);
    },
    shieldBreak: function () {
      tone(180, 0.12, "sawtooth", 0.14, 60); tone(90, 0.2, "triangle", 0.1, 40); tone(320, 0.08, "square", 0.08);
    },
    rocket: function () {
      tone(90, 0.18, "sawtooth", 0.15, 520); tone(160, 0.22, "square", 0.12, 700);
      tone(60, 0.3, "triangle", 0.1); tone(1100, 0.06, "sine", 0.06);
    },
    slow: function () {
      tone(420, 0.1, "sine", 0.1, 180); tone(280, 0.16, "triangle", 0.1, 120); tone(160, 0.22, "sine", 0.08, 90);
    },
    magnet: function () {
      tone(360, 0.06, "square", 0.1); tone(540, 0.08, "square", 0.1);
      tone(720, 0.1, "sine", 0.09); tone(980, 0.08, "triangle", 0.07);
    },
    gem: function () {
      tone(740, 0.05, "square", 0.1); tone(990, 0.07, "triangle", 0.11);
      tone(1480, 0.1, "sine", 0.09); tone(1980, 0.08, "sine", 0.05);
    },
    power: function () {
      tone(180, 0.06, "sawtooth", 0.1); tone(360, 0.08, "square", 0.12);
      tone(720, 0.12, "triangle", 0.1); tone(1440, 0.1, "sine", 0.08);
    },
    near: function () { tone(760, 0.05, "square", 0.08); tone(980, 0.06, "triangle", 0.06); },
    mile: function () { tone(440, 0.08, "square", 0.1); tone(660, 0.1, "triangle", 0.09); tone(880, 0.12, "sine", 0.08); },
    die: function () { tone(160, 0.22, "sawtooth", 0.14, 45); tone(70, 0.35, "triangle", 0.1); },
    toggle: function () { tone(440, 0.05, "triangle", 0.07); }
  };

  function doShake(cam, dur, intens) {
    if (!gameSettings.shake || !cam) return;
    cam.shake(dur, intens);
  }

  function neonBurst(scene, x, y, tint, count) {
    var n = Phaser.Math.Clamp(count || 20, 15, 40);
    var emitter = scene.add.particles(x, y, "spark", {
      speed: { min: 90, max: 440 },
      angle: { min: 0, max: 360 },
      lifespan: { min: 280, max: 780 },
      scale: { start: 1.45, end: 0 },
      alpha: { start: 1, end: 0 },
      gravityY: 50,
      blendMode: "ADD",
      tint: tint,
      emitting: false
    });
    emitter.explode(n);
    scene.time.delayedCall(900, function () { if (emitter.destroy) emitter.destroy(); });
  }

  function dualBurst(scene, x, y, c1, c2, n) {
    neonBurst(scene, x, y, c1, n || 24);
    neonBurst(scene, x, y, c2, Math.floor((n || 24) * 0.75));
  }

  function shockwave(scene, x, y, color, maxR) {
    var ring = scene.add.circle(x, y, 10, color, 0)
      .setStrokeStyle(5, color, 1).setDepth(44).setBlendMode(Phaser.BlendModes.ADD);
    scene.tweens.add({
      targets: ring,
      scale: (maxR || 100) / 10,
      alpha: 0,
      duration: 400,
      ease: "Cubic.easeOut",
      onComplete: function () { ring.destroy(); }
    });
  }

  function screenPunch(scene, color, alpha, shakeDur, shakeInt) {
    var flash = scene.add.rectangle(W / 2, H / 2, W, H, color, alpha || 0.38).setDepth(58);
    scene.tweens.add({
      targets: flash, alpha: 0, duration: 300, ease: "Cubic.easeOut",
      onComplete: function () { flash.destroy(); }
    });
    doShake(scene.cameras.main, shakeDur || 130, shakeInt || 0.016);
    try {
      scene.cameras.main.zoomTo(1.07, 70, "Cubic.easeOut", true, function (_c, done) {
        if (done) scene.cameras.main.zoomTo(1, 150, "Back.easeOut");
      });
    } catch (_e) {}
  }

  function powerBanner(scene, title, sub, colorHex) {
    var wrap = scene.add.container(W / 2, H * 0.27).setDepth(55).setAlpha(0).setScale(0.35);
    var col = Phaser.Display.Color.HexStringToColor(colorHex).color;
    var glow = scene.add.rectangle(0, 0, 460, 76, col, 0.18);
    var bar = scene.add.rectangle(0, 0, 440, 68, 0x020617, 0.88).setStrokeStyle(3, col, 1);
    var t1 = scene.add.text(0, -10, title, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "28px", fontStyle: "bold", color: "#ffffff",
      stroke: "#020617", strokeThickness: 4
    }).setOrigin(0.5);
    var t2 = scene.add.text(0, 18, sub, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "14px", fontStyle: "bold", color: colorHex,
      stroke: "#020617", strokeThickness: 2
    }).setOrigin(0.5);
    wrap.add([glow, bar, t1, t2]);
    scene.tweens.add({ targets: wrap, alpha: 1, scale: 1, duration: 300, ease: "Back.easeOut" });
    scene.tweens.add({
      targets: wrap, alpha: 0, y: H * 0.2, scale: 1.1, duration: 450, delay: 750, ease: "Cubic.easeIn",
      onComplete: function () { wrap.destroy(); }
    });
  }

  function floatText(scene, x, y, msg, color, size) {
    var floater = scene.add.text(x, y, msg, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: (size || 16) + "px",
      fontStyle: "bold",
      color: color || "#fbbf24",
      stroke: "#020617",
      strokeThickness: 3
    }).setOrigin(0.5).setDepth(45).setScale(0.55).setAlpha(0);
    scene.tweens.add({
      targets: floater, y: y - 54, alpha: 1, scale: 1.2, duration: 240, ease: "Back.easeOut"
    });
    scene.tweens.add({
      targets: floater, y: y - 96, alpha: 0, scale: 0.85, duration: 420, delay: 240, ease: "Cubic.easeOut",
      onComplete: function () { floater.destroy(); }
    });
  }

  function makeTextures(scene) {
    var g = scene.make.graphics({ x: 0, y: 0, add: false });

    g.clear();
    g.fillStyle(0x34d399, 1);
    g.fillEllipse(20, 18, 36, 28);
    g.fillStyle(0x6ee7b7, 1);
    g.fillCircle(12, 10, 7);
    g.fillCircle(28, 10, 7);
    g.fillStyle(0x0f172a, 1);
    g.fillCircle(12, 10, 3);
    g.fillCircle(28, 10, 3);
    g.fillStyle(0x22d3ee, 1);
    g.fillTriangle(36, 16, 48, 12, 48, 22);
    g.generateTexture("frog", 52, 36);

    g.clear();
    g.fillStyle(0xa78bfa, 1);
    g.fillRect(0, 0, 64, 200);
    g.fillStyle(0x22d3ee, 0.35);
    g.fillRect(0, 0, 10, 200);
    g.fillStyle(0xc4b5fd, 1);
    g.fillRect(-4, 0, 72, 18);
    g.generateTexture("pipe", 72, 200);

    g.clear();
    g.fillStyle(0x22d3ee, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark", 6, 6);

    g.clear();
    g.fillStyle(0x67e8f9, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark-cyan", 6, 6);

    g.clear();
    g.fillStyle(0xfbbf24, 1);
    g.fillCircle(8, 8, 7);
    g.fillStyle(0xfef08a, 1);
    g.fillCircle(6, 5, 3);
    g.fillStyle(0xffffff, 0.7);
    g.fillCircle(5, 4, 1.5);
    g.lineStyle(2, 0xf59e0b, 0.9);
    g.strokeCircle(8, 8, 7.5);
    g.generateTexture("raindrop", 16, 16);

    g.clear();
    g.fillStyle(0xf0abfc, 1);
    g.fillTriangle(16, 2, 28, 16, 16, 30);
    g.fillTriangle(16, 2, 4, 16, 16, 30);
    g.fillStyle(0xe879f9, 1);
    g.fillTriangle(16, 8, 22, 16, 16, 24);
    g.fillTriangle(16, 8, 10, 16, 16, 24);
    g.fillStyle(0xffffff, 0.85);
    g.fillCircle(13, 12, 2.5);
    g.generateTexture("gem", 32, 32);

    // 護盾：六角能量盾
    g.clear();
    g.lineStyle(3, 0xc4b5fd, 1);
    g.strokeCircle(24, 24, 18);
    g.lineStyle(2, 0x22d3ee, 0.9);
    g.strokeCircle(24, 24, 12);
    g.fillStyle(0xa78bfa, 0.55);
    g.fillTriangle(24, 8, 36, 18, 36, 30);
    g.fillTriangle(24, 8, 12, 18, 12, 30);
    g.fillTriangle(12, 30, 24, 40, 36, 30);
    g.fillStyle(0xe9d5ff, 0.95);
    g.fillCircle(24, 22, 5);
    g.fillStyle(0xffffff, 0.8);
    g.fillCircle(22, 20, 2);
    g.generateTexture("shield-icon", 48, 48);

    // 火箭：推進噴焰
    g.clear();
    g.fillStyle(0xf97316, 1);
    g.fillTriangle(8, 40, 24, 6, 40, 40);
    g.fillStyle(0xfbbf24, 1);
    g.fillTriangle(14, 36, 24, 14, 34, 36);
    g.fillStyle(0xffffff, 1);
    g.fillTriangle(18, 34, 24, 20, 30, 34);
    g.fillStyle(0xef4444, 1);
    g.fillTriangle(16, 40, 24, 48, 32, 40);
    g.fillStyle(0xfde68a, 1);
    g.fillTriangle(20, 40, 24, 46, 28, 40);
    g.generateTexture("rocket-icon", 48, 48);

    // 慢動作：時鐘＋凍結裂紋
    g.clear();
    g.fillStyle(0x0ea5e9, 0.35);
    g.fillCircle(24, 24, 20);
    g.lineStyle(3, 0x38bdf8, 1);
    g.strokeCircle(24, 24, 18);
    g.lineStyle(2, 0xe0f2fe, 1);
    g.lineBetween(24, 24, 24, 10);
    g.lineBetween(24, 24, 34, 28);
    g.fillStyle(0x7dd3fc, 1);
    g.fillCircle(24, 24, 3);
    g.fillStyle(0xffffff, 0.5);
    g.fillRect(6, 22, 8, 3);
    g.fillRect(34, 22, 8, 3);
    g.generateTexture("slow-icon", 48, 48);

    // 磁吸：電磁環
    g.clear();
    g.fillStyle(0x34d399, 0.25);
    g.fillCircle(24, 24, 20);
    g.lineStyle(4, 0x34d399, 1);
    g.strokeCircle(24, 24, 17);
    g.lineStyle(3, 0x6ee7b7, 1);
    g.strokeCircle(24, 24, 11);
    g.fillStyle(0xa7f3d0, 1);
    g.fillCircle(24, 24, 5);
    g.fillStyle(0xffffff, 0.95);
    g.fillCircle(24, 24, 2.2);
    g.fillStyle(0x34d399, 1);
    g.fillTriangle(38, 8, 46, 14, 40, 20);
    g.fillTriangle(10, 8, 2, 14, 8, 20);
    g.fillStyle(0x6ee7b7, 1);
    g.fillRect(20, 2, 8, 4);
    g.fillRect(20, 42, 8, 4);
    g.generateTexture("magnet-icon", 48, 48);

    g.clear();
    g.fillStyle(0xf97316, 1);
    g.fillCircle(5, 5, 5);
    g.fillStyle(0xfde68a, 1);
    g.fillCircle(4, 3, 2);
    g.generateTexture("flame", 10, 10);

    g.clear();
    g.fillStyle(0xfbbf24, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark-gold", 6, 6);

    g.clear();
    g.fillStyle(0xf472b6, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark-pink", 6, 6);

    g.destroy();
  }

  function pulseBtn(scene, targets) {
    scene.tweens.add({
      targets: targets, scale: 1.08, duration: 90, yoyo: true, ease: "Back.easeOut"
    });
  }

  function makeButton(scene, x, y, label, color, onClick, width) {
    var bw = width || 300;
    var bg = scene.add.rectangle(x, y, bw, 44, color, 0.2)
      .setStrokeStyle(2, color, 0.9)
      .setInteractive({ useHandCursor: true });
    var txt = scene.add.text(x, y, label, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "18px", fontStyle: "bold", color: "#e2e8f0"
    }).setOrigin(0.5);
    bg.on("pointerover", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1.05, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerout", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerdown", function () {
      pulseBtn(scene, [bg, txt]);
      SFX.click();
      onClick();
    });
    return { bg: bg, txt: txt };
  }

  /* ═══════════════ Boot ═══════════════ */
  class BootScene extends Phaser.Scene {
    constructor() { super("BootScene"); }
    create() {
      makeTextures(this);
      this.cameras.main.setBackgroundColor("#04060c");
      this.cameras.main.fadeIn(320, 4, 6, 12);
      var t = this.add.text(W / 2, H / 2 - 8, "RAINY FROG DASH", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "28px", fontStyle: "bold", color: "#22d3ee"
      }).setOrigin(0.5).setAlpha(0);
      this.add.text(W / 2, H / 2 + 28, "技能特效強化 · build frogJuice10", {
        fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif", fontSize: "13px", color: "#fbbf24"
      }).setOrigin(0.5);
      this.tweens.add({ targets: t, alpha: 1, scale: 1.04, duration: 400, ease: "Back.easeOut" });
      this.time.delayedCall(520, function () { this.scene.start("MainMenuScene"); }, [], this);
    }
  }

  /* ═══════════════ Main Menu ═══════════════ */
  class MainMenuScene extends Phaser.Scene {
    constructor() { super("MainMenuScene"); }
    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(200, 4, 6, 12);

      for (var i = 0; i < 40; i++) {
        var drop = this.add.rectangle(
          Phaser.Math.Between(0, W), Phaser.Math.Between(0, H),
          2, Phaser.Math.Between(8, 18), 0x22d3ee, Phaser.Math.FloatBetween(0.08, 0.25)
        ).setAngle(18);
        this.tweens.add({
          targets: drop, y: drop.y + 80, alpha: 0.05,
          duration: Phaser.Math.Between(800, 1600), yoyo: true, repeat: -1, ease: "Sine.easeInOut"
        });
      }

      var badge = this.add.text(W / 2, 78, "RAINYNIGHTFROG · CYBER ARCADE", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "11px", fontStyle: "bold",
        color: "#22d3ee", letterSpacing: 3
      }).setOrigin(0.5).setAlpha(0);

      var title = this.add.text(W / 2, 140, "RAINY FROG DASH", {
        fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
        fontSize: "38px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setScale(0.65).setAlpha(0);

      var sub = this.add.text(W / 2, 195, "雨夜飛天蛙 · 連跳飛躍 · 護盾／火箭／慢動作／磁吸 · 里程碑", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "14px", color: "#94a3b8"
      }).setOrigin(0.5).setAlpha(0);

      this.tweens.add({ targets: badge, alpha: 1, y: 88, duration: 400, ease: "Cubic.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 50 });
      this.tweens.add({ targets: sub, alpha: 1, duration: 380, ease: "Cubic.easeOut", delay: 120 });

      var self = this;
      makeButton(this, W / 2, 300, "開始遊戲 START", 0x22d3ee, function () {
        SFX.confirm();
        self.cameras.main.fadeOut(160, 4, 6, 12);
        self.time.delayedCall(170, function () { self.scene.start("DifficultyScene"); });
      });
      makeButton(this, W / 2, 370, "設定 SETTINGS", 0xa78bfa, function () {
        self.scene.launch("SettingsScene");
      });
      makeButton(this, W / 2, 440, "排行榜", 0x34d399, function () {
        self.scene.start("LeaderboardScene", { difficulty: (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard" });
      });
      makeButton(this, W / 2, 504, "操作說明", 0x64748b, function () {
        if (window.RNFPhaserHelp && RNFPhaserHelp.showHelpOverlay) {
          RNFPhaserHelp.showHelpOverlay(self,

  /* ═══════════════ Game ═══════════════ */
  class GameScene extends Phaser.Scene {
    constructor() { super("GameScene"); }

    init(data) {
      this.diffKey = (data && data.difficulty) || selectedDiff || "standard";
      this.diff = DIFF[this.diffKey] || DIFF.standard;
      selectedDiff = this.diffKey;
    }

    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#050814");
      this.cameras.main.fadeIn(180, 4, 6, 12);

      this.score = 0;
      this.combo = 0;
      this.bestCombo = 0;
      this.comboTimer = 0;
      this.distance = 0;
      this.elapsedTime = 0;
      this.dangerMultiplier = 1;
      this.alive = true;
      this.started = false;
      this.shield = this.diff.startShield || 0;
      this.rocketTimer = 0;
      this.slowTimer = 0;
      this.magnetTimer = 0;
      this.invuln = 0;
      this.spawnAcc = 0;
      this.pipesCleared = 0;
      this.pipeStreak = 0;
      this.nearMisses = 0;
      this.scrollSpeed = this.diff.scroll;
      this.pipePairs = [];
      this.milestonesHit = {};
      this.weather = "calm";
      this.timeScale = 1;

      this.drawSkyline();
      this.createRain();

      this.physics.world.gravity.y = this.diff.gravity;

      // 青蛙：固定小判定，絕不因 scale 變形（擠壓只做在外觀容器）
      this.frog = this.physics.add.image(220, H / 2, "frog");
      this.frog.setCollideWorldBounds(false);
      this.frog.setDepth(20);
      this.frog.body.setAllowGravity(false);
      this.frog.body.setBounce(0, 0);
      this.frog.body.setSize(20, 16);
      this.frog.body.setOffset(16, 10);
      this.frog.body.allowRotation = false;

      this.pipeHits = this.physics.add.group();
      this.pickups = this.physics.add.group();

      this.physics.add.overlap(this.frog, this.pipeHits, this.onHitPipe, null, this);
      this.physics.add.overlap(this.frog, this.pickups, this.onPickup, null, this);

      this.shieldRing = this.add.circle(this.frog.x, this.frog.y, 30, 0xa78bfa, 0.12)
        .setStrokeStyle(3, 0xc4b5fd, 1).setDepth(19).setVisible(this.shield > 0)
        .setBlendMode(Phaser.BlendModes.ADD);
      this.shieldRing2 = this.add.circle(this.frog.x, this.frog.y, 40, 0x22d3ee, 0)
        .setStrokeStyle(2, 0x67e8f9, 0.85).setDepth(18).setVisible(this.shield > 0)
        .setBlendMode(Phaser.BlendModes.ADD);

      this.rocketTrail = this.add.particles(0, 0, "flame", {
        speed: { min: 80, max: 260 },
        angle: { min: 140, max: 220 },
        lifespan: { min: 180, max: 420 },
        scale: { start: 2.2, end: 0 },
        alpha: { start: 1, end: 0 },
        blendMode: "ADD",
        frequency: 10,
        quantity: 2,
        follow: this.frog,
        followOffset: { x: -22, y: 0 },
        emitting: false
      }).setDepth(18);
      this.rocketSparks = this.add.particles(0, 0, "spark-gold", {
        speed: { min: 60, max: 220 },
        angle: { min: 150, max: 210 },
        lifespan: { min: 200, max: 500 },
        scale: { start: 1.2, end: 0 },
        alpha: { start: 0.95, end: 0 },
        blendMode: "ADD",
        frequency: 14,
        follow: this.frog,
        followOffset: { x: -16, y: 0 },
        emitting: false
      }).setDepth(18);

      this.magnetAura = this.add.circle(this.frog.x, this.frog.y, 48, 0x34d399, 0)
        .setStrokeStyle(2, 0x6ee7b7, 0.7).setDepth(17).setVisible(false)
        .setBlendMode(Phaser.BlendModes.ADD);
      this.slowVignette = this.add.rectangle(W / 2, H / 2, W, H, 0x0284c7, 0).setDepth(6);

      this.flash = this.add.rectangle(W / 2, H / 2, W, H, 0xff2244, 0).setDepth(60);
      this.weatherTint = this.add.rectangle(W / 2, H / 2, W, H, 0x1e3a8a, 0).setDepth(4);
      this.createHud();
      this.bindInput();

      this.hudHint = this.add.text(W / 2, H / 2 + 60, "點擊／空白 開始 · 可持續連跳飛躍", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "16px", color: "#94a3b8"
      }).setOrigin(0.5).setDepth(40);
    }

    drawSkyline() {
      var g = this.add.graphics().setDepth(0);
      g.fillStyle(0x050814, 1);
      g.fillRect(0, 0, W, H);
      this.cityGfx = this.add.graphics().setDepth(1);
      this.cityOffset = 0;
      this.redrawCity(0);
      this.add.rectangle(W / 2, H - 8, W, 16, 0x0ea5e9, 0.25).setDepth(5);
      this.add.rectangle(W / 2, 8, W, 16, 0xa78bfa, 0.15).setDepth(5);
    }

    redrawCity(off) {
      var g = this.cityGfx;
      g.clear();
      for (var i = -1; i < 14; i++) {
        var x = ((i * 90 - off) % (W + 90));
        if (x < -80) x += W + 90;
        var h = 60 + ((i * 37) % 120);
        g.fillStyle(0x22d3ee, 0.06);
        g.fillRect(x, H - 24 - h, 50, h);
        g.fillStyle(0xfbbf24, 0.15);
        if ((i + Math.floor(off)) % 3 < 1) g.fillRect(x + 10, H - 24 - h + 20, 6, 8);
      }
    }

    createRain() {
      this.rain = this.add.particles(0, 0, "spark-cyan", {
        x: { min: 0, max: W + 100 },
        y: { min: -40, max: 0 },
        speedY: { min: 220, max: 420 },
        speedX: { min: -70, max: -30 },
        scale: { start: 0.35, end: 0.1 },
        alpha: { start: 0.28, end: 0 },
        lifespan: 1400,
        quantity: 1,
        frequency: 28,
        blendMode: "ADD"
      }).setDepth(3);
    }

    setWeather(mode) {
      if (this.weather === mode) return;
      this.weather = mode;
      if (mode === "calm") {
        this.rain.frequency = 28;
        this.rain.quantity = 1;
        this.tweens.add({ targets: this.weatherTint, alpha: 0, duration: 500, ease: "Cubic.easeOut" });
      } else if (mode === "rain") {
        this.rain.frequency = 16;
        this.rain.quantity = 2;
        this.tweens.add({ targets: this.weatherTint, alpha: 0.08, duration: 500, ease: "Cubic.easeOut" });
      } else {
        this.rain.frequency = 10;
        this.rain.quantity = 3;
        this.tweens.add({ targets: this.weatherTint, alpha: 0.16, duration: 500, ease: "Cubic.easeOut" });
        floatText(this, W / 2, 90, "暴風來襲！", "#f472b6", 20);
      }
    }

    createHud() {
      this.hudScore = this.add.text(14, 10, "SCORE 0", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "16px", fontStyle: "bold", color: "#67e8f9"
      }).setDepth(40);
      this.hudDanger = this.add.text(14, 32, "DANGER x1.00", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "14px", fontStyle: "bold", color: "#f472b6"
      }).setDepth(40);
      this.hudDist = this.add.text(W / 2, 10, "0m", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "15px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5, 0).setDepth(40);
      this.hudCombo = this.add.text(W / 2, 32, "COMBO —", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", color: "#fbbf24"
      }).setOrigin(0.5, 0).setDepth(40);
      this.hudDiff = this.add.text(W - 14, 10, this.diff.label, {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif", fontSize: "13px", color: this.diff.color
      }).setOrigin(1, 0).setDepth(40);
      this.hudPower = this.add.text(W - 14, 32, "", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif", fontSize: "12px", color: "#94a3b8"
      }).setOrigin(1, 0).setDepth(40);
      this.hudStreak = this.add.text(14, 54, "STREAK 0", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "12px", color: "#a78bfa"
      }).setDepth(40);
    }

    bindInput() {
      var self = this;
      this.keySpace = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
      this.keyUp = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.UP);
      this.keyW = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.W);
      try {
        this.input.keyboard.addCapture([
          Phaser.Input.Keyboard.KeyCodes.SPACE,
          Phaser.Input.Keyboard.KeyCodes.UP,
          Phaser.Input.Keyboard.KeyCodes.W
        ]);
      } catch (_e) {}
      this.input.on("pointerdown", function () { self.tryJump(); });
    }

    tryJump() {
      if (!this.alive) return;
      ensureAudio();

      if (!this.started) {
        this.started = true;
        this.frog.body.setAllowGravity(true);
        this.hudHint.setVisible(false);
        this.invuln = Math.max(this.invuln, 2.0);
        this.spawnAcc = -0.6;
        floatText(this, this.frog.x, this.frog.y - 36, "起飛！", "#67e8f9", 18);
      }

      // 無次數、無冷卻——每次輸入都立即給向上速度
      var vy = this.diff.jump;
      if (this.slowTimer > 0) vy *= 0.92;
      this.frog.setVelocityY(vy);
      this.frog.setAngle(-22);
      neonBurst(this, this.frog.x, this.frog.y + 14, 0x22d3ee, 15);
      SFX.jump();
      doShake(this.cameras.main, 35, 0.0035);
    }

    /** 前幾管較寬，之後才逐漸收緊 */
    currentGap() {
      var introBoost = this.pipesCleared < 4 ? 1.35 : (this.pipesCleared < 8 ? 1.15 : 1);
      var shrink = Math.pow(Math.max(1, this.dangerMultiplier * 0.22 + 0.78), 0.3);
      var gap = (this.diff.gap * introBoost) / shrink;
      var floor = this.diff.gap * this.diff.gapFloor;
      return Phaser.Math.Clamp(gap, floor, this.diff.gap + 50);
    }

    makePipeHit(x, y, w, h) {
      var hit = this.add.rectangle(x, y, w, Math.max(8, h), 0xff0000, 0);
      this.physics.add.existing(hit);
      hit.body.setAllowGravity(false);
      hit.body.setImmovable(true);
      hit.body.moves = false;
      hit.body.setSize(w, Math.max(8, h));
      hit.setData("role", "pipe");
      this.pipeHits.add(hit);
      return hit;
    }

    syncPipePair(pair, x, gapY) {
      var gap = pair.gap;
      var topH = Math.max(8, gapY - gap / 2);
      var botY = gapY + gap / 2;
      var botH = Math.max(8, H - botY);
      var w = pair.hitW;

      pair.topVis.setPosition(x, topH / 2);
      pair.topVis.setDisplaySize(64, Math.max(8, topH));
      pair.botVis.setPosition(x, botY + botH / 2);
      pair.botVis.setDisplaySize(64, Math.max(8, botH));

      pair.topHit.setPosition(x, topH / 2);
      pair.topHit.setSize(w, Math.max(8, topH));
      pair.topHit.body.setSize(w, Math.max(8, topH));
      pair.topHit.body.reset(x, topH / 2);

      pair.botHit.setPosition(x, botY + botH / 2);
      pair.botHit.setSize(w, Math.max(8, botH));
      pair.botHit.body.setSize(w, Math.max(8, botH));
      pair.botHit.body.reset(x, botY + botH / 2);

      pair.baseGapYLive = gapY;
    }

    spawnPipePair() {
      var gap = this.currentGap();
      var margin = 90;
      var prevY = this.pipePairs.length
        ? this.pipePairs[this.pipePairs.length - 1].baseGapY
        : H / 2;
      var maxShift = this.pipesCleared < 4 ? 55 : (this.pipesCleared < 8 ? 80 : 100);
      var gapY = Phaser.Math.Clamp(
        prevY + Phaser.Math.Between(-maxShift, maxShift),
        margin + gap / 2,
        H - margin - gap / 2
      );

      var topH = gapY - gap / 2;
      var botY = gapY + gap / 2;
      var botH = H - botY;
      var tintCycle = [0xa78bfa, 0x22d3ee, 0x34d399, 0xf472b6];
      var tint = tintCycle[this.pipesCleared % tintCycle.length];
      var x = W + 50;
      var hitW = 40;

      // 外觀與判定分離：拉伸圖片不會放大 hitbox
      var topVis = this.add.image(x, topH / 2, "pipe")
        .setDisplaySize(64, Math.max(8, topH)).setFlipY(true).setDepth(10).setTint(tint);
      var botVis = this.add.image(x, botY + botH / 2, "pipe")
        .setDisplaySize(64, Math.max(8, botH)).setDepth(10).setTint(tint);

      var topHit = this.makePipeHit(x, topH / 2, hitW, topH);
      var botHit = this.makePipeHit(x, botY + botH / 2, hitW, botH);

      var moveNow = this.diff.movingPipes && this.pipesCleared >= 5;
      var pair = {
        topVis: topVis,
        botVis: botVis,
        topHit: topHit,
        botHit: botHit,
        scored: false,
        moving: moveNow,
        phase: Math.random() * Math.PI * 2,
        baseGapY: gapY,
        baseGapYLive: gapY,
        gap: gap,
        hitW: hitW,
        x: x,
        amp: moveNow ? Phaser.Math.Between(10, 18) : 0
      };
      this.pipePairs.push(pair);
      this.spawnGapRewards(x, gapY, gap);
    }

    spawnGapRewards(x, gapY, gap) {
      if (Math.random() < this.diff.pickupRate) {
        var pattern = Math.random();
        if (pattern < 0.45) {
          this.spawnPickup(x, gapY, "drop");
        } else if (pattern < 0.75) {
          this.spawnPickup(x - 18, gapY - 22, "drop");
          this.spawnPickup(x + 8, gapY, "drop");
          this.spawnPickup(x - 18, gapY + 22, "drop");
        } else {
          this.spawnPickup(x, gapY - gap * 0.18, "drop");
          this.spawnPickup(x + 22, gapY, "gem");
          this.spawnPickup(x, gapY + gap * 0.18, "drop");
        }
      }
      if (Math.random() < this.diff.powerRate) {
        var roll = Math.random();
        var type = roll < 0.28 ? "shield" : (roll < 0.52 ? "rocket" : (roll < 0.76 ? "slow" : "magnet"));
        this.spawnPickup(x + Phaser.Math.Between(-8, 28), gapY + Phaser.Math.Between(-28, 28), type);
      }
    }

    spawnPickup(x, y, type) {
      var keyMap = {
        drop: "raindrop",
        gem: "gem",
        shield: "shield-icon",
        rocket: "rocket-icon",
        slow: "slow-icon",
        magnet: "magnet-icon"
      };
      var isPower = type === "shield" || type === "rocket" || type === "slow" || type === "magnet" || type === "gem";
      var p = this.pickups.create(x, y, keyMap[type] || "raindrop");
      p.body.setAllowGravity(false);
      p.setDepth(12);
      p.setData("type", type);
      p.setBlendMode(Phaser.BlendModes.ADD);
      p.setScale(isPower ? 0.95 : 1.1);

      var auraColor = {
        shield: 0xa78bfa, rocket: 0xf97316, slow: 0x38bdf8, magnet: 0x34d399, gem: 0xe879f9, drop: 0xfbbf24
      }[type] || 0xfbbf24;
      var aura = this.add.circle(x, y, isPower ? 26 : 14, auraColor, 0.18)
        .setStrokeStyle(2, auraColor, 0.85).setDepth(11).setBlendMode(Phaser.BlendModes.ADD);
      p.setData("aura", aura);

      this.tweens.add({
        targets: [p, aura],
        scale: isPower ? 1.2 : 1.35,
        duration: 380,
        yoyo: true,
        repeat: -1,
        ease: "Sine.easeInOut"
      });
      if (isPower) {
        this.tweens.add({
          targets: p, angle: 360, duration: 2200, repeat: -1, ease: "Linear"
        });
      }
      this.tweens.add({
        targets: [p, aura],
        y: y - 10,
        duration: 700,
        yoyo: true,
        repeat: -1,
        ease: "Sine.easeInOut"
      });
    }

    playPowerGet(type, x, y) {
      var meta = {
        shield: { title: "ENERGY SHIELD", sub: "護盾展開 · 擋下致命一擊", color: "#c4b5fd", tint: 0xa78bfa, tint2: 0x22d3ee },
        rocket: { title: "ROCKET OVERDRIVE", sub: "火箭衝刺 · 無敵疾行", color: "#fb923c", tint: 0xf97316, tint2: 0xfbbf24 },
        slow: { title: "TIME BREAK", sub: "時間裂縫 · 全域慢放", color: "#7dd3fc", tint: 0x38bdf8, tint2: 0xe0f2fe },
        magnet: { title: "MAGNET STORM", sub: "電磁場 · 吸爆金雨滴", color: "#6ee7b7", tint: 0x34d399, tint2: 0xa7f3d0 },
        gem: { title: "VOID GEM", sub: "紫晶爆擊 · 高分連擊", color: "#f0abfc", tint: 0xe879f9, tint2: 0xffffff }
      }[type];
      if (!meta) return;
      SFX.power();
      powerBanner(this, meta.title, meta.sub, meta.color);
      screenPunch(this, meta.tint, 0.42, 150, 0.02);
      shockwave(this, x, y, meta.tint, 120);
      shockwave(this, x, y, meta.tint2, 70);
      dualBurst(this, x, y, meta.tint, meta.tint2, 30);
    }

    onPickup(_frog, item) {
      if (!item.active || !this.alive) return;
      var type = item.getData("type");
      var x = item.x, y = item.y;
      var aura = item.getData("aura");
      if (aura && aura.destroy) aura.destroy();
      item.destroy();

      if (type === "drop") {
        this.combo++;
        this.bestCombo = Math.max(this.bestCombo, this.combo);
        this.comboTimer = 4.2;
        var pts = Math.floor(18 * (1 + this.combo * 0.22) * this.diff.scoreMult * (0.85 + this.dangerMultiplier * 0.15));
        this.score += pts;
        SFX.drop(this.combo);
        dualBurst(this, x, y, 0xfbbf24, 0xfde68a, 18);
        shockwave(this, x, y, 0xfbbf24, 40);
        floatText(this, x, y, "+" + pts, "#fde68a", 16);
      } else if (type === "gem") {
        this.combo += 2;
        this.bestCombo = Math.max(this.bestCombo, this.combo);
        this.comboTimer = 4.5;
        var gpts = Math.floor(70 * (1 + this.combo * 0.2) * this.diff.scoreMult * (0.85 + this.dangerMultiplier * 0.15));
        this.score += gpts;
        SFX.gem();
        this.playPowerGet("gem", x, y);
        floatText(this, x, y - 20, "+" + gpts + " GEM", "#f0abfc", 20);
      } else if (type === "shield") {
        this.shield = Math.min(2, this.shield + 1);
        this.shieldRing.setVisible(true);
        this.shieldRing2.setVisible(true);
        SFX.shield();
        this.playPowerGet("shield", x, y);
        floatText(this, x, y - 18, "護盾 x" + this.shield, "#e9d5ff", 18);
      } else if (type === "rocket") {
        this.rocketTimer = 2.8;
        this.invuln = Math.max(this.invuln, 2.8);
        this.rocketTrail.start();
        this.rocketSparks.start();
        SFX.rocket();
        this.playPowerGet("rocket", x, y);
        floatText(this, x, y - 18, "OVERDRIVE!", "#fdba74", 18);
      } else if (type === "slow") {
        this.slowTimer = 3.5;
        SFX.slow();
        this.playPowerGet("slow", x, y);
        floatText(this, x, y - 18, "時間裂縫", "#bae6fd", 18);
      } else if (type === "magnet") {
        this.magnetTimer = 4.5;
        this.magnetAura.setVisible(true);
        SFX.magnet();
        this.playPowerGet("magnet", x, y);
        floatText(this, x, y - 18, "電磁場 ON", "#a7f3d0", 18);
      }
    }

    onHitPipe(_frog, pipe) {
      if (!this.alive || this.invuln > 0 || this.rocketTimer > 0) return;

      if (this.shield > 0) {
        this.shield -= 1;
        this.shieldRing.setVisible(this.shield > 0);
        if (this.shieldRing2) this.shieldRing2.setVisible(this.shield > 0);
        this.invuln = 1.25;
        this.pipeStreak = 0;
        SFX.shieldBreak();
        doShake(this.cameras.main, 140, 0.02);
        screenPunch(this, 0x60a5fa, 0.35, 140, 0.018);
        shockwave(this, this.frog.x, this.frog.y, 0xa78bfa, 110);
        dualBurst(this, this.frog.x, this.frog.y, 0x60a5fa, 0xa78bfa, 28);
        powerBanner(this, "SHIELD BREAK", "護盾抵擋 · 繼續衝刺", "#93c5fd");
        return;
      }

      this.die();
    }

    checkMilestones() {
      var marks = [
        { m: 50, label: "50m 起飛", bonus: 80, gift: null },
        { m: 120, label: "120m 雨夜", bonus: 160, gift: "shield" },
        { m: 220, label: "220m 疾行", bonus: 280, gift: "slow" },
        { m: 350, label: "350m 傳說", bonus: 450, gift: "rocket" },
        { m: 500, label: "500m 蛙神", bonus: 800, gift: "gem" }
      ];
      for (var i = 0; i < marks.length; i++) {
        var mk = marks[i];
        if (this.distance >= mk.m && !this.milestonesHit[mk.m]) {
          this.milestonesHit[mk.m] = true;
          var pts = Math.floor(mk.bonus * this.diff.scoreMult);
          this.score += pts;
          SFX.mile();
          doShake(this.cameras.main, 90, 0.01);
          neonBurst(this, this.frog.x, this.frog.y, 0x22d3ee, 24);
          floatText(this, W / 2, 120, mk.label + "  +" + pts, "#67e8f9", 22);
          if (mk.gift === "shield") {
            this.shield = Math.min(2, this.shield + 1);
            this.shieldRing.setVisible(true);
            this.shieldRing2.setVisible(true);
            this.playPowerGet("shield", this.frog.x, this.frog.y);
          } else if (mk.gift === "slow") {
            this.slowTimer = Math.max(this.slowTimer, 2.5);
            this.playPowerGet("slow", this.frog.x, this.frog.y);
          } else if (mk.gift === "rocket") {
            this.rocketTimer = Math.max(this.rocketTimer, 2.2);
            this.invuln = Math.max(this.invuln, 2.2);
            this.rocketTrail.start();
            this.rocketSparks.start();
            this.playPowerGet("rocket", this.frog.x, this.frog.y);
          } else if (mk.gift === "gem") {
            this.combo += 3;
            this.comboTimer = 4;
            this.playPowerGet("gem", this.frog.x, this.frog.y);
          }
        }
      }
    }

    die() {
      if (!this.alive) return;
      this.alive = false;
      this.rocketTrail.stop();
      if (this.rocketSparks) this.rocketSparks.stop();
      SFX.die();

      this.flash.setAlpha(0.75);
      this.tweens.add({ targets: this.flash, alpha: 0, duration: 450, ease: "Cubic.easeOut" });
      doShake(this.cameras.main, 200, 0.02);

      neonBurst(this, this.frog.x, this.frog.y, 0x34d399, 28);
      neonBurst(this, this.frog.x, this.frog.y, 0x22d3ee, 20);
      neonBurst(this, this.frog.x, this.frog.y, 0xf472b6, 16);

      this.tweens.add({
        targets: this.frog,
        angle: 180,
        scaleX: 0.2,
        scaleY: 0.2,
        alpha: 0,
        y: this.frog.y + 40,
        duration: 420,
        ease: "Cubic.easeIn"
      });
      this.frog.body.setVelocity(0, 0);
      this.frog.body.setAllowGravity(false);

      var distBonus = Math.floor(this.distance * 0.55 * this.diff.scoreMult);
      var streakBonus = Math.floor(this.pipeStreak * 12 * this.diff.scoreMult);
      var nearBonus = Math.floor(this.nearMisses * 25 * this.diff.scoreMult);
      var finalScore = Math.floor(this.score + distBonus + streakBonus + nearBonus);
      var meta = {
        slug: "rainy-frog-dash",
        difficulty: this.diff.id,
        distance: Math.floor(this.distance),
        combo: this.bestCombo,
        streak: this.pipeStreak,
        nearMisses: this.nearMisses,
        dangerPeak: Number(this.dangerMultiplier.toFixed(2))
      };
      try {
        if (typeof RNF !== "undefined" && RNF.submitScore) RNF.submitScore(finalScore, meta);
      } catch (_e) {}

      var self = this;
      this.time.delayedCall(520, function () {
        self.scene.launch("GameOverModal", {
          score: finalScore,
          distance: self.distance,
          combo: self.bestCombo,
          streak: self.pipeStreak,
          near: self.nearMisses,
          danger: self.dangerMultiplier,
          diff: self.diff
        });
      });
    }

    update(_t, delta) {
      if (!this.alive) return;
      var rawDt = Math.min(0.05, delta / 1000);
      var dt = rawDt * (this.slowTimer > 0 ? 0.62 : 1);

      // 鍵盤 JustDown：每一下空白／↑／W 都觸發跳躍（不依賴 keydown 事件）
      if (
        Phaser.Input.Keyboard.JustDown(this.keySpace) ||
        Phaser.Input.Keyboard.JustDown(this.keyUp) ||
        Phaser.Input.Keyboard.JustDown(this.keyW)
      ) {
        this.tryJump();
      }

      // 每幀鎖定青蛙判定，避免旋轉／縮放污染
      if (this.frog.body) {
        this.frog.body.setSize(20, 16);
        this.frog.body.setOffset(16, 10);
      }

      if (this.started && this.frog.body.velocity.y > 80) {
        this.frog.setAngle(Phaser.Math.Clamp(this.frog.body.velocity.y * 0.05, 12, 55));
      } else if (this.started && this.frog.body.velocity.y < -40) {
        this.frog.setAngle(Phaser.Math.Clamp(this.frog.body.velocity.y * 0.04, -35, -8));
      }

      // 頂／底：有護盾／無敵時柔彈，否則撞底死亡
      if (this.frog.y > H - 22) {
        if (this.invuln > 0 || this.rocketTimer > 0 || this.shield > 0) {
          this.frog.y = H - 24;
          this.frog.setVelocityY(this.diff.jump * 0.75);
          if (this.shield > 0 && this.invuln <= 0 && this.rocketTimer <= 0) {
            this.shield -= 1;
            this.shieldRing.setVisible(this.shield > 0);
            if (this.shieldRing2) this.shieldRing2.setVisible(this.shield > 0);
            this.invuln = 0.8;
            SFX.shieldBreak();
            dualBurst(this, this.frog.x, this.frog.y, 0x60a5fa, 0xa78bfa, 20);
          }
        } else {
          this.die();
          return;
        }
      }
      if (this.frog.y < 16) {
        this.frog.y = 16;
        this.frog.setVelocityY(Math.max(40, Math.abs(this.frog.body.velocity.y) * 0.35));
      }

      this.shieldRing.setPosition(this.frog.x, this.frog.y);
      this.shieldRing.setVisible(this.shield > 0);
      this.shieldRing.setAlpha(0.4 + Math.sin((_t || 0) / 90) * 0.2);
      if (this.shieldRing2) {
        this.shieldRing2.setPosition(this.frog.x, this.frog.y);
        this.shieldRing2.setVisible(this.shield > 0);
        this.shieldRing2.setAlpha(0.55 + Math.sin((_t || 0) / 70) * 0.25);
        this.shieldRing2.setScale(1 + Math.sin((_t || 0) / 110) * 0.08);
      }
      if (this.magnetAura) {
        this.magnetAura.setPosition(this.frog.x, this.frog.y);
        this.magnetAura.setVisible(this.magnetTimer > 0);
        if (this.magnetTimer > 0) {
          this.magnetAura.setScale(1.05 + Math.sin((_t || 0) / 80) * 0.15);
          this.magnetAura.setAlpha(0.5 + Math.sin((_t || 0) / 60) * 0.25);
        }
      }
      if (this.slowVignette) {
        this.slowVignette.setAlpha(this.slowTimer > 0 ? 0.14 + Math.sin((_t || 0) / 100) * 0.04 : 0);
      }

      if (!this.started) return;

      this.elapsedTime += rawDt;
      this.dangerMultiplier = 1 + Math.log(1 + this.elapsedTime / 30) * 0.8;
      // 難度基底疊加
      var diffBias = this.diffKey === "casual" ? 0.85 : (this.diffKey === "extreme" ? 1.18 : 1);
      var effectiveDanger = 1 + (this.dangerMultiplier - 1) * diffBias;

      this.scrollSpeed = this.diff.scroll * (0.9 + effectiveDanger * 0.22);
      if (this.rocketTimer > 0) this.scrollSpeed *= 1.4;
      if (this.slowTimer > 0) this.scrollSpeed *= 0.7;

      if (effectiveDanger < 1.35) this.setWeather("calm");
      else if (effectiveDanger < 1.9) this.setWeather("rain");
      else this.setWeather("storm");

      this.distance += this.scrollSpeed * dt * 0.1;
      this.checkMilestones();

      this.cityOffset += this.scrollSpeed * dt * 0.4;
      this.redrawCity(this.cityOffset);

      var spawnEvery = this.diff.spawnEvery / Math.max(0.82, 0.72 + effectiveDanger * 0.28);
      if (this.pipesCleared < 2) spawnEvery *= 1.2;
      this.spawnAcc += dt;
      if (this.spawnAcc >= spawnEvery) {
        this.spawnAcc = 0;
        this.spawnPipePair();
      }

      var spd = this.scrollSpeed;
      var self = this;
      for (var i = this.pipePairs.length - 1; i >= 0; i--) {
        var pair = this.pipePairs[i];
        if (!pair.topHit || !pair.topHit.active) {
          this.pipePairs.splice(i, 1);
          continue;
        }
        pair.x -= spd * dt;
        var gy = pair.baseGapY;
        if (pair.moving) {
          pair.phase += dt * 1.1;
          gy = pair.baseGapY + Math.sin(pair.phase) * pair.amp;
        }
        this.syncPipePair(pair, pair.x, gy);

        if (!pair.scored && pair.x + 24 < this.frog.x) {
          pair.scored = true;
          this.pipesCleared++;
          this.pipeStreak++;
          var streakMul = 1 + Math.min(this.pipeStreak, 12) * 0.06;
          var pts = Math.floor(45 * this.diff.scoreMult * (0.9 + effectiveDanger * 0.12) * streakMul * (1 + this.combo * 0.08));
          this.score += pts;
          SFX.drop(Math.min(this.combo + 2, 8));
          floatText(this, this.frog.x + 36, this.frog.y - 20, "+" + pts, "#67e8f9", 14);

          var liveGapY = pair.baseGapYLive || pair.baseGapY;
          var edgeDist = Math.min(
            Math.abs(this.frog.y - (liveGapY - pair.gap / 2)),
            Math.abs(this.frog.y - (liveGapY + pair.gap / 2))
          );
          if (edgeDist < 22) {
            this.nearMisses++;
            var nearPts = Math.floor(40 * this.diff.scoreMult * (1 + this.pipeStreak * 0.05));
            this.score += nearPts;
            SFX.near();
            neonBurst(this, this.frog.x, this.frog.y, 0xf472b6, 18);
            floatText(this, this.frog.x, this.frog.y + 28, "NEAR +" + nearPts, "#f9a8d4", 15);
            doShake(this.cameras.main, 60, 0.008);
          }
        }

        if (pair.x < -90) {
          pair.topVis.destroy();
          pair.botVis.destroy();
          pair.topHit.destroy();
          pair.botHit.destroy();
          this.pipePairs.splice(i, 1);
        }
      }

      this.pickups.getChildren().forEach(function (p) {
        if (!p.active) return;
        if (self.magnetTimer > 0 && (p.getData("type") === "drop" || p.getData("type") === "gem")) {
          var dx = self.frog.x - p.x;
          var dy = self.frog.y - p.y;
          var dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (dist < 240) {
            p.x += (dx / dist) * 320 * dt;
            p.y += (dy / dist) * 320 * dt;
          }
        }
        p.x -= spd * dt;
        var aura = p.getData("aura");
        if (aura && aura.active) {
          aura.x = p.x;
          aura.y = p.y;
        }
        if (p.x < -40) {
          if (aura && aura.destroy) aura.destroy();
          p.destroy();
        }
      });

      this.comboTimer = Math.max(0, this.comboTimer - rawDt);
      if (this.comboTimer <= 0) this.combo = 0;
      this.invuln = Math.max(0, this.invuln - rawDt);
      this.slowTimer = Math.max(0, this.slowTimer - rawDt);
      this.magnetTimer = Math.max(0, this.magnetTimer - rawDt);
      if (this.magnetTimer <= 0 && this.magnetAura) this.magnetAura.setVisible(false);
      if (this.rocketTimer > 0) {
        this.rocketTimer = Math.max(0, this.rocketTimer - rawDt);
        if (this.rocketTimer <= 0) {
          this.rocketTrail.stop();
          if (this.rocketSparks) this.rocketSparks.stop();
        } else {
          if (Math.random() < 0.12) doShake(this.cameras.main, 28, 0.005);
          if (Math.random() < 0.35) {
            var line = this.add.rectangle(
              this.frog.x - Phaser.Math.Between(40, 120),
              this.frog.y + Phaser.Math.Between(-28, 28),
              Phaser.Math.Between(30, 70), 2, 0xfbbf24, 0.7
            ).setDepth(16).setBlendMode(Phaser.BlendModes.ADD);
            this.tweens.add({
              targets: line, x: line.x - 80, alpha: 0, duration: 180, ease: "Cubic.easeOut",
              onComplete: function () { line.destroy(); }
            });
          }
        }
      }

      if (this.invuln > 0 && this.rocketTimer <= 0) {
        this.frog.setAlpha(Math.sin(this.invuln * 20) > 0 ? 1 : 0.4);
      } else {
        this.frog.setAlpha(1);
      }

      this.hudScore.setText("SCORE " + this.score.toLocaleString());
      this.hudDanger.setText("DANGER x" + effectiveDanger.toFixed(2));
      this.hudDist.setText(Math.floor(this.distance) + "m");
      this.hudCombo.setText(this.combo > 0 ? "COMBO x" + this.combo : "COMBO —");
      this.hudStreak.setText("STREAK " + this.pipeStreak + (this.nearMisses ? " · NEAR " + this.nearMisses : ""));
      var powers = [];
      if (this.shield > 0) powers.push("護盾x" + this.shield);
      if (this.rocketTimer > 0) powers.push("火箭 " + this.rocketTimer.toFixed(1) + "s");
      if (this.slowTimer > 0) powers.push("慢放 " + this.slowTimer.toFixed(1) + "s");
      if (this.magnetTimer > 0) powers.push("磁吸 " + this.magnetTimer.toFixed(1) + "s");
      this.hudPower.setText(powers.join(" · "));
    }
  }

  /* ═══════════════ Leaderboard ═══════════════ */
  var LeaderboardScene = (window.RNFPhaserLeaderboard && RNFPhaserLeaderboard.createLeaderboardScene)
    ? RNFPhaserLeaderboard.createLeaderboardScene({
        Phaser: Phaser,
        makeButton: makeButton,
        W: W,
        H: H,
        accent: 0x22d3ee,
        returnScene: "MainMenuScene",
        getDefaultDiff: function () {
          return (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard";
        }
      })
    : class LeaderboardSceneMissing extends Phaser.Scene {
        constructor() { super("LeaderboardScene"); }
        create() {
          this.add.text(W / 2, H / 2, "排行榜模組未載入", {
            fontFamily: "Microsoft JhengHei, Segoe UI", fontSize: "18px", color: "#f472b6"
          }).setOrigin(0.5);
        }
      };

  class GameOverModal extends Phaser.Scene {
    constructor() { super("GameOverModal"); }
    init(data) { this.payload = data || {}; }

    create() {
      var score = this.payload.score || 0;
      var diff = this.payload.diff || DIFF.standard;

      this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.72).setInteractive().setDepth(70);
      var panel = this.add.rectangle(W / 2, H / 2, 480, 500, 0x0b1220, 0.97)
        .setStrokeStyle(2, 0x22d3ee, 0.95).setScale(0.7).setAlpha(0).setDepth(71);

      var badge = this.add.text(W / 2, H / 2 - 168, "GAME OVER", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", fontStyle: "bold",
        color: "#f472b6", letterSpacing: 3
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      var title = this.add.text(W / 2, H / 2 - 128, "霓虹結算", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "30px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      var scoreTxt = this.add.text(W / 2, H / 2 - 48, score.toLocaleString(), {
        fontFamily: "Segoe UI, sans-serif", fontSize: "54px", fontStyle: "bold", color: "#67e8f9"
      }).setOrigin(0.5).setScale(0.4).setAlpha(0).setDepth(72);

      var meta = this.add.text(W / 2, H / 2 + 30,
        diff.label +
        "\n飛行 " + Math.floor(this.payload.distance || 0) + "m" +
        " · Combo x" + (this.payload.combo || 0) +
        " · 連過 " + (this.payload.streak || 0) +
        " · 刮擦 " + (this.payload.near || 0) +
        "\nDANGER x" + Number(this.payload.danger || 1).toFixed(2), {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "13px", color: "#94a3b8", align: "center", lineSpacing: 6
      }).setOrigin(0.5).setAlpha(0).setDepth(72);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 380, ease: "Back.easeOut" });
      this.tweens.add({ targets: [badge, title, meta], alpha: 1, duration: 300, ease: "Cubic.easeOut", delay: 80 });
      this.tweens.add({ targets: scoreTxt, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 100 });

      neonBurst(this, W / 2, H / 2 - 40, 0x22d3ee, 22);

      var self = this;
      var retry = makeButton(this, W / 2 - 110, H / 2 + 105, "再試一次", 0x22d3ee, function () {
        SFX.confirm();
        self.scene.stop("GameOverModal");
        self.scene.stop("GameScene");
        self.scene.start("GameScene", { difficulty: selectedDiff });
      }, 180);
      retry.bg.setDepth(73); retry.txt.setDepth(74);

      var board = makeButton(this, W / 2 + 110, H / 2 + 105, "排行榜", 0x34d399, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        try { self.scene.stop("SettingsScene"); } catch (_e) {}
        self.scene.stop("GameScene");
        self.scene.start("LeaderboardScene", { difficulty: (typeof selectedDiff !== "undefined" && selectedDiff) ? selectedDiff : "standard" });
      }, 180);
      board.bg.setDepth(73); board.txt.setDepth(74);

      var menu = makeButton(this, W / 2, H / 2 + 165, "主選單", 0x64748b, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        self.scene.stop("SettingsScene");
        self.scene.stop("GameScene");
        self.scene.start("MainMenuScene");
      }, 200);
      menu.bg.setDepth(73); menu.txt.setDepth(74);
    }
  }

  var config = {
    type: Phaser.WEBGL,
    parent: "game-host",
    width: W,
    height: H,
    backgroundColor: "#04060c",
    banner: false,
    physics: {
      default: "arcade",
      arcade: { gravity: { y: 0 }, debug: false }
    },
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    fps: { target: 144, forceSet: false, smoothStep: true },
    scene: [BootScene, MainMenuScene, DifficultyScene, GameScene, GameOverModal, LeaderboardScene, SettingsScene]
  };

  try {
    window.__RAINY_FROG__ = new Phaser.Game(config);
  } catch (_e) {
    config.type = Phaser.AUTO;
    window.__RAINY_FROG__ = new Phaser.Game(config);
  }
  window.__RNF_ARCADE_GAME__ = window.__RAINY_FROG__;
  if (typeof RNF !== "undefined" && RNF.setShowMenuHandler) {
    RNF.setShowMenuHandler(function () {
      try {
        var g = window.__RNF_ARCADE_GAME__ || window.__RAINY_FROG__;
        if (!g || !g.scene) return;
        ["GameOverModal", "SettingsScene", "LeaderboardScene", "DifficultyScene", "GameScene"].forEach(function (key) {
          try { if (g.scene.getScene(key)) g.scene.stop(key); } catch (_s) {}
        });
        g.scene.start("MainMenuScene");
      } catch (_err) {}
    });
  }
})();
</script>
</body>
