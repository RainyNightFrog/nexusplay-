<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Snake Extreme · 霓虹極速貪食蛇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #04060c; overflow: hidden;
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      touch-action: none;
    }
    #game-host { width: 100%; height: 100%; }
  </style>
  <script src="/sdk/phaser.min.js"></script>
  <script src="/sdk/rnf-i18n.js?v=20260730a"></script>
  <script src="/sdk/rnf-game-packs.js?v=20260730a"></script>
  <script src="/sdk/rnf-game-sdk.js?v=20260730a"></script>
</head>
<body>
  <div id="game-host"></div>
<script>
/**
 * Neon Snake Extreme — Phaser 3 商業級電競重構
 * Boot → MainMenu → Difficulty → Game → GameOverModal (+ Settings)
 * Juice：拖尾／震屏／星塵／Bullet Time／死亡白閃
 * 難度：Casual（穿牆）／Standard／Extreme（縮小地圖＋黑洞）
 */
(function () {
  "use strict";

  if (typeof RNF !== "undefined" && RNF.init) RNF.init();

  var W = 960;
  var H = 540;
  var CELL = 20;
  var SETTINGS_KEY = "rnf:neon-snake-extreme:settings";

  var DIFF = {
    casual: {
      id: "casual",
      label: "Casual 輕鬆",
      desc: "寬鬆撞牆（穿牆循環）· 較慢起步",
      color: "#67e8f9",
      baseSpeed: 0.20,
      scoreMult: 1.0,
      wrapWalls: true,
      shrinkMap: false,
      blackHoles: 0,
      foods: 1
    },
    standard: {
      id: "standard",
      label: "Standard 電競",
      desc: "標準極速 · 撞牆即死",
      color: "#a78bfa",
      baseSpeed: 0.15,
      scoreMult: 1.35,
      wrapWalls: false,
      shrinkMap: false,
      blackHoles: 0,
      foods: 1
    },
    extreme: {
      id: "extreme",
      label: "Extreme 狂暴",
      desc: "縮小地圖 · 隨機黑洞障礙",
      color: "#f472b6",
      baseSpeed: 0.11,
      scoreMult: 2.5,
      wrapWalls: false,
      shrinkMap: true,
      blackHoles: 8,
      foods: 2
    }
  };

  var selectedDiff = "standard";
  var gameSettings = loadSettings();

  function loadSettings() {
    var base = { sfx: true, shake: true };
    try {
      if (typeof RNF !== "undefined" && RNF.getSettings) {
        var s = RNF.getSettings();
        base.sfx = (s.sfxVolume == null ? 0.75 : s.sfxVolume) > 0.02;
        base.shake = s.screenShake !== false;
      }
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) Object.assign(base, JSON.parse(raw));
    } catch (_e) {}
    return base;
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameSettings));
      if (typeof RNF !== "undefined" && RNF.setSettings) {
        RNF.setSettings({
          sfxVolume: gameSettings.sfx ? 0.75 : 0,
          screenShake: !!gameSettings.shake
        });
      }
    } catch (_e) {}
  }

  /* ── Web Audio ── */
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, dur, type, vol, slide) {
    if (!gameSettings.sfx) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.11, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  var SFX = {
    click: function () { tone(520, 0.05, "triangle", 0.07); },
    confirm: function () { tone(660, 0.07, "square", 0.09); tone(990, 0.09, "triangle", 0.07); },
    eat: function (combo) {
      var f = 720 + Math.min(combo || 1, 12) * 48;
      tone(f, 0.08, "square", 0.12);
      tone(f * 1.33, 0.1, "triangle", 0.09);
    },
    bullet: function () { tone(240, 0.16, "sine", 0.08, 120); },
    die: function () { tone(180, 0.2, "sawtooth", 0.14, 50); tone(90, 0.35, "triangle", 0.1, 40); },
    toggle: function () { tone(440, 0.05, "triangle", 0.07); }
  };

  function doShake(cam, dur, intens) {
    if (!gameSettings.shake || !cam) return;
    cam.shake(dur, intens);
  }

  function neonBurst(scene, x, y, key, count) {
    var n = Phaser.Math.Clamp(count || 20, 15, 30);
    var emitter = scene.add.particles(x, y, key, {
      speed: { min: 60, max: 320 },
      angle: { min: 0, max: 360 },
      lifespan: { min: 260, max: 700 },
      scale: { start: 1.15, end: 0 },
      alpha: { start: 1, end: 0 },
      gravityY: 40,
      blendMode: "ADD",
      emitting: false
    });
    emitter.explode(n);
    scene.time.delayedCall(800, function () { if (emitter && emitter.destroy) emitter.destroy(); });
  }

  function makeTextures(scene) {
    var g = scene.make.graphics({ x: 0, y: 0, add: false });

    g.clear();
    g.fillStyle(0x22d3ee, 1);
    g.fillRoundedRect(1, 1, CELL - 2, CELL - 2, 5);
    g.fillStyle(0xffffff, 0.45);
    g.fillCircle(7, 7, 3);
    g.generateTexture("seg-head", CELL, CELL);

    g.clear();
    g.fillStyle(0x67e8f9, 1);
    g.fillRoundedRect(2, 2, CELL - 4, CELL - 4, 4);
    g.generateTexture("seg-body", CELL, CELL);

    g.clear();
    g.fillStyle(0xa78bfa, 1);
    g.fillRoundedRect(3, 3, CELL - 6, CELL - 6, 3);
    g.generateTexture("seg-tail", CELL, CELL);

    g.clear();
    g.fillStyle(0xfbbf24, 1);
    g.fillCircle(CELL / 2, CELL / 2, 8);
    g.fillStyle(0xffffff, 0.55);
    g.fillCircle(CELL / 2 - 3, CELL / 2 - 3, 3);
    g.generateTexture("food", CELL, CELL);

    g.clear();
    g.fillStyle(0x22d3ee, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark-cyan", 6, 6);

    g.clear();
    g.fillStyle(0xa78bfa, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark-violet", 6, 6);

    g.clear();
    g.fillStyle(0xfbbf24, 1);
    g.fillCircle(3, 3, 3);
    g.generateTexture("spark-gold", 6, 6);

    g.clear();
    g.fillStyle(0xf472b6, 1);
    g.fillCircle(4, 4, 4);
    g.generateTexture("spark-pink", 8, 8);

    g.clear();
    g.fillStyle(0x0a0614, 1);
    g.fillCircle(14, 14, 13);
    g.lineStyle(2, 0xf472b6, 0.9);
    g.strokeCircle(14, 14, 12);
    g.lineStyle(1, 0xa78bfa, 0.7);
    g.strokeCircle(14, 14, 7);
    g.generateTexture("blackhole", 28, 28);

    g.destroy();
  }

  function pulseBtn(scene, targets) {
    scene.tweens.add({
      targets: targets,
      scale: 1.08,
      duration: 90,
      yoyo: true,
      ease: "Back.easeOut"
    });
  }

  function makeButton(scene, x, y, label, color, onClick, width) {
    var bw = width || 300;
    var bg = scene.add.rectangle(x, y, bw, 50, color, 0.2)
      .setStrokeStyle(2, color, 0.9)
      .setInteractive({ useHandCursor: true });
    var txt = scene.add.text(x, y, label, {
      fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
      fontSize: "18px",
      fontStyle: "bold",
      color: "#e2e8f0"
    }).setOrigin(0.5);
    bg.on("pointerover", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1.05, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerout", function () {
      scene.tweens.add({ targets: [bg, txt], scale: 1, duration: 120, ease: "Cubic.easeOut" });
    });
    bg.on("pointerdown", function () {
      pulseBtn(scene, [bg, txt]);
      SFX.click();
      onClick();
    });
    return { bg: bg, txt: txt };
  }

  /* ═══════════════ BootScene ═══════════════ */
  class BootScene extends Phaser.Scene {
    constructor() { super("BootScene"); }
    create() {
      makeTextures(this);
      this.cameras.main.setBackgroundColor("#04060c");
      this.cameras.main.fadeIn(350, 4, 6, 12);
      var t = this.add.text(W / 2, H / 2 - 10, "NEON SNAKE EXTREME", {
        fontFamily: "Segoe UI, sans-serif",
        fontSize: "28px",
        fontStyle: "bold",
        color: "#22d3ee"
      }).setOrigin(0.5).setAlpha(0);
      this.add.text(W / 2, H / 2 + 28, "Phaser 3 · RainyNightFrog", {
        fontFamily: "Segoe UI, sans-serif",
        fontSize: "13px",
        color: "#64748b"
      }).setOrigin(0.5);
      this.tweens.add({ targets: t, alpha: 1, scale: 1.04, duration: 400, ease: "Back.easeOut" });
      this.time.delayedCall(550, function () {
        this.scene.start("MainMenuScene");
      }, [], this);
    }
  }

  /* ═══════════════ MainMenuScene ═══════════════ */
  class MainMenuScene extends Phaser.Scene {
    constructor() { super("MainMenuScene"); }
    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(220, 4, 6, 12);

      for (var i = 0; i < 48; i++) {
        var star = this.add.circle(
          Phaser.Math.Between(0, W), Phaser.Math.Between(0, H),
          Phaser.Math.Between(1, 2), 0x22d3ee, Phaser.Math.FloatBetween(0.12, 0.5)
        );
        this.tweens.add({
          targets: star, alpha: 0.08, duration: Phaser.Math.Between(700, 1600),
          yoyo: true, repeat: -1, ease: "Sine.easeInOut"
        });
      }

      var badge = this.add.text(W / 2, 88, "RAINYNIGHTFROG · CYBER ARCADE", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "11px", fontStyle: "bold",
        color: "#22d3ee", letterSpacing: 3
      }).setOrigin(0.5).setAlpha(0);

      var title = this.add.text(W / 2, 150, "NEON SNAKE EXTREME", {
        fontFamily: "Segoe UI, Microsoft JhengHei, sans-serif",
        fontSize: "42px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setScale(0.65).setAlpha(0);

      var sub = this.add.text(W / 2, 205, "霓虹極速貪食蛇 · 震屏星塵 · 險境 Bullet Time · 動態危險曲線", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "15px", color: "#94a3b8"
      }).setOrigin(0.5).setAlpha(0);

      this.tweens.add({ targets: badge, alpha: 1, y: 98, duration: 420, ease: "Cubic.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, scale: 1, duration: 500, ease: "Back.easeOut", delay: 60 });
      this.tweens.add({ targets: sub, alpha: 1, duration: 400, ease: "Cubic.easeOut", delay: 140 });

      var self = this;
      makeButton(this, W / 2, 300, "開始遊戲 START", 0x22d3ee, function () {
        SFX.confirm();
        self.cameras.main.fadeOut(200, 4, 6, 12);
        self.time.delayedCall(210, function () { self.scene.start("DifficultyScene"); });
      });
      makeButton(this, W / 2, 368, "設定 SETTINGS", 0xa78bfa, function () {
        self.scene.launch("SettingsScene");
      });
      makeButton(this, W / 2, 436, "操作說明", 0x64748b, function () {
        if (self.helpTxt) return;
        self.helpTxt = self.add.text(W / 2, 500,
          "鍵盤 WASD／方向鍵轉向 · 手機滑動轉向 · 連續進食累積 Combo", {
          fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
          fontSize: "13px", color: "#c4b5fd"
        }).setOrigin(0.5).setAlpha(0);
        self.tweens.add({ targets: self.helpTxt, alpha: 1, y: 492, duration: 280, ease: "Cubic.easeOut" });
      }, 240);
    }
  }

  /* ═══════════════ DifficultyScene ═══════════════ */
  class DifficultyScene extends Phaser.Scene {
    constructor() { super("DifficultyScene"); }
    create() {
      this.cameras.main.setBackgroundColor("#060a14");
      this.cameras.main.fadeIn(180, 4, 6, 12);

      var head = this.add.text(W / 2, 70, "選擇難度", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "34px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setScale(0.7).setAlpha(0);
      this.tweens.add({ targets: head, alpha: 1, scale: 1, duration: 380, ease: "Back.easeOut" });

      this.add.text(W / 2, 118, "進入關卡後危險倍率仍會隨時間遞增", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "14px", color: "#64748b"
      }).setOrigin(0.5);

      var self = this;
      var keys = ["casual", "standard", "extreme"];
      keys.forEach(function (key, i) {
        var d = DIFF[key];
        var col = Phaser.Display.Color.HexStringToColor(d.color).color;
        var y = 190 + i * 88;
        makeButton(self, W / 2, y, d.label, col, function () {
          selectedDiff = key;
          SFX.confirm();
          self.cameras.main.fadeOut(180, 4, 6, 12);
          self.time.delayedCall(190, function () {
            self.scene.start("GameScene", { difficulty: key });
          });
        });
        self.add.text(W / 2, y + 32, d.desc + " · 分數 x" + d.scoreMult.toFixed(2), {
          fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
          fontSize: "12px", color: "#94a3b8"
        }).setOrigin(0.5);
      });

      makeButton(this, W / 2, 490, "返回", 0x475569, function () {
        self.scene.start("MainMenuScene");
      }, 160);
    }
  }

  /* ═══════════════ SettingsScene（覆蓋層） ═══════════════ */
  class SettingsScene extends Phaser.Scene {
    constructor() { super("SettingsScene"); }
    create() {
      var dim = this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.75).setInteractive();
      var panel = this.add.rectangle(W / 2, H / 2, 420, 300, 0x0b1220, 0.98)
        .setStrokeStyle(2, 0x22d3ee, 0.85).setScale(0.75).setAlpha(0);

      var title = this.add.text(W / 2, H / 2 - 110, "設定選單", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "26px", fontStyle: "bold", color: "#e2e8f0"
      }).setOrigin(0.5).setAlpha(0);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 320, ease: "Back.easeOut" });
      this.tweens.add({ targets: title, alpha: 1, duration: 280, ease: "Cubic.easeOut", delay: 60 });

      var self = this;
      var sfxLabel = gameSettings.sfx ? "音效：開" : "音效：關";
      var shakeLabel = gameSettings.shake ? "震屏：開" : "震屏：關";

      var sfxBtn = makeButton(this, W / 2, H / 2 - 20, sfxLabel, 0x22d3ee, function () {
        gameSettings.sfx = !gameSettings.sfx;
        saveSettings();
        SFX.toggle();
        sfxBtn.txt.setText(gameSettings.sfx ? "音效：開" : "音效：關");
      }, 260);

      var shakeBtn = makeButton(this, W / 2, H / 2 + 50, shakeLabel, 0xa78bfa, function () {
        gameSettings.shake = !gameSettings.shake;
        saveSettings();
        SFX.toggle();
        shakeBtn.txt.setText(gameSettings.shake ? "震屏：開" : "震屏：關");
      }, 260);

      makeButton(this, W / 2, H / 2 + 120, "關閉", 0x64748b, function () {
        self.scene.stop("SettingsScene");
      }, 180);

      dim.on("pointerdown", function () { self.scene.stop("SettingsScene"); });
    }
  }

  /* ═══════════════ GameScene ═══════════════ */
  class GameScene extends Phaser.Scene {
    constructor() { super("GameScene"); }

    init(data) {
      this.diffKey = (data && data.difficulty) || selectedDiff || "standard";
      this.diff = DIFF[this.diffKey] || DIFF.standard;
      selectedDiff = this.diffKey;
    }

    create() {
      ensureAudio();
      this.cameras.main.setBackgroundColor("#050814");
      this.cameras.main.fadeIn(200, 4, 6, 12);

      // 地圖尺寸（Extreme 縮小）
      this.cols = Math.floor(W / CELL);
      this.rows = Math.floor(H / CELL);
      this.originX = 0;
      this.originY = 0;
      if (this.diff.shrinkMap) {
        this.cols = 36;
        this.rows = 20;
        this.originX = Math.floor((W - this.cols * CELL) / 2);
        this.originY = Math.floor((H - this.rows * CELL) / 2);
      }

      this.score = 0;
      this.combo = 0;
      this.maxCombo = 0;
      this.comboTimer = 0;
      this.elapsedTime = 0;
      this.dangerMultiplier = 1;
      this.alive = true;
      this.moveAcc = 0;
      this.moveProgress = 0;
      this.stepInterval = this.diff.baseSpeed;
      this.bulletTime = 0;
      this.nearMiss = false;
      this.timeScale = 1;
      this.dir = { x: 1, y: 0 };
      this.nextDir = { x: 1, y: 0 };
      this.dirQueue = [];
      this.foods = [];
      this.holes = [];
      this.segSprites = [];
      this.foodSprites = [];
      this.holeSprites = [];

      var cx = Math.floor(this.cols / 2);
      var cy = Math.floor(this.rows / 2);
      this.snake = [
        { x: cx, y: cy },
        { x: cx - 1, y: cy },
        { x: cx - 2, y: cy },
        { x: cx - 3, y: cy }
      ];

      this.drawBoard();
      this.spawnBlackHoles();
      this.ensureFoods();
      this.buildSnakeSprites();
      this.bindInput();
      this.createHud();
      this.createTrailEmitter();

      // 微光波圖層（Bullet Time）
      this.vignette = this.add.rectangle(W / 2, H / 2, W, H, 0x22d3ee, 0)
        .setDepth(40).setBlendMode(Phaser.BlendModes.ADD);
      this.flash = this.add.rectangle(W / 2, H / 2, W, H, 0xffffff, 0).setDepth(50);
    }

    drawBoard() {
      var g = this.add.graphics().setDepth(0);
      // 場外暗角
      g.fillStyle(0x02040a, 1);
      g.fillRect(0, 0, W, H);
      // 場內
      g.fillStyle(0x070b16, 1);
      g.fillRect(this.originX, this.originY, this.cols * CELL, this.rows * CELL);
      g.lineStyle(1, 0x22d3ee, 0.08);
      for (var x = 0; x <= this.cols; x++) {
        var px = this.originX + x * CELL;
        g.lineBetween(px, this.originY, px, this.originY + this.rows * CELL);
      }
      for (var y = 0; y <= this.rows; y++) {
        var py = this.originY + y * CELL;
        g.lineBetween(this.originX, py, this.originX + this.cols * CELL, py);
      }
      g.lineStyle(2, 0x22d3ee, 0.45);
      g.strokeRect(this.originX + 1, this.originY + 1, this.cols * CELL - 2, this.rows * CELL - 2);
      this.boardGfx = g;
    }

    cellToWorld(cx, cy) {
      return {
        x: this.originX + cx * CELL + CELL / 2,
        y: this.originY + cy * CELL + CELL / 2
      };
    }

    createHud() {
      this.hudScore = this.add.text(16, 10, "SCORE 0", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "16px", fontStyle: "bold", color: "#67e8f9"
      }).setDepth(30).setScrollFactor(0);
      this.hudDanger = this.add.text(16, 32, "DANGER x1.00", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "14px", fontStyle: "bold", color: "#f472b6"
      }).setDepth(30);
      this.hudCombo = this.add.text(W / 2, 10, "COMBO x0", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "15px", fontStyle: "bold", color: "#fbbf24"
      }).setOrigin(0.5, 0).setDepth(30);
      this.hudDiff = this.add.text(W - 16, 10, this.diff.label, {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif", fontSize: "13px", color: this.diff.color
      }).setOrigin(1, 0).setDepth(30);
      this.hudBt = this.add.text(W - 16, 32, "", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "12px", fontStyle: "bold", color: "#f472b6"
      }).setOrigin(1, 0).setDepth(30);
      this.hudTime = this.add.text(W / 2, 32, "0.0s", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "12px", color: "#64748b"
      }).setOrigin(0.5, 0).setDepth(30);
    }

    createTrailEmitter() {
      this.trail = this.add.particles(0, 0, "spark-cyan", {
        speed: { min: 10, max: 40 },
        lifespan: { min: 280, max: 520 },
        scale: { start: 0.9, end: 0 },
        alpha: { start: 0.75, end: 0 },
        blendMode: "ADD",
        frequency: 28,
        quantity: 1,
        emitting: false
      }).setDepth(6);
      this.trailV = this.add.particles(0, 0, "spark-violet", {
        speed: { min: 8, max: 30 },
        lifespan: { min: 300, max: 560 },
        scale: { start: 0.7, end: 0 },
        alpha: { start: 0.55, end: 0 },
        blendMode: "ADD",
        frequency: 40,
        quantity: 1,
        emitting: false
      }).setDepth(6);
    }

    bindInput() {
      this.cursors = this.input.keyboard.createCursorKeys();
      this.wasd = this.input.keyboard.addKeys("W,A,S,D");
      var self = this;
      this.input.keyboard.on("keydown", function (e) {
        if (!self.alive) return;
        var code = e.code;
        if (code === "ArrowUp" || code === "KeyW") self.queueDir(0, -1);
        else if (code === "ArrowDown" || code === "KeyS") self.queueDir(0, 1);
        else if (code === "ArrowLeft" || code === "KeyA") self.queueDir(-1, 0);
        else if (code === "ArrowRight" || code === "KeyD") self.queueDir(1, 0);
      });

      // Swipe
      this._swipe = { x: 0, y: 0, active: false };
      this.input.on("pointerdown", function (p) {
        self._swipe.x = p.x; self._swipe.y = p.y; self._swipe.active = true;
      });
      this.input.on("pointerup", function (p) {
        if (!self._swipe.active || !self.alive) return;
        self._swipe.active = false;
        var dx = p.x - self._swipe.x;
        var dy = p.y - self._swipe.y;
        if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
        if (Math.abs(dx) > Math.abs(dy)) self.queueDir(dx > 0 ? 1 : -1, 0);
        else self.queueDir(0, dy > 0 ? 1 : -1);
      });
    }

    queueDir(x, y) {
      var base = this.dirQueue.length
        ? this.dirQueue[this.dirQueue.length - 1]
        : this.nextDir;
      if (x === -base.x && y === -base.y) return;
      if (x === base.x && y === base.y) return;
      if (this.dirQueue.length < 2) this.dirQueue.push({ x: x, y: y });
    }

    cellKey(x, y) { return x + "," + y; }

    occupiedMap() {
      var o = {};
      var i;
      for (i = 0; i < this.snake.length; i++) o[this.cellKey(this.snake[i].x, this.snake[i].y)] = true;
      for (i = 0; i < this.holes.length; i++) o[this.cellKey(this.holes[i].x, this.holes[i].y)] = true;
      for (i = 0; i < this.foods.length; i++) o[this.cellKey(this.foods[i].x, this.foods[i].y)] = true;
      return o;
    }

    randomEmpty() {
      var occ = this.occupiedMap();
      var tries = 0, x, y;
      do {
        x = Phaser.Math.Between(0, this.cols - 1);
        y = Phaser.Math.Between(0, this.rows - 1);
        tries++;
      } while (occ[this.cellKey(x, y)] && tries < 400);
      if (occ[this.cellKey(x, y)]) return null;
      return { x: x, y: y };
    }

    spawnBlackHoles() {
      this.holes = [];
      this.holeSprites.forEach(function (s) { s.destroy(); });
      this.holeSprites = [];
      var n = this.diff.blackHoles || 0;
      var cx = Math.floor(this.cols / 2);
      var cy = Math.floor(this.rows / 2);
      for (var i = 0; i < n; i++) {
        var cell = this.randomEmpty();
        if (!cell) break;
        if (Math.abs(cell.x - cx) < 4 && Math.abs(cell.y - cy) < 3) {
          i--; continue;
        }
        this.holes.push(cell);
        var w = this.cellToWorld(cell.x, cell.y);
        var spr = this.add.image(w.x, w.y, "blackhole").setDepth(4).setBlendMode(Phaser.BlendModes.NORMAL);
        this.tweens.add({
          targets: spr, angle: 360, duration: 4000, repeat: -1,
          scale: { from: 0.9, to: 1.15 }, yoyo: true, ease: "Sine.easeInOut"
        });
        this.holeSprites.push(spr);
      }
    }

    ensureFoods() {
      while (this.foods.length < this.diff.foods) {
        var cell = this.randomEmpty();
        if (!cell) break;
        this.foods.push(cell);
        var w = this.cellToWorld(cell.x, cell.y);
        var spr = this.add.image(w.x, w.y, "food").setDepth(8).setBlendMode(Phaser.BlendModes.ADD);
        this.tweens.add({
          targets: spr, scale: 1.28, duration: 420, yoyo: true, repeat: -1, ease: "Sine.easeInOut"
        });
        this.foodSprites.push(spr);
      }
    }

    rebuildFoodSprites() {
      this.foodSprites.forEach(function (s) { s.destroy(); });
      this.foodSprites = [];
      var self = this;
      this.foods.forEach(function (f) {
        var w = self.cellToWorld(f.x, f.y);
        var spr = self.add.image(w.x, w.y, "food").setDepth(8).setBlendMode(Phaser.BlendModes.ADD);
        self.tweens.add({
          targets: spr, scale: 1.28, duration: 420, yoyo: true, repeat: -1, ease: "Sine.easeInOut"
        });
        self.foodSprites.push(spr);
      });
    }

    buildSnakeSprites() {
      this.segSprites.forEach(function (s) { s.destroy(); });
      this.segSprites = [];
      for (var i = 0; i < this.snake.length; i++) {
        var key = i === 0 ? "seg-head" : (i === this.snake.length - 1 ? "seg-tail" : "seg-body");
        var w = this.cellToWorld(this.snake[i].x, this.snake[i].y);
        var spr = this.add.image(w.x, w.y, key).setDepth(10);
        if (i === 0) spr.setBlendMode(Phaser.BlendModes.ADD);
        this.segSprites.push(spr);
      }
    }

    syncSnakeSprites(progress) {
      // 視覺插值：頭往下一步移動，尾部收縮
      var nextHead = {
        x: this.snake[0].x + this.dir.x,
        y: this.snake[0].y + this.dir.y
      };
      if (this.diff.wrapWalls) {
        nextHead.x = (nextHead.x + this.cols) % this.cols;
        nextHead.y = (nextHead.y + this.rows) % this.rows;
      }

      while (this.segSprites.length < this.snake.length) {
        var spr = this.add.image(0, 0, "seg-body").setDepth(10);
        this.segSprites.push(spr);
      }
      while (this.segSprites.length > this.snake.length) {
        var dead = this.segSprites.pop();
        dead.destroy();
      }

      for (var i = 0; i < this.snake.length; i++) {
        var cur = this.snake[i];
        var prev = i === 0 ? nextHead : this.snake[i - 1];
        // 穿牆插值不跨場：若跳躍過大則直接跳格
        var dx = prev.x - cur.x;
        var dy = prev.y - cur.y;
        var ix = cur.x;
        var iy = cur.y;
        if (Math.abs(dx) + Math.abs(dy) === 1 || (this.diff.wrapWalls && (Math.abs(dx) === this.cols - 1 || Math.abs(dy) === this.rows - 1))) {
          // wrap 時用邏輯方向插值
          if (Math.abs(dx) > 1) dx = dx > 0 ? -1 : 1;
          if (Math.abs(dy) > 1) dy = dy > 0 ? -1 : 1;
          ix = cur.x + dx * progress;
          iy = cur.y + dy * progress;
        }
        var wx = this.originX + ix * CELL + CELL / 2;
        var wy = this.originY + iy * CELL + CELL / 2;
        var s = this.segSprites[i];
        s.setPosition(wx, wy);
        s.setTexture(i === 0 ? "seg-head" : (i === this.snake.length - 1 ? "seg-tail" : "seg-body"));
        s.setAlpha(i === 0 ? 1 : 0.75 + 0.25 * (1 - i / this.snake.length));
      }

      // 蛇尾拖尾粒子
      if (this.snake.length > 1) {
        var tail = this.segSprites[this.segSprites.length - 1];
        if (tail) {
          this.trail.setPosition(tail.x, tail.y);
          this.trailV.setPosition(tail.x, tail.y);
          if (!this.trail.emitting) {
            this.trail.start();
            this.trailV.start();
          }
        }
      }
    }

    isHole(x, y) {
      for (var i = 0; i < this.holes.length; i++) {
        if (this.holes[i].x === x && this.holes[i].y === y) return true;
      }
      return false;
    }

    isWallDanger(hx, hy) {
      if (this.diff.wrapWalls) return false;
      return hx <= 0 || hx >= this.cols - 1 || hy <= 0 || hy >= this.rows - 1;
    }

    checkBulletTime() {
      var head = this.snake[0];
      var danger = false;

      // 距牆 1 格
      if (!this.diff.wrapWalls) {
        if (head.x <= 0 || head.x >= this.cols - 1 || head.y <= 0 || head.y >= this.rows - 1) danger = true;
        var fx = head.x + this.dir.x;
        var fy = head.y + this.dir.y;
        if (fx < 0 || fx >= this.cols || fy < 0 || fy >= this.rows) danger = true;
        if (this.isHole(fx, fy)) danger = true;
      }

      // 距自身身體 1 格
      for (var i = 3; i < this.snake.length; i++) {
        var s = this.snake[i];
        if (Math.abs(head.x - s.x) + Math.abs(head.y - s.y) === 1) danger = true;
      }
      for (var h = 0; h < this.holes.length; h++) {
        if (Math.abs(head.x - this.holes[h].x) + Math.abs(head.y - this.holes[h].y) === 1) danger = true;
      }

      if (danger && !this.nearMiss) {
        this.nearMiss = true;
        this.bulletTime = Math.max(this.bulletTime, 0.3);
        SFX.bullet();
        doShake(this.cameras.main, 80, 0.008);
        this.tweens.add({
          targets: this.vignette,
          fillAlpha: 0.12,
          duration: 80,
          yoyo: true,
          hold: 160,
          ease: "Cubic.easeOut"
        });
      }
      if (!danger) this.nearMiss = false;
    }

    stepSnake() {
      if (this.dirQueue.length) {
        var nd = this.dirQueue.shift();
        if (!(nd.x === -this.dir.x && nd.y === -this.dir.y)) this.nextDir = nd;
      }
      this.dir = { x: this.nextDir.x, y: this.nextDir.y };

      var head = {
        x: this.snake[0].x + this.dir.x,
        y: this.snake[0].y + this.dir.y
      };

      if (this.diff.wrapWalls) {
        head.x = (head.x + this.cols) % this.cols;
        head.y = (head.y + this.rows) % this.rows;
      } else {
        if (head.x < 0 || head.x >= this.cols || head.y < 0 || head.y >= this.rows) {
          this.die();
          return false;
        }
      }

      if (this.isHole(head.x, head.y)) {
        this.die();
        return false;
      }

      for (var i = 0; i < this.snake.length; i++) {
        if (this.snake[i].x === head.x && this.snake[i].y === head.y) {
          this.die();
          return false;
        }
      }

      this.snake.unshift(head);

      var ateIdx = -1;
      for (var f = 0; f < this.foods.length; f++) {
        if (this.foods[f].x === head.x && this.foods[f].y === head.y) {
          ateIdx = f;
          break;
        }
      }

      if (ateIdx >= 0) {
        this.eatFood(ateIdx, head);
      } else {
        this.snake.pop();
      }

      this.checkBulletTime();
      return true;
    }

    eatFood(idx, head) {
      this.combo++;
      this.maxCombo = Math.max(this.maxCombo, this.combo);
      this.comboTimer = 4.2;

      var comboMult = 1 + this.combo * 0.5;
      var pts = Math.floor(10 * comboMult * this.diff.scoreMult * (0.9 + this.dangerMultiplier * 0.2));
      this.score += pts;

      var w = this.cellToWorld(head.x, head.y);
      SFX.eat(this.combo);
      doShake(this.cameras.main, 120, 0.015);
      neonBurst(this, w.x, w.y, "spark-gold", 20);
      neonBurst(this, w.x, w.y, "spark-cyan", 12);

      // 食物彈簧放大（在爆前用殘影）
      var ghost = this.add.image(w.x, w.y, "food").setDepth(25).setBlendMode(Phaser.BlendModes.ADD);
      this.tweens.add({
        targets: ghost,
        scale: 2.4,
        alpha: 0,
        duration: 320,
        ease: "Back.easeOut",
        onComplete: function () { ghost.destroy(); }
      });

      var floater = this.add.text(w.x, w.y - 8, "+" + pts + (this.combo > 1 ? "  x" + this.combo : ""), {
        fontFamily: "Segoe UI, sans-serif",
        fontSize: "20px",
        fontStyle: "bold",
        color: "#fbbf24"
      }).setOrigin(0.5).setDepth(28);
      this.tweens.add({
        targets: floater,
        y: w.y - 56,
        alpha: 0,
        scale: 1.3,
        duration: 500,
        ease: "Cubic.easeOut",
        onComplete: function () { floater.destroy(); }
      });

      // 加速一點點（被 danger 曲線主導，這裡微調）
      this.stepInterval = Math.max(0.045, this.stepInterval - 0.002);

      this.foods.splice(idx, 1);
      this.rebuildFoodSprites();
      this.ensureFoods();
    }

    die() {
      if (!this.alive) return;
      this.alive = false;
      this.trail.stop();
      this.trailV.stop();
      SFX.die();

      // 全螢幕白光閃爍
      this.flash.setAlpha(0.85);
      this.tweens.add({
        targets: this.flash,
        alpha: 0,
        duration: 420,
        ease: "Cubic.easeOut"
      });
      doShake(this.cameras.main, 280, 0.03);

      var head = this.snake[0];
      var w = this.cellToWorld(head.x, head.y);
      neonBurst(this, w.x, w.y, "spark-pink", 28);
      neonBurst(this, w.x, w.y, "spark-cyan", 22);
      neonBurst(this, w.x, w.y, "spark-violet", 18);

      // 蛇身碎片爆裂
      var self = this;
      this.segSprites.forEach(function (s, i) {
        self.tweens.add({
          targets: s,
          x: s.x + Phaser.Math.Between(-80, 80),
          y: s.y + Phaser.Math.Between(-80, 80),
          alpha: 0,
          scale: 0.2,
          angle: Phaser.Math.Between(-180, 180),
          duration: 450 + i * 18,
          ease: "Cubic.easeOut"
        });
      });

      var raw = this.score;
      var finalScore = Math.floor(raw);
      var meta = {
        slug: "neon-snake-extreme",
        difficulty: this.diff.id,
        rawScore: raw,
        maxCombo: this.maxCombo,
        length: this.snake.length,
        elapsed: Math.floor(this.elapsedTime),
        dangerPeak: Number(this.dangerMultiplier.toFixed(2))
      };

      try {
        if (typeof RNF !== "undefined" && RNF.submitScore) {
          RNF.submitScore(finalScore, meta);
        }
      } catch (_e) {}

      this.time.delayedCall(520, function () {
        self.scene.launch("GameOverModal", {
          score: finalScore,
          elapsed: self.elapsedTime,
          maxCombo: self.maxCombo,
          danger: self.dangerMultiplier,
          diff: self.diff
        });
      });
    }

    update(_t, delta) {
      if (!this.alive) return;

      var dt = Math.min(0.05, delta / 1000);
      this.elapsedTime += dt;

      // 動態危險曲線
      this.dangerMultiplier = 1 + Math.log(1 + this.elapsedTime / 30) * 0.8;
      var threat = this.dangerMultiplier;

      // Bullet Time 0.3s 慢動作
      if (this.bulletTime > 0) {
        this.bulletTime = Math.max(0, this.bulletTime - dt);
        this.timeScale = 0.32;
        this.hudBt.setText("BULLET TIME");
      } else {
        this.timeScale = 1;
        this.hudBt.setText("");
      }

      this.comboTimer = Math.max(0, this.comboTimer - dt);
      if (this.comboTimer <= 0 && this.combo > 0) {
        this.combo = Math.max(0, this.combo - 1);
        if (this.combo > 0) this.comboTimer = 1.1;
      }

      // 速度隨危險倍率提升（dt 解耦）
      var interval = Math.max(0.04, this.diff.baseSpeed / threat);
      this.stepInterval = interval;

      this.moveAcc += dt * this.timeScale;
      var steps = 0;
      while (this.moveAcc >= interval && steps < 3) {
        this.moveAcc -= interval;
        steps++;
        if (!this.stepSnake()) return;
      }
      this.moveProgress = interval > 0 ? Math.min(1, this.moveAcc / interval) : 0;
      this.syncSnakeSprites(this.moveProgress);

      this.hudScore.setText("SCORE " + this.score.toLocaleString());
      this.hudDanger.setText("DANGER x" + this.dangerMultiplier.toFixed(2));
      this.hudCombo.setText(this.combo > 0 ? "COMBO x" + this.combo : "COMBO —");
      this.hudTime.setText(this.elapsedTime.toFixed(1) + "s");
    }
  }

  /* ═══════════════ GameOverModal ═══════════════ */
  class GameOverModal extends Phaser.Scene {
    constructor() { super("GameOverModal"); }
    init(data) { this.payload = data || {}; }

    create() {
      var score = this.payload.score || 0;
      var elapsed = this.payload.elapsed || 0;
      var maxCombo = this.payload.maxCombo || 0;
      var danger = this.payload.danger || 1;
      var diff = this.payload.diff || DIFF.standard;

      this.add.rectangle(W / 2, H / 2, W, H, 0x02040a, 0.72).setInteractive();
      var panel = this.add.rectangle(W / 2, H / 2, 460, 380, 0x0b1220, 0.97)
        .setStrokeStyle(2, 0x22d3ee, 0.95).setScale(0.7).setAlpha(0);

      var badge = this.add.text(W / 2, H / 2 - 150, "GAME OVER", {
        fontFamily: "Segoe UI, sans-serif", fontSize: "13px", fontStyle: "bold",
        color: "#22d3ee", letterSpacing: 3
      }).setOrigin(0.5).setAlpha(0);

      var title = this.add.text(W / 2, H / 2 - 112, "霓虹結算", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "30px", fontStyle: "bold", color: "#ffffff"
      }).setOrigin(0.5).setAlpha(0);

      var scoreTxt = this.add.text(W / 2, H / 2 - 40, score.toLocaleString(), {
        fontFamily: "Segoe UI, sans-serif", fontSize: "54px", fontStyle: "bold", color: "#67e8f9"
      }).setOrigin(0.5).setScale(0.4).setAlpha(0);

      var meta = this.add.text(W / 2, H / 2 + 30,
        diff.label +
        "\n生存 " + elapsed.toFixed(1) + "s  ·  最高 Combo x" + maxCombo +
        "  ·  DANGER x" + Number(danger).toFixed(2) +
        "\n已執行 RNF.submitScore → 排行榜", {
        fontFamily: "Microsoft JhengHei, Segoe UI, sans-serif",
        fontSize: "13px", color: "#94a3b8", align: "center", lineSpacing: 6
      }).setOrigin(0.5).setAlpha(0);

      this.tweens.add({ targets: panel, alpha: 1, scale: 1, duration: 380, ease: "Back.easeOut" });
      this.tweens.add({ targets: [badge, title, meta], alpha: 1, duration: 300, ease: "Cubic.easeOut", delay: 80 });
      this.tweens.add({
        targets: scoreTxt, alpha: 1, scale: 1, duration: 480, ease: "Back.easeOut", delay: 100
      });

      neonBurst(this, W / 2, H / 2 - 40, "spark-cyan", 22);
      neonBurst(this, W / 2, H / 2 - 40, "spark-violet", 16);

      var self = this;
      makeButton(this, W / 2 - 110, H / 2 + 130, "再試一次", 0x22d3ee, function () {
        SFX.confirm();
        self.scene.stop("GameOverModal");
        self.scene.stop("GameScene");
        self.scene.start("GameScene", { difficulty: selectedDiff });
      }, 180);

      makeButton(this, W / 2 + 110, H / 2 + 130, "設定選單", 0xa78bfa, function () {
        self.scene.launch("SettingsScene");
      }, 180);

      makeButton(this, W / 2, H / 2 + 190, "主選單", 0x64748b, function () {
        SFX.click();
        self.scene.stop("GameOverModal");
        self.scene.stop("SettingsScene");
        self.scene.stop("GameScene");
        self.scene.start("MainMenuScene");
      }, 200);
    }
  }

  var config = {
    type: Phaser.WEBGL,
    parent: "game-host",
    width: W,
    height: H,
    backgroundColor: "#04060c",
    banner: false,
    audio: { disableWebAudio: false },
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    fps: { target: 144, forceSet: false, smoothStep: true },
    scene: [BootScene, MainMenuScene, DifficultyScene, GameScene, GameOverModal, SettingsScene]
  };

  // WEBGL 失敗時退回 AUTO
  try {
    window.__NEON_SNAKE__ = new Phaser.Game(config);
  } catch (_e) {
    config.type = Phaser.AUTO;
    window.__NEON_SNAKE__ = new Phaser.Game(config);
  }
})();
</script>
